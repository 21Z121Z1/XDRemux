[package]
name = "xdremux-runtime"
version = "0.1.0"
edition.workspace = true

[dependencies]
atomic-write-file = "=0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
uuid = { version = "=1.26.0", features = ["v4"] }
xdremux-classification = { path = "../xdremux-classification" }
xdremux-codec = { path = "../xdremux-codec" }
xdremux-container = { path = "../xdremux-container" }
xdremux-engine = { path = "../xdremux-engine" }
xdremux-format = { path = "../xdremux-format" }
xdremux-hdr = { path = "../xdremux-hdr" }
xdremux-heif = { path = "../xdremux-heif" }
xdremux-metadata = { path = "../xdremux-metadata" }
xdremux-motion-photo = { path = "../xdremux-motion-photo" }
xdremux-source = { path = "../xdremux-source" }

[dev-dependencies]
jpeg-encoder = "=0.7.1"

[lints]
workspace = true
