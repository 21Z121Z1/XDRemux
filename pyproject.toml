[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xdremux-python-tools"
description = "Migration-time conformance and research tooling for XDRemux"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
keywords = ["heic", "hdr", "gain-map", "iso21496", "proxdr", "oppo"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pillow-heif>=0.15.0",
    "Pillow>=11.0.0",
    "numpy>=2.0.0",
    "piexif>=1.1.3",
]

[project.optional-dependencies]
training = [
    "torch>=2.6.0",
]

[project.urls]
Homepage = "https://github.com/21Z121Z1/XDRemux"
Documentation = "https://github.com/21Z121Z1/XDRemux/blob/main/docs/development.md"

[tool.hatch.version]
path = "xdremux_py/__init__.py"

# Flat layout on purpose: CI and validation scripts run from the repository
# root without installing a second XDRemux product entry point.
[tool.hatch.build.targets.wheel]
packages = ["xdremux_py"]

# Anchored patterns: an unanchored "README.md" would also pull in Tests/README.md
# and xdremux/README.md. docs/ is VCS-ignored and cannot be packaged.
[tool.hatch.build.targets.sdist]
include = [
    "/xdremux_py",
    "/README.md",
    "/README.en.md",
]
