name: XDRemuxApp
options:
  bundleIdPrefix: com.proxdr
targets:
  XDRemuxApp:
    type: application
    platform: macOS
    deploymentTarget: 15.0
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "-"
      ENABLE_APP_SANDBOX: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
      INFOPLIST_KEY_NSPrincipalClass: NSApplication
      GENERATE_INFOPLIST_FILE: YES
    preBuildScripts:
      - name: Build Shared Apple Feature CLI
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          RESOURCE_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$RESOURCE_DIR"
          xcrun swiftc -O \
            "$SRCROOT/../../../xdremux/swift-cli/XDRemux.swift" \
            -o "$RESOURCE_DIR/XDRemuxCLI"
          rm -rf "$RESOURCE_DIR/ApplePlatform"
          mkdir -p "$RESOURCE_DIR/ApplePlatform"
          ditto "$SRCROOT/../../../xdremux/apple-platform/Native" \
            "$RESOURCE_DIR/ApplePlatform/Native"
          ditto "$SRCROOT/../../../xdremux/apple-platform/Validation" \
            "$RESOURCE_DIR/ApplePlatform/Validation"
          touch "$RESOURCE_DIR/ApplePlatform/.complete"
