name: XDRemux Rust Performance and Design

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "Sources/XDRemuxAppleAdapter/**"
      - "apps/macos/XDRemuxApp/Sources/**"
      - "Tests/test_performance_design.py"
      - "scripts/benchmark_rust_product.py"
      - "scripts/check_rust_cli_smoke.sh"
      - ".github/workflows/performance.yml"
  push:
    branches:
      - main
      - feat/rust-cli-unification
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "Sources/XDRemuxAppleAdapter/**"
      - "apps/macos/XDRemuxApp/Sources/**"
      - "Tests/test_performance_design.py"
      - "scripts/benchmark_rust_product.py"
      - "scripts/check_rust_cli_smoke.sh"
      - ".github/workflows/performance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xdremux-performance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-performance:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record benchmark environment
        shell: bash
        run: |
          mkdir -p artifacts/performance
          {
            echo "head=$(git rev-parse HEAD)"
            sw_vers
            echo "arch=$(uname -m)"
            xcodebuild -version
            swift --version
          } | tee artifacts/performance/environment.txt

      - name: Install portable HEVC provider
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build optimized Rust product
        shell: bash
        run: |
          cargo build --locked --workspace --all-targets --release \
            2>&1 | tee artifacts/performance/rust-release-build.log

      - name: Build release Apple primitive adapter
        shell: bash
        run: |
          swift build -c release --product xdremux-apple-adapter \
            2>&1 | tee artifacts/performance/apple-adapter-build.log
          echo "XDREMUX_PERF_APPLE_ADAPTER=$(swift build -c release --show-bin-path)/xdremux-apple-adapter" >> "$GITHUB_ENV"

      - name: Check Rust performance design invariants
        shell: bash
        run: |
          python3 -m unittest Tests.test_performance_design \
            2>&1 | tee artifacts/performance/design-policy.log
          cargo test --locked --workspace --all-targets --release \
            2>&1 | tee artifacts/performance/rust-release-tests.log

      - name: Exercise optimized product routes
        shell: bash
        env:
          XDREMUX_CLI: ${{ github.workspace }}/target/release/xdremux
        run: |
          bash scripts/check_rust_cli_smoke.sh \
            2>&1 | tee artifacts/performance/rust-cli-smoke.log

      - name: Measure representative end-to-end product workloads
        shell: bash
        run: |
          python3 scripts/benchmark_rust_product.py \
            --cli "$GITHUB_WORKSPACE/target/release/xdremux" \
            --apple-adapter "$XDREMUX_PERF_APPLE_ADAPTER" \
            --warmup 1 \
            --iterations 5 \
            --output artifacts/performance/product-benchmark.json \
            2>&1 | tee artifacts/performance/product-benchmark.log

      - name: Build and run macOS app model integration
        shell: bash
        env:
          XDREMUX_DERIVED_DATA: ${{ runner.temp }}/xdremux-app-model-tests
        run: |
          xcodebuild \
            -quiet \
            -project apps/macos/XDRemuxApp/XDRemuxApp.xcodeproj \
            -scheme XDRemuxAppModelTests \
            -configuration Debug \
            -derivedDataPath "$XDREMUX_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build
          XDREMUX_CLI="$GITHUB_WORKSPACE/target/release/xdremux" \
            "$XDREMUX_DERIVED_DATA/Build/Products/Debug/XDRemuxAppModelTests" \
            2>&1 | tee artifacts/performance/app-model.log

      - name: Run exact-HEAD Rust completion gate
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          runner_temp = os.environ["RUNNER_TEMP"]
          app_build = (
              "xcodebuild -quiet "
              "-project apps/macos/XDRemuxApp/XDRemuxApp.xcodeproj "
              "-scheme XDRemuxAppModelTests -configuration Debug "
              f"-derivedDataPath '{runner_temp}/xdremux-gate-app' "
              "CODE_SIGNING_ALLOWED=NO build && "
              f"XDREMUX_CLI='$GITHUB_WORKSPACE/target/release/xdremux' "
              f"'{runner_temp}/xdremux-gate-app/Build/Products/Debug/XDRemuxAppModelTests'"
          )
          plan = {
              "schema_version": 1,
              "scope": "Canonical Rust product release build, performance evidence, design invariants, and macOS app integration",
              "checks": [
                  {
                      "name": "rust-release-build",
                      "kind": "static",
                      "command": ["cargo", "build", "--locked", "--workspace", "--all-targets", "--release"],
                      "timeout_seconds": 1800,
                  },
                  {
                      "name": "rust-release-regressions",
                      "kind": "regression",
                      "command": ["cargo", "test", "--locked", "--workspace", "--all-targets", "--release"],
                      "timeout_seconds": 2400,
                  },
                  {
                      "name": "performance-design-policy",
                      "kind": "regression",
                      "command": ["python3", "-m", "unittest", "Tests.test_performance_design"],
                      "timeout_seconds": 120,
                  },
                  {
                      "name": "rust-cli-release-smoke",
                      "kind": "integration",
                      "command": ["bash", "scripts/check_rust_cli_smoke.sh"],
                      "timeout_seconds": 900,
                  },
                  {
                      "name": "macos-app-model-integration",
                      "kind": "integration",
                      "command": ["/bin/bash", "-lc", app_build],
                      "timeout_seconds": 1200,
                  },
              ],
          }
          Path("/tmp/xdremux-agent-verification.json").write_text(
              json.dumps(plan, indent=2) + "\n", encoding="utf-8"
          )
          PY
          python3 scripts/agent_completion_gate.py run \
            --base origin/main \
            --plan /tmp/xdremux-agent-verification.json
          HEAD_SHA="$(git rev-parse HEAD)"
          python3 scripts/agent_completion_gate.py verify \
            ".codex/verification-receipts/${HEAD_SHA}.json"
          cp ".codex/verification-receipts/${HEAD_SHA}.json" \
            artifacts/performance/completion-receipt.json

      - name: Write performance summary
        if: always()
        shell: bash
        run: |
          {
            echo "## XDRemux Rust performance and design"
            echo
            echo "The workflow measures representative end-to-end release CLI workloads. Timed regions include source I/O, parsing, codec work, publication, and Apple adapter/framework overhead where applicable."
            echo "Measurements are evidence only until repeated stable-runner samples justify committed regression budgets."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -s artifacts/performance/product-benchmark.json ]]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/performance/product-benchmark.json").read_text())
          print("| workload | median | p95 | max RSS | median input throughput |")
          print("| --- | ---: | ---: | ---: | ---: |")
          for case in report["cases"]:
              print(
                  f"| {case['name']} | {case['median_wall_seconds']:.3f}s | "
                  f"{case['p95_wall_seconds']:.3f}s | "
                  f"{case['max_peak_rss_bytes'] / (1024 * 1024):.1f} MiB | "
                  f"{case['median_input_mib_per_second']:.1f} MiB/s |"
              )
          PY
          fi

      - name: Upload performance measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xdremux-rust-performance
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/performance/
