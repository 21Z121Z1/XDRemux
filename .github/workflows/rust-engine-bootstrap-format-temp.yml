name: Temporary Rust engine formatter

on:
  push:
    branches:
      - feat/rust-xdremux-format
    paths:
      - ".github/workflows/rust-engine-bootstrap-format-temp.yml"

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-xdremux-format
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply Clippy-guided defaults cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/xdremux-engine/src/lib.rs")
          text = path.read_text()
          replacements = [
              (
                  "#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum FamilyPreference {\n    Auto,\n    X6,\n    X7,\n}\n\nimpl Default for FamilyPreference {\n    fn default() -> Self {\n        Self::Auto\n    }\n}\n",
                  "#[derive(Debug, Clone, Copy, PartialEq, Eq, Default)]\npub enum FamilyPreference {\n    #[default]\n    Auto,\n    X6,\n    X7,\n}\n",
              ),
              (
                  "#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum InputProcessingBranch {\n    System,\n    SystemDecoded,\n    Hybrid,\n    Passthrough,\n}\n\nimpl Default for InputProcessingBranch {\n    fn default() -> Self {\n        Self::Hybrid\n    }\n}\n",
                  "#[derive(Debug, Clone, Copy, PartialEq, Eq, Default)]\npub enum InputProcessingBranch {\n    System,\n    SystemDecoded,\n    #[default]\n    Hybrid,\n    Passthrough,\n}\n",
              ),
              (
                  "#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum TmapFormat {\n    Strict,\n    ImageIo,\n}\n\nimpl Default for TmapFormat {\n    fn default() -> Self {\n        Self::ImageIo\n    }\n}\n",
                  "#[derive(Debug, Clone, Copy, PartialEq, Eq, Default)]\npub enum TmapFormat {\n    Strict,\n    #[default]\n    ImageIo,\n}\n",
              ),
              (
                  "#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum OppoCompatibility {\n    Auto,\n    Iso,\n    IsoNoLocal,\n    IsoGraph,\n    On,\n    Tail,\n    Off,\n}\n\nimpl Default for OppoCompatibility {\n    fn default() -> Self {\n        Self::Off\n    }\n}\n",
                  "#[derive(Debug, Clone, Copy, PartialEq, Eq, Default)]\npub enum OppoCompatibility {\n    Auto,\n    Iso,\n    IsoNoLocal,\n    IsoGraph,\n    On,\n    Tail,\n    #[default]\n    Off,\n}\n",
              ),
              (
                  "#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum OppoCameraTail {\n    Off,\n    Watermark,\n    Compact,\n    Preserve,\n    PreserveWithoutPortrait,\n    PreserveWithoutPortraitOrPrivateHdr,\n    PreserveWithoutPrivateUhdr,\n    PreserveWithoutPrivateHdr,\n    PreserveNoUhdr,\n    PreserveNoHdr,\n}\n\nimpl Default for OppoCameraTail {\n    fn default() -> Self {\n        Self::PreserveWithoutPrivateHdr\n    }\n}\n",
                  "#[derive(Debug, Clone, Copy, PartialEq, Eq, Default)]\npub enum OppoCameraTail {\n    Off,\n    Watermark,\n    Compact,\n    Preserve,\n    PreserveWithoutPortrait,\n    PreserveWithoutPortraitOrPrivateHdr,\n    PreserveWithoutPrivateUhdr,\n    #[default]\n    PreserveWithoutPrivateHdr,\n    PreserveNoUhdr,\n    PreserveNoHdr,\n}\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one default impl site, found {count}")
              text = text.replace(old, new)

          old = """        let mut request = ConversionRequest::default();
        request.input_processing_branch = InputProcessingBranch::Passthrough;
        request.oppo_camera_tail = OppoCameraTail::Off;
"""
          new = """        let request = ConversionRequest {
            input_processing_branch: InputProcessingBranch::Passthrough,
            oppo_camera_tail: OppoCameraTail::Off,
            ..ConversionRequest::default()
        };
"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one test request reassignment site, found {count}")
          path.write_text(text.replace(old, new))

          path = Path("crates/xdremux-engine/src/bin/xdremux-engine-vectors.rs")
          text = path.read_text()
          old = """    let mut request = ConversionRequest::default();
    request.input_processing_branch = InputProcessingBranch::Passthrough;
    request.oppo_camera_tail = OppoCameraTail::Off;
    request.tmap_format = TmapFormat::Strict;
"""
          new = """    let request = ConversionRequest {
        input_processing_branch: InputProcessingBranch::Passthrough,
        oppo_camera_tail: OppoCameraTail::Off,
        tmap_format: TmapFormat::Strict,
        ..ConversionRequest::default()
    };
"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one vector request reassignment site, found {count}")
          path.write_text(text.replace(old, new))
          PY
      - name: Apply canonical rustfmt
        run: cargo fmt --all
      - name: Verify engine
        run: |
          cargo clippy --locked -p xdremux-engine --all-targets -- -D warnings
          cargo test --locked -p xdremux-engine
          bash scripts/check_engine_plan_vectors.sh
      - name: Commit verified formatting and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/xdremux-engine
          if git diff --cached --quiet; then
            echo "no engine changes"
          else
            git commit -m "refactor(rust): normalize conversion planner defaults"
            git push origin HEAD:feat/rust-xdremux-format
          fi
