          if old not in text:
              raise SystemExit('CLI Motion Photo placeholder changed')
          cli.write_text(text.replace(old, new, 1))

          cargo = Path('crates/xdremux-cli/Cargo.toml')
          text = cargo.read_text()
          old = 'xdremux-heif = { path = "../xdremux-heif" }\n'
          new = old + 'xdremux-motion-photo = { path = "../xdremux-motion-photo" }\n'
          if old not in text:
              raise SystemExit('CLI dev dependency insertion point changed')
          cargo.write_text(text.replace(old, new, 1))
          PY

          cat > crates/xdremux-runtime/tests/live_photo_fixture.rs <<'RS'
          use std::fs;
          use std::path::PathBuf;
          use std::time::{SystemTime, UNIX_EPOCH};

          use xdremux_motion_photo::{
              read_apple_content_identifier, read_live_photo_content_identifier,
              read_live_photo_still_time, validate_live_photo_movie,
          };
          use xdremux_runtime::PortableRuntime;

          fn fixture() -> PathBuf {
              PathBuf::from(env!("CARGO_MANIFEST_DIR"))
                  .join("../../fixtures/motion-photo/samsung/heif-ultrahdr-01.heic")
          }

          #[test]
          fn real_samsung_heif_motion_photo_becomes_valid_live_photo_pair() {
              let source_path = fixture();
              let source = fs::read(&source_path).expect("versioned Samsung fixture must be readable");
              let stamp = SystemTime::now()
                  .duration_since(UNIX_EPOCH)
                  .unwrap()
                  .as_nanos();
              let dir = std::env::temp_dir().join(format!(
                  "xdremux-runtime-live-photo-{}-{stamp}",
                  std::process::id()
              ));
              fs::create_dir_all(&dir).unwrap();
              let image = dir.join("capture.heic");

              let receipt = PortableRuntime::new()
                  .convert_motion_photo_file(&source, &source_path, &image)
                  .expect("Rust runtime must convert the real HEIF Motion Photo");
              let still = fs::read(&receipt.image).unwrap();
              let movie = fs::read(&receipt.video).unwrap();
              let still_id = read_apple_content_identifier(&still).unwrap().unwrap();
              let movie_id = read_live_photo_content_identifier(&movie).unwrap().unwrap();
              assert_eq!(still_id, receipt.content_identifier);
              assert_eq!(movie_id, receipt.content_identifier);
              let still_time = read_live_photo_still_time(&movie).unwrap().unwrap();
              assert!((still_time - receipt.still_time_seconds).abs() < 1.0 / 600.0);
              validate_live_photo_movie(&movie, &movie_id, receipt.still_time_seconds).unwrap();
              assert_eq!(receipt.source_kind, "androidHeifMotionPhotoV1");

              fs::remove_dir_all(dir).unwrap();
          }
          RS

          cat > crates/xdremux-cli/tests/live_photo.rs <<'RS'
          use std::ffi::OsString;
          use std::fs;
          use std::path::{Path, PathBuf};
          use std::time::{SystemTime, UNIX_EPOCH};

          use xdremux_motion_photo::{
              read_apple_content_identifier, read_live_photo_content_identifier,
              read_live_photo_still_time, validate_live_photo_movie,
          };

          fn fixture() -> PathBuf {
              PathBuf::from(env!("CARGO_MANIFEST_DIR"))
                  .join("../../fixtures/motion-photo/samsung/heif-ultrahdr-01.heic")
          }

          fn arg(path: &Path) -> OsString {
              path.as_os_str().to_owned()
          }

          #[test]
          fn convert_command_executes_full_rust_live_photo_pipeline() {
              let stamp = SystemTime::now()
                  .duration_since(UNIX_EPOCH)
                  .unwrap()
                  .as_nanos();
              let dir = std::env::temp_dir().join(format!(
                  "xdremux-cli-live-photo-{}-{stamp}",
                  std::process::id()
              ));
              fs::create_dir_all(&dir).unwrap();
              let input = fixture();
              let image = dir.join("capture.heic");
              let movie = dir.join("capture.mov");
              let args = vec![
                  OsString::from("convert"),
                  OsString::from("--input"),
                  arg(&input),
                  OsString::from("--output"),
                  arg(&image),
              ];
              let mut stdout = Vec::new();
              let mut stderr = Vec::new();
              let code = xdremux_cli::run_from(args, &mut stdout, &mut stderr);
              assert_eq!(
                  code,
                  0,
                  "CLI Live Photo conversion failed: {}",
                  String::from_utf8_lossy(&stderr)
              );
              assert!(stderr.is_empty());
              assert!(image.is_file());
              assert!(movie.is_file());

              let still = fs::read(&image).unwrap();
              let video = fs::read(&movie).unwrap();
              let still_id = read_apple_content_identifier(&still).unwrap().unwrap();
              let movie_id = read_live_photo_content_identifier(&video).unwrap().unwrap();
              assert_eq!(still_id, movie_id);
              let still_time = read_live_photo_still_time(&video).unwrap().unwrap();
              validate_live_photo_movie(&video, &movie_id, still_time).unwrap();
              assert!(String::from_utf8(stdout).unwrap().contains(" + "));
              fs::remove_dir_all(dir).unwrap();
          }
          RS

          cargo generate-lockfile
          cargo fmt --all
          git diff --check
      - name: Lint and test the Rust-only slice
        run: |
          cargo clippy --locked -p xdremux-motion-photo -p xdremux-runtime -p xdremux-source -p xdremux-cli --all-targets -- -D warnings
          cargo test --locked -p xdremux-motion-photo
          cargo test --locked -p xdremux-runtime --test live_photo_fixture -- --nocapture
          cargo test --locked -p xdremux-cli --test convert --test live_photo -- --nocapture
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Cargo.lock \
            crates/xdremux-runtime \
            crates/xdremux-cli
          git commit -m 'feat(rust-runtime): convert HEIF Motion Photo pairs'
          git push origin HEAD:feat/rust-cli-unification
