name: Implement Rust Live Photo runtime slice

on:
  push:
    branches: [feat/rust-cli-unification]
    paths:
      - .github/workflows/implement-rust-live-photo-runtime.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
          fetch-depth: 0
      - name: Install portable HEVC provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libheif-plugin-x265 libheif-plugin-libde265
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Wire Motion Photo runtime and CLI
        run: |
          python3 scripts/implement_live_photo_runtime.py
          cargo generate-lockfile
          cargo fmt --all
          git diff --check
      - name: Lint and test Rust-only Live Photo execution
        run: |
          cargo clippy --locked -p xdremux-motion-photo -p xdremux-runtime -p xdremux-source -p xdremux-cli --all-targets -- -D warnings
          cargo test --locked -p xdremux-motion-photo
          cargo test --locked -p xdremux-runtime --test live_photo_fixture -- --nocapture
          cargo test --locked -p xdremux-cli --test convert --test live_photo -- --nocapture
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/xdremux-runtime crates/xdremux-cli
          git diff --cached --check
          git commit -m 'feat(rust-runtime): convert HEIF Motion Photo pairs'
          git push origin HEAD:feat/rust-cli-unification
