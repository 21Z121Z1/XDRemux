name: Implement Rust Live Photo runtime slice

on:
  push:
    branches: [feat/rust-cli-unification]
    paths:
      - .github/workflows/implement-rust-live-photo-runtime.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
          fetch-depth: 0
      - name: Install portable HEVC provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libheif-plugin-x265 libheif-plugin-libde265
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Wire Motion Photo runtime and CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('crates/xdremux-runtime/src/lib.rs')
          text = runtime.read_text()
          old = '#![forbid(unsafe_code)]\n\nuse std::error::Error;'
          new = '#![forbid(unsafe_code)]\n\nmod live_photo;\n\npub use live_photo::LivePhotoFileReceipt;\n\nuse std::error::Error;'
          if old not in text:
              raise SystemExit('runtime module insertion point changed')
          text = text.replace(old, new, 1)
          text = text.replace('    fn new(context:', '    pub(crate) fn new(context:', 1)
          text = text.replace('    fn external(context:', '    pub(crate) fn external(context:', 1)
          old = '''        Ok(FileConversionReceipt {
            plan: receipt.plan,
            output: receipt.published,
        })
    }
}

pub fn analyze_proxdr'''
          new = '''        Ok(FileConversionReceipt {
            plan: receipt.plan,
            output: receipt.published,
        })
    }

    pub fn convert_motion_photo_file(
        &self,
        source: &[u8],
        input: impl AsRef<Path>,
        output: impl AsRef<Path>,
    ) -> Result<LivePhotoFileReceipt> {
        live_photo::convert_heif_motion_photo_file(source, input.as_ref(), output.as_ref())
    }
}

pub fn analyze_proxdr'''
          if old not in text:
              raise SystemExit('runtime PortableRuntime insertion point changed')
          runtime.write_text(text.replace(old, new, 1))

          cli = Path('crates/xdremux-cli/src/lib.rs')
          text = cli.read_text()
          text = text.replace('use std::path::PathBuf;', 'use std::path::{Path, PathBuf};', 1)
          text = text.replace(
              '  convert --input <INPUT> [--output <OUT>] Convert ProXDR through the unified Rust runtime',
              '  convert --input <INPUT> [--output <OUT>] Convert through the unified Rust runtime',
              1,
          )
          text = text.replace(
              'Convert one ProXDR image with the unified Rust engine/runtime.',
              'Convert one supported source with the unified Rust engine/runtime.',
              1,
          )
          text = text.replace(
              '      --input <INPUT>    Input ProXDR HEIC',
              '      --input <INPUT>    Input ProXDR HEIC or supported Motion Photo',
              1,
          )
          text = text.replace(
              '      --output <OUTPUT>  Output HEIC; defaults to the input path for in-place replacement',
              '      --output <OUTPUT>  Output HEIC; ProXDR defaults in-place, Motion Photo chooses a new pair',
              1,
          )
          marker = '''fn run_convert(
    input: PathBuf,'''
          helper = '''fn default_motion_photo_output(input: &Path) -> PathBuf {
    let base = input.with_extension("heic");
    let mut sequence = 1_u32;
    loop {
        let candidate = if sequence == 1 {
            base.clone()
        } else {
            let stem = base
                .file_stem()
                .and_then(|value| value.to_str())
                .unwrap_or("capture");
            base.with_file_name(format!("{stem} ({sequence}).heic"))
        };
        if candidate != input && !candidate.exists() && !candidate.with_extension("mov").exists() {
            return candidate;
        }
        sequence = sequence.saturating_add(1);
    }
}

fn run_convert(
    input: PathBuf,'''
          if marker not in text:
              raise SystemExit('CLI run_convert insertion point changed')
          text = text.replace(marker, helper, 1)
          old = '''    if matches!(asset, SourceAsset::MotionPhoto { .. }) {
        let _ = writeln!(
            stderr,
            "error: Motion Photo conversion is not wired into the unified Rust runtime yet"
        );
        return 1;
    }

    let output = output.unwrap_or_else(|| input.clone());
    let runtime = PortableRuntime::new();
    if let Err(error) =
        runtime.convert_proxdr_file(&source, &output, ConversionRequest::default(), |_| {})
    {
        let _ = writeln!(stderr, "error: {error}");
        return 1;
    }

    let result = if output == input {
        writeln!(stdout, "converted: {} (in place)", input.display())
    } else {
        writeln!(
            stdout,
            "converted: {} -> {}",
            input.display(),
            output.display()
        )
    };'''
          new = '''    let runtime = PortableRuntime::new();
    let result = match asset {
