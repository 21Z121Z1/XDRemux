name: Rust format core

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-format/**"
      - "Package.swift"
      - "Sources/FormatConformanceOracle/**"
      - "Sources/XDRemuxCore/HEIF/ISOBMFF.swift"
      - "scripts/check_rust_format_fixtures.sh"
      - "scripts/check_format_conformance.sh"
      - "scripts/check_format_constructor_conformance.sh"
      - ".github/workflows/rust-format-core.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-format/**"
      - "Package.swift"
      - "Sources/FormatConformanceOracle/**"
      - "Sources/XDRemuxCore/HEIF/ISOBMFF.swift"
      - "scripts/check_rust_format_fixtures.sh"
      - "scripts/check_format_conformance.sh"
      - "scripts/check_format_constructor_conformance.sh"
      - ".github/workflows/rust-format-core.yml"

permissions:
  contents: read

jobs:
  format-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint xdremux-format
        run: cargo clippy --locked -p xdremux-format --all-targets -- -D warnings

      - name: Test xdremux-format
        run: cargo test --locked -p xdremux-format

      - name: Exercise real HEIF fixtures
        run: bash scripts/check_rust_format_fixtures.sh

      - name: Verify repository completion gate
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/xdremux-format-gate.json" <<'JSON'
          {
            "schema_version": 1,
            "scope": "Add the isolated xdremux-format Rust parsing foundation and exercise it on repository HEIF fixtures",
            "checks": [
              {
                "name": "rust-format-core-regressions",
                "kind": "regression",
                "command": ["cargo", "test", "--locked", "-p", "xdremux-format"],
                "timeout_seconds": 300
              },
              {
                "name": "rust-format-real-fixtures",
                "kind": "integration",
                "command": ["bash", "scripts/check_rust_format_fixtures.sh"],
                "timeout_seconds": 600
              },
              {
                "name": "rust-format-core-clippy",
                "kind": "static",
                "command": ["cargo", "clippy", "--locked", "-p", "xdremux-format", "--all-targets", "--", "-D", "warnings"],
                "timeout_seconds": 300
              }
            ]
          }
          JSON
          python3 scripts/agent_completion_gate.py run \
            --base origin/main \
            --plan "$RUNNER_TEMP/xdremux-format-gate.json"
          python3 scripts/agent_completion_gate.py verify \
            ".codex/verification-receipts/$(git rev-parse HEAD).json"

  format-conformance:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Pin established Swift hardening contracts
        run: swift test --filter ISOBMFFHardeningTests

      - name: Compare Swift and Rust on real HEIF fixtures
        run: bash scripts/check_format_conformance.sh

      - name: Compare Swift and Rust constructor bytes
        run: bash scripts/check_format_constructor_conformance.sh

      - name: Verify cross-language completion gate
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/xdremux-format-conformance-gate.json" <<'JSON'
          {
            "schema_version": 1,
            "scope": "Prove xdremux-format matches established Swift parser and constructor semantics",
            "checks": [
              {
                "name": "swift-isobmff-hardening-contracts",
                "kind": "regression",
                "command": ["swift", "test", "--filter", "ISOBMFFHardeningTests"],
                "timeout_seconds": 600
              },
              {
                "name": "swift-rust-format-conformance",
                "kind": "integration",
                "command": ["bash", "scripts/check_format_conformance.sh"],
                "timeout_seconds": 1200
              },
              {
                "name": "swift-rust-constructor-conformance",
                "kind": "integration",
                "command": ["bash", "scripts/check_format_constructor_conformance.sh"],
                "timeout_seconds": 1200
              }
            ]
          }
          JSON
          python3 scripts/agent_completion_gate.py run \
            --base origin/main \
            --plan "$RUNNER_TEMP/xdremux-format-conformance-gate.json"
          python3 scripts/agent_completion_gate.py verify \
            ".codex/verification-receipts/$(git rev-parse HEAD).json"
