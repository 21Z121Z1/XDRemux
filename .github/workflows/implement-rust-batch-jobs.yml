name: Verify Rust bounded batch jobs

on:
  workflow_dispatch:
  push:
    branches: [feat/rust-cli-unification]
    paths:
      - .github/workflows/implement-rust-batch-jobs.yml
      - scripts/materialize_rust_batch_jobs.py
      - scripts/materialize_rust_batch_jobs_contract.py
      - crates/xdremux-cli/tests/batch_jobs.rs

permissions:
  contents: write

concurrency:
  group: rust-cli-unification-writer
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
          fetch-depth: 0
      - name: Install portable HEVC provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libheif-plugin-x265 libheif-plugin-libde265
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize bounded batch workers
        run: |
          python3 scripts/materialize_rust_batch_jobs.py
          python3 scripts/materialize_rust_batch_jobs.py
          python3 scripts/materialize_rust_batch_jobs_contract.py
          python3 scripts/materialize_rust_batch_jobs_contract.py
          cargo generate-lockfile
          cargo fmt -p xdremux-runtime -p xdremux-cli
          git diff --check
      - name: Lint bounded batch stack
        run: |
          cargo clippy --locked -p xdremux-runtime -p xdremux-cli --all-targets -- -D warnings
      - name: Test bounded batch stack
        run: |
          cargo test --locked -p xdremux-runtime batch -- --nocapture
          cargo test --locked -p xdremux-cli --test batch -- --nocapture
          cargo test --locked -p xdremux-cli --test batch_resume -- --nocapture
          cargo test --locked -p xdremux-cli --test batch_jobs -- --nocapture
          cargo test --locked -p xdremux-cli --lib -- --nocapture
      - name: Commit verified bounded batch wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/xdremux-runtime/src/batch.rs crates/xdremux-cli/src/lib.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated or formatting changes to commit.'
          else
            git commit -m 'feat(rust): add bounded parallel batch workers'
            git push origin HEAD:feat/rust-cli-unification
          fi

  verify-macos:
    needs: verify-and-materialize
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
      - name: Install portable HEVC provider
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Verify bounded real Motion Photo batch
        run: cargo test --locked -p xdremux-cli --test batch_jobs -- --nocapture
