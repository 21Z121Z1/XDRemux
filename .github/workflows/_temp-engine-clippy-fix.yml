name: Temporary engine clippy fix

on:
  push:
    branches:
      - feat/rust-cli-unification
    paths:
      - .github/workflows/_temp-engine-clippy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Normalize recovered Portrait constants
        shell: bash
        run: |
          set -euo pipefail
          FILE=crates/xdremux-engine/src/apple_portrait_geometry.rs
          perl -0pi -e 's/(?<![0-9_])([0-9])([0-9]{3})\./$1_$2./g' "$FILE"
          cargo clippy --locked -p xdremux-engine --all-targets --fix --allow-dirty --allow-staged
          cargo fmt --all
          cargo clippy --locked -p xdremux-engine --all-targets -- -D warnings
          cargo test --locked -p xdremux-engine
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "style: normalize Portrait calibration literals"
          git push origin HEAD:feat/rust-cli-unification
