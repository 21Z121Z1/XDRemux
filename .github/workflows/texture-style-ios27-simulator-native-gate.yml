name: TextureStyle iOS 27 simulator native gate

on:
  push:
    branches:
      - research/photographic-styles-3-texture-probe
      - research/photographic-styles-3-texture-probe-v7
    paths: [.github/workflows/texture-style-ios27-simulator-native-gate.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  native-gate:
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Download V5 candidates from direct PhotosFormats gate
        uses: actions/download-artifact@v5
        with:
          name: ps3-texture-style-v5-xcode27-a80e635a1e490ffe6c82ec1625f48e0365b3561c
          path: source-artifact
          github-token: ${{ github.token }}
          repository: 21Z121Z1/XDRemux
          run-id: 34623523344

      - name: Build native PhotosFormats probe app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Probe.app artifacts
          cp source-artifact/A-baseline-original.heic Probe.app/
          find source-artifact -type f -name 'V5-*.heic' -exec cp {} Probe.app/ \;
          cat > Probe.m <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <objc/message.h>
          #import <objc/runtime.h>
          #import <dlfcn.h>

          static id JsonSafe(id obj) {
              if (!obj) return [NSNull null];
              if ([obj isKindOfClass:[NSString class]] || [obj isKindOfClass:[NSNumber class]] || [obj isKindOfClass:[NSNull class]]) return obj;
              return [obj description] ?: @"";
          }

          static id InvokeZeroArg(id obj, NSString *name) {
              SEL sel=NSSelectorFromString(name);
              if (!obj || ![obj respondsToSelector:sel]) return @{ @"available":@NO };
              NSMethodSignature *sig=[obj methodSignatureForSelector:sel];
              if(!sig) return @{ @"available":@YES, @"error":@"no-signature" };
              NSInvocation *inv=[NSInvocation invocationWithMethodSignature:sig];
              inv.target=obj; inv.selector=sel;
              @try { [inv invoke]; }
              @catch(NSException *e) { return @{ @"available":@YES, @"exception":e.reason ?: e.name }; }
              const char *t=sig.methodReturnType;
              while(*t=='r'||*t=='n'||*t=='N'||*t=='o'||*t=='O'||*t=='R'||*t=='V')t++;
              id value=nil;
              if(*t=='@') { __unsafe_unretained id v=nil; [inv getReturnValue:&v]; value=v ?: [NSNull null]; }
              else if(*t=='B'||*t=='c') { BOOL v=NO; [inv getReturnValue:&v]; value=@(v); }
              else if(*t=='i'||*t=='s'||*t=='l'||*t=='q') { long long v=0; [inv getReturnValue:&v]; value=@(v); }
              else if(*t=='I'||*t=='S'||*t=='L'||*t=='Q') { unsigned long long v=0; [inv getReturnValue:&v]; value=@(v); }
              else if(*t=='f') { float v=0; [inv getReturnValue:&v]; value=@(v); }
              else if(*t=='d') { double v=0; [inv getReturnValue:&v]; value=@(v); }
              else if(*t=='v') value=[NSNull null];
              else value=[NSString stringWithFormat:@"unsupported-return:%s",t];
              return @{ @"available":@YES,
                        @"encoding":[NSString stringWithUTF8String:sig.methodReturnType],
                        @"value":JsonSafe(value) };
          }

          static id Open(NSURL *url) {
              Class c = NSClassFromString(@"PFMetadataImage");
              if (!c) return nil;
              Class UT = NSClassFromString(@"UTType");
              id type = nil;
              SEL ts = NSSelectorFromString(@"typeWithIdentifier:");
              if (UT && [UT respondsToSelector:ts]) type = ((id(*)(id,SEL,id))objc_msgSend)(UT,ts,@"public.heic");
              id o = [c alloc];
              SEL s = NSSelectorFromString(@"initWithImageURL:contentType:timeZoneLookup:");
              if ([o respondsToSelector:s]) {
                  @try { id v=((id(*)(id,SEL,id,id,id))objc_msgSend)(o,s,url,type,nil); if(v)return v; }
                  @catch (__unused NSException *e) {}
              }
              o=[c alloc];
              s=NSSelectorFromString(@"initWithImageURL:contentType:options:timeZoneLookup:cacheImageSource:cacheImageData:");
              if ([o respondsToSelector:s]) {
                  @try { return ((id(*)(id,SEL,id,id,unsigned long long,id,BOOL,BOOL))objc_msgSend)(o,s,url,type,0,nil,YES,YES); }
                  @catch (__unused NSException *e) {}
              }
              return nil;
          }

          int main(void) {@autoreleasepool {
              void *h=dlopen("/System/Library/PrivateFrameworks/PhotosFormats.framework/PhotosFormats",RTLD_NOW|RTLD_GLOBAL);
              NSMutableArray *rows=[NSMutableArray array];
              NSArray<NSString *> *files=[[[NSFileManager defaultManager] contentsOfDirectoryAtPath:[[NSBundle mainBundle] resourcePath] error:nil]
                  filteredArrayUsingPredicate:[NSPredicate predicateWithBlock:^BOOL(NSString *s, NSDictionary *_) { return [s.pathExtension.lowercaseString isEqualToString:@"heic"]; }]];
              files=[files sortedArrayUsingSelector:@selector(compare:)];
              for(NSString *file in files){
                  NSString *path=[[[NSBundle mainBundle] resourcePath] stringByAppendingPathComponent:file];
                  id m=Open([NSURL fileURLWithPath:path]);
                  NSMutableDictionary *d=[@{@"file":file,
                                             @"dlopen":h?@YES:@NO,
                                             @"class":NSClassFromString(@"PFMetadataImage")?@YES:@NO,
                                             @"opened":m?@YES:@NO} mutableCopy];
                  if(m){
                      for(NSString *selector in @[@"hasSmartStyle", @"hasTextureStyle", @"textureStylePreset",
                                                  @"textureStyleIntensity", @"textureStyleGrain", @"textureStyleGrainIntensity",
                                                  @"textureStyleIsReversible"])
                          d[selector]=InvokeZeroArg(m,selector);
                  }
                  [rows addObject:d];
              }
              NSData *json=[NSJSONSerialization dataWithJSONObject:rows options:NSJSONWritingPrettyPrinted|NSJSONWritingSortedKeys error:nil];
              NSString *out=[NSTemporaryDirectory() stringByAppendingPathComponent:@"texture-style-results.json"];
              BOOL ok=[json writeToFile:out atomically:YES];
              return ok?0:2;
          }}
          OBJC
          cat > Probe.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>com.xdremux.TextureStyleProbe</string>
            <key>CFBundleExecutable</key><string>Probe</string>
            <key>CFBundleName</key><string>TextureStyleProbe</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>MinimumOSVersion</key><string>27.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict></plist>
          PLIST
          xcrun --sdk iphonesimulator clang -fobjc-arc -fblocks -arch arm64 -mios-simulator-version-min=27.0 \
            -framework Foundation Probe.m -o Probe.app/Probe
          codesign --force --sign - Probe.app

      - name: Run native reader on iOS 27 simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          RUNTIME='com.apple.CoreSimulator.SimRuntime.iOS-27-0'
          DEVTYPE='com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro'
          UDID="$(xcrun simctl create TextureStyleProbe "$DEVTYPE" "$RUNTIME")"
          echo "$UDID" > artifacts/simulator-udid.txt
          trap 'xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true; xcrun simctl delete "$UDID" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$UDID"
          for i in $(seq 1 90); do
            state="$(xcrun simctl list devices -j | python3 -c 'import json,sys; d=json.load(sys.stdin); u=sys.argv[1]; print(next((x.get("state","") for xs in d["devices"].values() for x in xs if x.get("udid")==u),""))' "$UDID")"
            echo "boot poll $i: $state"
            [ "$state" = Booted ] && break
            sleep 2
          done
          xcrun simctl install "$UDID" Probe.app
          xcrun simctl launch "$UDID" com.xdremux.TextureStyleProbe | tee artifacts/launch.txt
          DATA_DIR="$(xcrun simctl get_app_container "$UDID" com.xdremux.TextureStyleProbe data)"
          echo "$DATA_DIR" > artifacts/data-container.txt
          RESULT="$DATA_DIR/tmp/texture-style-results.json"
          for i in $(seq 1 30); do
            [ -s "$RESULT" ] && break
            sleep 1
          done
          test -s "$RESULT"
          cp "$RESULT" artifacts/native-results.json
          cat artifacts/native-results.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('artifacts/native-results.json').read_text())
          def value(row,key):
              x=row.get(key)
              return x.get('value') if isinstance(x,dict) and x.get('available') is True else None
          def available(row,key):
              x=row.get(key)
              return isinstance(x,dict) and x.get('available') is True
          base=next(r for r in rows if r['file']=='A-baseline-original.heic')
          candidates=[r for r in rows if r['file'].startswith('V5-')]
          report={
              'baseline':base,
              'selectorAvailable':available(base,'hasTextureStyle'),
              'winners':[r for r in candidates if value(r,'hasTextureStyle') is True],
              'candidateCount':len(candidates),
          }
          Path('artifacts/gate-summary.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          if not available(base,'hasTextureStyle'):
              raise SystemExit('iOS 27 simulator PFMetadataImage does not expose hasTextureStyle')
          if value(base,'hasTextureStyle') is True:
              raise SystemExit('baseline unexpectedly reports TextureStyle')
          if not report['winners']:
              raise SystemExit('no native TextureStyle-positive candidate')
          PY

      - name: Upload native gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: texture-style-ios27-native-gate-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/
