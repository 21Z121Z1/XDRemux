name: Rust Motion Photo real fixtures

on:
  workflow_dispatch:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-cli/**"
      - "crates/xdremux-runtime/**"
      - "crates/xdremux-motion-photo/**"
      - "crates/xdremux-codec/**"
      - "crates/xdremux-heif/**"
      - "crates/xdremux-format/**"
      - "fixtures/SHA256SUMS"
      - "fixtures/motion-photo/**"
      - "scripts/check_rust_motion_photo_real_fixtures.sh"
      - "scripts/build_live_photo_device_validation.sh"
      - ".github/workflows/motion-photo-real-fixtures.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-cli/**"
      - "crates/xdremux-runtime/**"
      - "crates/xdremux-motion-photo/**"
      - "crates/xdremux-codec/**"
      - "crates/xdremux-heif/**"
      - "crates/xdremux-format/**"
      - "fixtures/SHA256SUMS"
      - "fixtures/motion-photo/**"
      - "scripts/check_rust_motion_photo_real_fixtures.sh"
      - "scripts/build_live_photo_device_validation.sh"
      - ".github/workflows/motion-photo-real-fixtures.yml"

permissions:
  contents: read

jobs:
  real-motion-photo-fixtures:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record macOS runner
        shell: bash
        run: |
          mkdir -p artifacts
          {
            echo "runner_os=$(sw_vers -productVersion)"
            echo "runner_build=$(sw_vers -buildVersion)"
            echo "arch=$(uname -m)"
          } | tee artifacts/motion-photo-runner.txt

      - name: Install portable HEVC provider
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check Rust Motion Photo package
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --locked -p xdremux-motion-photo -p xdremux-runtime -p xdremux-cli --all-targets -- -D warnings
          cargo test --locked -p xdremux-motion-photo -p xdremux-runtime -p xdremux-cli

      - name: Convert and validate every supplied fixture through Rust
        shell: bash
        run: |
          bash scripts/check_rust_motion_photo_real_fixtures.sh \
            "$GITHUB_WORKSPACE/fixtures" \
            "$GITHUB_WORKSPACE/artifacts/rust-motion-photo-real"

      - name: Prepare manual device-validation pairs
        shell: bash
        run: |
          bash scripts/build_live_photo_device_validation.sh \
            "$GITHUB_WORKSPACE/fixtures" \
            "$GITHUB_WORKSPACE/artifacts/live-photo-device-validation"

      - name: Upload Rust real-fixture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-motion-photo-real-fixture-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/motion-photo-runner.txt
            artifacts/rust-motion-photo-real/
            artifacts/live-photo-device-validation/
