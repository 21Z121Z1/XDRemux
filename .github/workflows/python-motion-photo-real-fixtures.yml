name: Python Motion Photo migration oracle

on:
  workflow_dispatch:
  push:
    paths:
      - "pyproject.toml"
      - "xdremux_py/**"
      - "Tests/test_apple_makernote_ifd.py"
      - "Tests/test_python_live_photo_batch_reliability.py"
      - "Tests/test_python_live_photo_output_safety.py"
      - "Tests/test_python_live_photo_portability.py"
      - "Tests/test_python_live_photo_publish.py"
      - "Tests/test_python_motion_photo.py"
      - "Tests/test_python_motion_photo_oppo.py"
      - "Tests/test_product_ownership.py"
      - "Tests/validation/verify_python_motion_photo_fixtures.py"
      - "Tests/XDRemuxAppleFeaturesTests/PythonLivePhotoOutputGateTests.swift"
      - "fixtures/motion-photo/**"
      - ".github/workflows/python-motion-photo-real-fixtures.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "xdremux_py/**"
      - "Tests/test_apple_makernote_ifd.py"
      - "Tests/test_python_live_photo_batch_reliability.py"
      - "Tests/test_python_live_photo_output_safety.py"
      - "Tests/test_python_live_photo_portability.py"
      - "Tests/test_python_live_photo_publish.py"
      - "Tests/test_python_motion_photo.py"
      - "Tests/test_python_motion_photo_oppo.py"
      - "Tests/test_product_ownership.py"
      - "Tests/validation/verify_python_motion_photo_fixtures.py"
      - "Tests/XDRemuxAppleFeaturesTests/PythonLivePhotoOutputGateTests.swift"
      - "fixtures/motion-photo/**"
      - ".github/workflows/python-motion-photo-real-fixtures.yml"

concurrency:
  group: python-motion-photo-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install migration tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python - <<'PY'
          import platform, sys
          import pillow_heif
          print(platform.platform())
          print(sys.version)
          print("pillow-heif", pillow_heif.__version__)
          PY

      - name: Run owned Python oracle tests
        shell: bash
        run: |
          python -m unittest -v \
            Tests.test_apple_makernote_ifd \
            Tests.test_python_live_photo_batch_reliability \
            Tests.test_python_live_photo_output_safety \
            Tests.test_python_live_photo_portability \
            Tests.test_python_live_photo_publish \
            Tests.test_python_motion_photo \
            Tests.test_python_motion_photo_oppo \
            Tests.test_product_ownership

      - name: Convert repository fixtures through migration oracle
        shell: bash
        run: |
          python Tests/validation/verify_python_motion_photo_fixtures.py \
            --fixture-root "$GITHUB_WORKSPACE/fixtures" \
            --output-root "$RUNNER_TEMP/xdremux-python-live-photo-output" \
            --manifest "$RUNNER_TEMP/xdremux-python-live-photo-manifest.json"

  apple-acceptance-oracle:
    needs: portable-oracle
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Record runner and configure paths
        shell: bash
        run: |
          mkdir -p artifacts
          {
            echo "runner_os=$(sw_vers -productVersion)"
            echo "runner_build=$(sw_vers -buildVersion)"
            echo "arch=$(uname -m)"
            echo "conversion_runtime=Python migration oracle; Apple frameworks are validation-only"
          } | tee artifacts/python-live-photo-runner.txt
          echo "FIXTURE_ROOT=$GITHUB_WORKSPACE/fixtures" >> "$GITHUB_ENV"
          echo "PYTHON_OUTPUT_ROOT=$RUNNER_TEMP/xdremux-python-live-photo-output" >> "$GITHUB_ENV"
          echo "PYTHON_MANIFEST=$RUNNER_TEMP/xdremux-python-live-photo-manifest.json" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install migration tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Produce oracle outputs from real fixtures
        shell: bash
        run: |
          echo "::group::Python migration oracle fixture conversion"
          python Tests/validation/verify_python_motion_photo_fixtures.py \
            --fixture-root "$FIXTURE_ROOT" \
            --output-root "$PYTHON_OUTPUT_ROOT" \
            --manifest "$PYTHON_MANIFEST" \
            2>&1 | tee artifacts/python-motion-photo-real-fixtures.log
          echo "::endgroup::"
          cp "$PYTHON_MANIFEST" artifacts/python-live-photo-manifest.json

      - name: Validate oracle outputs with macOS PhotoKit
        shell: bash
        run: |
          echo "::group::Apple compatibility oracle"
          XDREMUX_PYTHON_LIVE_PHOTO_MANIFEST="$PYTHON_MANIFEST" \
            swift test --filter PythonLivePhotoOutputGateTests \
            2>&1 | tee artifacts/python-live-photo-photokit.log
          echo "::endgroup::"

      - name: Write oracle summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Python Motion Photo migration oracle"
            echo
            echo "- Purpose: temporary replacement evidence for the canonical Rust product"
            echo "- Linux real-fixture conversion: required before Apple acceptance"
            echo "- Apple frameworks: structural/PhotoKit acceptance only"
            echo "- Product CLI ownership: Rust only"
            if [[ -f artifacts/python-live-photo-manifest.json ]]; then
              echo "- Real fixture manifest: produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload oracle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-motion-photo-migration-oracle-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/python-live-photo-runner.txt
            artifacts/python-motion-photo-real-fixtures.log
            artifacts/python-live-photo-photokit.log
            artifacts/python-live-photo-manifest.json
