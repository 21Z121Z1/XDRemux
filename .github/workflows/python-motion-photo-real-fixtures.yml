name: Python Motion Photo Live Photo Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "xdremux_py/**"
      - "Tests/test_python_motion_photo.py"
      - "Tests/test_python_live_photo_portability.py"
      - "Tests/validation/verify_python_motion_photo_fixtures.py"
      - "Tests/XDRemuxAppleFeaturesTests/PythonLivePhotoOutputGateTests.swift"
      - "fixtures/**"
      - ".github/workflows/python-motion-photo-real-fixtures.yml"

concurrency:
  group: python-motion-photo-live-photo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-python:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python - <<'PY'
          import platform, sys
          import pillow_heif
          print(platform.platform())
          print(sys.version)
          print("pillow-heif", pillow_heif.__version__)
          PY

      - name: Run portable Python tests
        shell: bash
        run: |
          python -m unittest discover -s Tests -p 'test_*.py' -v

      - name: Convert all repository fixtures on Linux with pure Python
        shell: bash
        run: |
          python Tests/validation/verify_python_motion_photo_fixtures.py \
            --fixture-root "$GITHUB_WORKSPACE/fixtures" \
            --output-root "$RUNNER_TEMP/xdremux-python-live-photo-output" \
            --manifest "$RUNNER_TEMP/xdremux-python-live-photo-manifest.json"

  apple-compatibility-oracle:
    needs: portable-python
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Record runner and configure paths
        shell: bash
        run: |
          mkdir -p artifacts
          {
            echo "runner_os=$(sw_vers -productVersion)"
            echo "runner_build=$(sw_vers -buildVersion)"
            echo "arch=$(uname -m)"
            echo "conversion_runtime=pure Python; Apple frameworks are validation-only"
          } | tee artifacts/python-live-photo-runner.txt
          echo "FIXTURE_ROOT=$GITHUB_WORKSPACE/fixtures" >> "$GITHUB_ENV"
          echo "PYTHON_OUTPUT_ROOT=$RUNNER_TEMP/xdremux-python-live-photo-output" >> "$GITHUB_ENV"
          echo "PYTHON_MANIFEST=$RUNNER_TEMP/xdremux-python-live-photo-manifest.json" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Convert all repository fixtures with pure Python
        shell: bash
        run: |
          echo "::group::Pure Python Samsung / Xiaomi / OPPO / vivo conversion"
          python Tests/validation/verify_python_motion_photo_fixtures.py \
            --fixture-root "$FIXTURE_ROOT" \
            --output-root "$PYTHON_OUTPUT_ROOT" \
            --manifest "$PYTHON_MANIFEST" \
            2>&1 | tee artifacts/python-motion-photo-real-fixtures.log
          echo "::endgroup::"
          cp "$PYTHON_MANIFEST" artifacts/python-live-photo-manifest.json

      - name: Validate Python outputs with macOS PhotoKit
        shell: bash
        run: |
          echo "::group::Apple compatibility oracle"
          XDREMUX_PYTHON_LIVE_PHOTO_MANIFEST="$PYTHON_MANIFEST" \
            swift test --filter PythonLivePhotoOutputGateTests \
            2>&1 | tee artifacts/python-live-photo-photokit.log
          echo "::endgroup::"

      - name: Write gate summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Python Motion Photo → Apple Live Photo Gate"
            echo
            echo "- Linux real-fixture conversion: required before this job"
            echo "- macOS conversion runtime: pure Python/container code"
            echo "- Apple frameworks: final structural/PhotoKit acceptance oracle only"
            if [[ -f artifacts/python-live-photo-manifest.json ]]; then
              echo "- Real fixture manifest: produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-motion-photo-live-photo-evidence
          if-no-files-found: error
          path: |
            artifacts/python-live-photo-runner.txt
            artifacts/python-motion-photo-real-fixtures.log
            artifacts/python-live-photo-photokit.log
            artifacts/python-live-photo-manifest.json
