name: Python Motion Photo Live Photo Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "xdremux_py/**"
      - "Tests/test_python_motion_photo.py"
      - "Tests/validation/verify_python_motion_photo_fixtures.py"
      - "Tests/XDRemuxAppleFeaturesTests/PythonLivePhotoOutputGateTests.swift"
      - ".github/workflows/python-motion-photo-real-fixtures.yml"

jobs:
  pure-python-live-photo:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Record runner
        shell: bash
        run: |
          mkdir -p artifacts
          {
            echo "runner_os=$(sw_vers -productVersion)"
            echo "runner_build=$(sw_vers -buildVersion)"
            echo "arch=$(uname -m)"
            echo "python_runtime=pure Python; no Apple frameworks in conversion"
          } | tee artifacts/python-live-photo-runner.txt

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python - <<'PY'
          import sys
          import pillow_heif
          print(sys.version)
          print("pillow-heif", pillow_heif.__version__)
          PY

      - name: Run Python tests
        shell: bash
        run: |
          echo "::group::Pure Python unit/regression tests"
          python -m unittest discover -s Tests -p 'test_*.py' -v \
            2>&1 | tee artifacts/python-tests.log
          echo "::endgroup::"

      - name: Resolve private fixture archive
        shell: bash
        env:
          FIXTURE_ARCHIVE_URL: ${{ secrets.XDREMUX_FIXTURE_ARCHIVE_URL }}
        run: |
          if [[ -z "$FIXTURE_ARCHIVE_URL" ]]; then
            echo "::error::XDREMUX_FIXTURE_ARCHIVE_URL is required for the strict Python gate"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/xdremux-fixtures"
          curl --fail --location --silent --show-error \
            "$FIXTURE_ARCHIVE_URL" \
            --output "$RUNNER_TEMP/xdremux-fixtures.zip"
          ditto -x -k "$RUNNER_TEMP/xdremux-fixtures.zip" "$RUNNER_TEMP/xdremux-fixtures"
          echo "FIXTURE_ROOT=$RUNNER_TEMP/xdremux-fixtures" >> "$GITHUB_ENV"
          echo "PYTHON_OUTPUT_ROOT=$RUNNER_TEMP/xdremux-python-live-photo-output" >> "$GITHUB_ENV"
          echo "PYTHON_MANIFEST=$RUNNER_TEMP/xdremux-python-live-photo-manifest.json" >> "$GITHUB_ENV"

      - name: Convert all real fixtures with pure Python
        shell: bash
        run: |
          echo "::group::Pure Python Samsung / Xiaomi / OPPO / vivo conversion"
          python Tests/validation/verify_python_motion_photo_fixtures.py \
            --fixture-root "$FIXTURE_ROOT" \
            --output-root "$PYTHON_OUTPUT_ROOT" \
            --manifest "$PYTHON_MANIFEST" \
            2>&1 | tee artifacts/python-motion-photo-real-fixtures.log
          echo "::endgroup::"
          cp "$PYTHON_MANIFEST" artifacts/python-live-photo-manifest.json

      # Apple frameworks are deliberately used only after the independent Python implementation
      # has finished producing every output. PhotoKit is the acceptance oracle, not a runtime
      # dependency of xdremux-py.
      - name: Validate Python outputs with macOS PhotoKit
        shell: bash
        env:
          XDREMUX_PYTHON_LIVE_PHOTO_MANIFEST: ${{ env.PYTHON_MANIFEST }}
        run: |
          echo "::group::Apple compatibility oracle"
          swift test --filter PythonLivePhotoOutputGateTests \
            2>&1 | tee artifacts/python-live-photo-photokit.log
          echo "::endgroup::"

      - name: Write gate summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Python Motion Photo → Apple Live Photo Gate"
            echo
            echo "The converter itself is pure Python/container code. Apple frameworks run only in the final acceptance step."
            if [[ -f artifacts/python-live-photo-manifest.json ]]; then
              echo "- Real fixture manifest: produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-motion-photo-live-photo-evidence
          if-no-files-found: error
          path: |
            artifacts/python-live-photo-runner.txt
            artifacts/python-tests.log
            artifacts/python-motion-photo-real-fixtures.log
            artifacts/python-live-photo-photokit.log
            artifacts/python-live-photo-manifest.json
