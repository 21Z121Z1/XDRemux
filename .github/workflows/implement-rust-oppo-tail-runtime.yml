name: Verify Rust OPPO camera tail runtime

on:
  workflow_dispatch:
  push:
    branches: [feat/rust-cli-unification]
    paths:
      - .github/workflows/implement-rust-oppo-tail-runtime.yml
      - scripts/materialize_rust_exif_user_comment_reader.py
      - scripts/materialize_rust_oppo_structural_read.py
      - scripts/materialize_rust_oppo_compat_runtime.py
      - scripts/materialize_rust_oppo_tail_runtime.py
      - crates/xdremux-format/src/exif_raw.rs
      - crates/xdremux-format/src/lib.rs
      - crates/xdremux-container/src/oppo_tail.rs
      - crates/xdremux-container/src/lib.rs
      - crates/xdremux-metadata/src/oppo_heif.rs
      - crates/xdremux-runtime/src/oppo_compat.rs
      - crates/xdremux-runtime/src/oppo_tail.rs
      - crates/xdremux-runtime/tests/oppo_compat_fixture.rs
      - crates/xdremux-runtime/tests/oppo_tail_fixture.rs

permissions:
  contents: write

concurrency:
  group: rust-cli-unification-writer
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
          fetch-depth: 0
      - name: Install portable HEVC provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libheif-plugin-x265 libheif-plugin-libde265
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize OPPO product runtime
        run: |
          python3 scripts/materialize_rust_exif_user_comment_reader.py
          python3 scripts/materialize_rust_exif_user_comment_reader.py
          python3 scripts/materialize_rust_oppo_structural_read.py
          python3 scripts/materialize_rust_oppo_structural_read.py
          python3 scripts/materialize_rust_oppo_compat_runtime.py
          python3 scripts/materialize_rust_oppo_compat_runtime.py
          python3 scripts/materialize_rust_oppo_tail_runtime.py
          python3 scripts/materialize_rust_oppo_tail_runtime.py
          cargo generate-lockfile
          cargo fmt -p xdremux-format -p xdremux-container -p xdremux-metadata -p xdremux-runtime
          git diff --check
      - name: Lint OPPO product runtime
        run: |
          cargo clippy --locked -p xdremux-format -p xdremux-container -p xdremux-metadata -p xdremux-engine -p xdremux-runtime --all-targets -- -D warnings
      - name: Test OPPO compatibility and tail contracts
        run: |
          cargo test --locked -p xdremux-format reads_only_the_referenced_user_comment_value -- --nocapture
          cargo test --locked -p xdremux-container oppo_tail -- --nocapture
          cargo test --locked -p xdremux-metadata oppo -- --nocapture
          cargo test --locked -p xdremux-runtime oppo_compat -- --nocapture
          cargo test --locked -p xdremux-runtime --test oppo_compat_fixture -- --nocapture
          cargo test --locked -p xdremux-runtime --test oppo_tail_fixture -- --nocapture
      - name: Commit verified OPPO runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/xdremux-format crates/xdremux-container crates/xdremux-metadata crates/xdremux-runtime
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated or formatting changes to commit.'
          else
            git commit -m 'feat(rust): execute OPPO compatibility and camera tails'
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo 'Unexpected dirty working tree after materialization:' >&2
            git status --short >&2
            exit 1
          fi
          git pull --rebase origin feat/rust-cli-unification
          git push origin HEAD:feat/rust-cli-unification

  verify-macos:
    needs: verify-and-materialize
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
      - name: Install portable HEVC provider
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Verify real OPPO product runtime
        run: |
          cargo test --locked -p xdremux-runtime --test oppo_compat_fixture -- --nocapture
          cargo test --locked -p xdremux-runtime --test oppo_tail_fixture -- --nocapture
