name: Materialize Rust Live Photo MOV slice

on:
  push:
    branches: [feat/rust-cli-unification]
    paths: [.github/workflows/materialize-rust-live-photo-mov.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply checked dimension conversion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/xdremux-motion-photo/src/live_photo_mov.rs')
          text = path.read_text()
          writer = 'pub fn write_live_photo_movie('
          helper = '''fn exact_video_dimension(value: Option<i64>) -> Option<f32> {
              let value = value?;
              const MAX_EXACT_F32_INTEGER: i64 = 1 << 24;
              if value <= 0 || value > MAX_EXACT_F32_INTEGER {
                  return None;
              }
              Some(value as f32)
          }

          '''
          if 'fn exact_video_dimension(' not in text:
              if writer not in text:
                  raise SystemExit('writer anchor not found')
              text = text.replace(writer, helper + writer, 1)
          replacements = {
              'f32::try_from(metadata.video_width?).ok()?': 'exact_video_dimension(metadata.video_width)?',
              'f32::try_from(metadata.video_height?).ok()?': 'exact_video_dimension(metadata.video_height)?',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'dimension token not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Materialize lockfile and formatting
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Verify portable Live Photo MOV slice
        run: |
          cargo clippy --locked -p xdremux-motion-photo --all-targets -- -D warnings
          cargo test --locked -p xdremux-motion-photo
          cargo test --locked -p xdremux-motion-photo --test live_photo_mov_fixture -- --nocapture
      - name: Verify diff
        run: |
          cargo fmt --all -- --check
          git diff --check
      - name: Commit verified materialization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/xdremux-motion-photo
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'test(rust-motion-photo): verify portable Live Photo MOV slice'
          git push origin HEAD:feat/rust-cli-unification
