name: Rust CLI core

on:
  push:
    paths:
      - ".github/workflows/rust-cli-core.yml"

permissions:
  contents: write

jobs:
  migrate-padded-edge-tiles:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
          fetch-depth: 0
      - name: Install portable HEVC provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libheif-plugin-x265 libheif-plugin-libde265
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Fix coded edge-tile geometry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/xdremux-codec/src/portable/libheif.rs")
          text = path.read_text()
          old = '''                let logical_width = request
                    .raster
                    .width
                    .checked_sub(origin_x)
                    .ok_or_else(|| CodecError::invalid("tile x offset exceeds raster"))?
                    .min(request.tile_size);
                let logical_height = request
                    .raster
                    .height
                    .checked_sub(origin_y)
                    .ok_or_else(|| CodecError::invalid("tile y offset exceeds raster"))?
                    .min(request.tile_size);
'''
          if text.count(old) != 1:
              raise SystemExit("logical edge-size block not found exactly once")
          text = text.replace(old, "", 1)
          old = '''                tiles.push(EncodedHevcTile {
                    payload: item.payload,
                    width: logical_width,
                    height: logical_height,
                });
'''
          new = '''                tiles.push(EncodedHevcTile {
                    payload: item.payload,
                    width: request.tile_size,
                    height: request.tile_size,
                });
'''
          if text.count(old) != 1:
              raise SystemExit("encoded tile geometry block not found exactly once")
          text = text.replace(old, new, 1)
          anchor = '''    #[test]
    fn libheif_rgb444_tile_roundtrips_through_raster_decoder() {
'''
          test = '''    #[test]
    fn edge_tiles_report_padded_coded_geometry() {
        let raster = rgb_raster(257, 257);
        let request = GainMapTileEncodeRequest {
            target: target(257, 257, ChromaSampling::Yuv444),
            raster,
            tile_size: 256,
            quality: 90,
        };
        let encoded = LibHeifProvider::new()
            .encode_gain_map_tiles(&request)
            .unwrap();
        assert_eq!((encoded.gain_map_width, encoded.gain_map_height), (257, 257));
        assert_eq!((encoded.tile_width, encoded.tile_height), (256, 256));
        assert_eq!(encoded.tiles.len(), 4);
        assert!(encoded
            .tiles
            .iter()
            .all(|tile| (tile.width, tile.height) == (256, 256)));
    }

    #[test]
    fn libheif_rgb444_tile_roundtrips_through_raster_decoder() {
'''
          if text.count(anchor) != 1:
              raise SystemExit("codec test anchor not found exactly once")
          path.write_text(text.replace(anchor, test, 1))

          model = Path("crates/xdremux-codec/src/model.rs")
          model_text = model.read_text()
          old = '''pub struct EncodedHevcTile {
    pub payload: Vec<u8>,
    pub width: u32,
    pub height: u32,
}
'''
          new = '''pub struct EncodedHevcTile {
    pub payload: Vec<u8>,
    /// Coded storage width of this tile. Grid edge cropping belongs to the
    /// parent grid item, so padded edge tiles retain the full tile width here.
    pub width: u32,
    /// Coded storage height of this tile; see `width`.
    pub height: u32,
}
'''
          if model_text.count(old) != 1:
              raise SystemExit("EncodedHevcTile model anchor not found exactly once")
          model.write_text(model_text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked -p xdremux-codec --all-targets -- -D warnings
          cargo test --locked -p xdremux-codec
          git diff --check
      - name: Commit codec fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/xdremux-codec/src/model.rs crates/xdremux-codec/src/portable/libheif.rs
          git commit -m "fix(codec): preserve padded HEIF tile geometry"
          git push origin HEAD:feat/rust-cli-unification
