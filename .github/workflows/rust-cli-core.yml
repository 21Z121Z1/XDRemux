name: Rust CLI portability

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Package.swift"
      - "Sources/**"
      - "scripts/distribution/**"
      - "tests/test_macos_distribution.py"
      - "crates/xdremux-classification/**"
      - "crates/xdremux-cli/**"
      - "crates/xdremux-runtime/**"
      - "crates/xdremux-source/**"
      - "crates/xdremux-engine/**"
      - "crates/xdremux-codec/**"
      - "crates/xdremux-heif/**"
      - "crates/xdremux-hdr/**"
      - "crates/xdremux-metadata/**"
      - "crates/xdremux-format/**"
      - "crates/xdremux-container/**"
      - "crates/xdremux-motion-photo/**"
      - ".github/workflows/rust-cli-core.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Package.swift"
      - "Sources/**"
      - "scripts/distribution/**"
      - "tests/test_macos_distribution.py"
      - "crates/xdremux-classification/**"
      - "crates/xdremux-cli/**"
      - "crates/xdremux-runtime/**"
      - "crates/xdremux-source/**"
      - "crates/xdremux-engine/**"
      - "crates/xdremux-codec/**"
      - "crates/xdremux-heif/**"
      - "crates/xdremux-hdr/**"
      - "crates/xdremux-metadata/**"
      - "crates/xdremux-format/**"
      - "crates/xdremux-container/**"
      - "crates/xdremux-motion-photo/**"
      - ".github/workflows/rust-cli-core.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-cli:
    name: portable-cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install libheif + HEVC on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libheif-plugin-x265 libheif-plugin-libde265

      - name: Install libheif + HEVC on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install libheif + HEVC on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $triplet = "x64-windows-static-md"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libheif[hevc]:$triplet"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=$triplet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$env:VCPKG_INSTALLATION_ROOT\installed\$triplet\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Build canonical Rust CLI
        run: cargo build --locked -p xdremux-cli

      - name: Test portable Rust CLI semantics
        run: cargo test --locked -p xdremux-classification -p xdremux-engine -p xdremux-source -p xdremux-runtime -p xdremux-cli

      - name: Verify Android-compatible HEIF Exif emission
        if: runner.os == 'Linux'
        run: cargo test --locked -p xdremux-codec portable::primary_heif::tests::encodes_exif_with_android_readable_identifier_without_changing_tiff

      # Temporary public-fixture export for the target-preset device acceptance.
      # Do not run or upload media for unrelated PRs.
      - name: Export destination-target acceptance fixtures
        if: runner.os == 'Linux' && github.head_ref == 'cursor/target-fidelity-outputs-1ba2'
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/target-acceptance"
          mkdir -p "$output"
          cli="target/debug/xdremux"
          input="fixtures/motion-photo/vivo/android-v1-sdr-01.jpg"
          printf '%s\n' "${GITHUB_SHA}" > "$output/ci-event-sha.txt"
          git rev-parse HEAD > "$output/checked-out-head.txt"
          sha256sum "$input" > "$output/source.sha256"

          vivo="fixtures/motion-photo/vivo/android-v1-sdr-01.jpg"
          xiaomi="fixtures/motion-photo/xiaomi/android-v1-ultrahdr-01.jpg"
          oppo="fixtures/motion-photo/oppo/coloros15-ultrahdr-01.jpg"
          sha256sum "$vivo" "$xiaomi" "$oppo" > "$output/sources.sha256"

          for target in android-standard standard google samsung oppo xiaomi; do
            "$cli" convert --input "$vivo" --target "$target" \
              --output "$output/vivo-to-${target}MP.jpg" --motion-report-json \
              > "$output/vivo-to-${target}.json"
          done
          if "$cli" convert --input "$vivo" --target vivo \
            --output "$output/vivo-to-vivoMP.jpg" > "$output/vivo-refused.txt" 2>&1; then
            echo "vivo target must not publish a file" >&2
            exit 1
          fi
          if "$cli" convert --input "$vivo" --target huawei \
            --output "$output/vivo-to-huaweiMP.jpg" > "$output/huawei-incomplete.txt" 2>&1; then
            echo "huawei target must not publish without parsable play info" >&2
            exit 1
          fi
          if "$cli" convert --input fixtures/motion-photo/samsung/heif-ultrahdr-01.heic \
            --target oppo --output "$output/samsung-heic-to-oppoMP.jpg" \
            > "$output/oppo-heic-plan.txt" 2>&1; then
            echo "oppo HEIC source must not publish before the still can be re-encoded" >&2
            exit 1
          fi
          "$cli" convert --input "$xiaomi" --target xiaomi \
            --output "$output/xiaomi-to-xiaomiMP.jpg" --motion-report-json \
            > "$output/xiaomi-to-xiaomi.json"
          "$cli" convert --input "$oppo" --target oppo \
            --output "$output/oppo-to-oppoMP.jpg" --motion-report-json \
            > "$output/oppo-to-oppo.json"

          "$cli" convert --input "$vivo" --target apple \
            --output "$output/vivo-apple.heic" \
            > "$output/apple-pair-report.txt"
          "$cli" validate "$output/vivo-apple.heic" --json \
            > "$output/apple-still-validation.json"
          "$cli" validate "$output/vivo-apple.mov" --json \
            > "$output/apple-video-validation.json"

          "$cli" convert --input "$output/vivo-apple.heic" \
            --motion-video "$output/vivo-apple.mov" --target google \
            --output "$output/vivo-to-googleMP.heic" --motion-report-json \
            > "$output/google-heic-report.json"
          python3 - "$output" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          for report_path in sorted(root.glob("*.json")):
              if report_path.name.endswith("-validation.json"):
                  continue
              report = json.loads(report_path.read_text())
              if "native_vendor_claim" not in report:
                  continue
              if report["native_vendor_claim"] is not False or report["consumer_gallery_verified"] is not False:
                  raise SystemExit(f"device or native claim in {report_path.name}")
              if report["motion_video_copies"] != 1:
                  raise SystemExit(f"video was duplicated in {report_path.name}")
              if report["exif_identifier_present"] is not True:
                  raise SystemExit(f"EXIF identifier missing in {report_path.name}")
          heic = (root / "vivo-to-googleMP.heic").read_bytes()
          apple = (root / "vivo-apple.heic").read_bytes()
          for name, data in (("heic", heic), ("apple", apple)):
              if b"\x00\x00\x00\x06Exif\x00\x00II*\x00" not in data and b"\x00\x00\x00\x06Exif\x00\x00MM\x00*" not in data:
                  raise SystemExit(f"Android-compatible HEIF Exif item not found: {name}")
          oppo = json.loads((root / "oppo-to-oppo.json").read_text())
          carried = oppo["carried_source_attributes"]
          if "OpCamera:VideoLength" not in carried:
              raise SystemExit("OPPO source VideoLength was not carried")
          huawei = (root / "huawei-incomplete.txt").read_text()
          if "readPlayInfo" not in huawei:
              raise SystemExit("huawei refusal does not name readPlayInfo")
          if (root / "vivo-to-huaweiMP.jpg").exists():
              raise SystemExit("huawei file was published")
          oppo_plan = (root / "oppo-heic-plan.txt").read_text()
          if "JPEG Motion Photo" not in oppo_plan or "TranscodeRequired" not in oppo_plan:
              raise SystemExit("OPPO HEIC input did not report the blocked JPEG route")
          if (root / "samsung-heic-to-oppoMP.jpg").exists():
              raise SystemExit("OPPO JPEG route published a HEIC source")
          PY
          sha256sum "$vivo" "$xiaomi" "$oppo" > "$output/sources-after.sha256"
          sha256sum "$output"/*MP.jpg "$output"/*MP.heic "$output"/vivo-apple.heic "$output"/vivo-apple.mov > "$output/outputs.sha256"

      - name: Upload public target acceptance media and proof
        if: always() && runner.os == 'Linux' && github.head_ref == 'cursor/target-fidelity-outputs-1ba2'
        uses: actions/upload-artifact@v7
        with:
          name: target-acceptance-public-fixtures
          path: ${{ runner.temp }}/target-acceptance/
          retention-days: 7
          if-no-files-found: warn

  macos-package:
    name: macos-package (arm64)
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      MACOSX_DEPLOYMENT_TARGET: "27.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: Install build tools and check portable packaging contracts
        shell: bash
        run: |
          brew install cmake ninja nasm pkgconf
          python3 -m unittest tests.test_macos_distribution -v
      - name: Build checksum-pinned native dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/distribution-artifacts/evidence"
          python3 scripts/distribution/build_native.py --arch arm64 \
            --work "$RUNNER_TEMP/xdremux-native" \
            2>&1 | tee "$RUNNER_TEMP/distribution-artifacts/evidence/native-build.log"
      - name: Build and archive the current Rust CLI and complete Apple adapter
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$RUNNER_TEMP/xdremux-native/prefix/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PKG_CONFIG_PATH"
          export RUSTFLAGS='-C link-arg=-Wl,-headerpad_max_install_names'
          cargo build --locked --release --target aarch64-apple-darwin -p xdremux-cli
          swift build -c release --product xdremux-apple-adapter -Xlinker -headerpad_max_install_names
          adapter="$(swift build -c release --show-bin-path)/xdremux-apple-adapter"
          package="$RUNNER_TEMP/staging/XDRemux-macOS-arm64"
          python3 scripts/distribution/macos.py stage \
            --cli target/aarch64-apple-darwin/release/xdremux --adapter "$adapter" \
            --native "$RUNNER_TEMP/xdremux-native" --output "$package" \
            --arch arm64 --head "$EXPECTED_HEAD"
          python3 scripts/distribution/macos.py archive --package "$package" \
            --output "$RUNNER_TEMP/distribution-artifacts/XDRemux-macOS-arm64.tar.gz" \
            --epoch "$(git show -s --format=%ct HEAD)"
          cp "$RUNNER_TEMP/staging/XDRemux-macOS-arm64-linkage.json" "$RUNNER_TEMP/distribution-artifacts/evidence/"
          cp "$RUNNER_TEMP/xdremux-native/build/libheif/CMakeCache.txt" "$RUNNER_TEMP/distribution-artifacts/evidence/libheif-cmake-cache.txt"
          {
            git rev-parse HEAD
            rustc --version
            cargo --version
            swift --version
            xcodebuild -version
            sw_vers
            printf 'ImageVersion=%s\n' "${ImageVersion:-unknown}"
          } > "$RUNNER_TEMP/distribution-artifacts/evidence/toolchain.txt"
      - name: Run the extracted package outside the checkout with only system environment
        shell: bash
        run: |
          python3 scripts/distribution/smoke_macos.py \
            --archive "$RUNNER_TEMP/distribution-artifacts/XDRemux-macOS-arm64.tar.gz" \
            --fixtures "$GITHUB_WORKSPACE/fixtures" --arch arm64 \
            --expected-head "$EXPECTED_HEAD" \
            --output "$RUNNER_TEMP/distribution-artifacts/evidence/relocated"
      - name: Convert X9 Ultra fixtures and render Key 1 before and after
        shell: bash
        run: bash scripts/apple/render_proxdr_styles_color.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: XDRemux-macOS-arm64
          path: ${{ runner.temp }}/distribution-artifacts/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: key1-color-before-after
          path: ${{ runner.temp }}/key1-color
          retention-days: 14
          if-no-files-found: error
