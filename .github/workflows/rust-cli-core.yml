name: Rust CLI core

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-classification/**"
      - "crates/xdremux-cli/**"
      - "crates/xdremux-runtime/**"
      - "crates/xdremux-source/**"
      - "crates/xdremux-engine/**"
      - "crates/xdremux-codec/**"
      - "crates/xdremux-heif/**"
      - "crates/xdremux-hdr/**"
      - "crates/xdremux-metadata/**"
      - "crates/xdremux-format/**"
      - "crates/xdremux-container/**"
      - "crates/xdremux-motion-photo/**"
      - "scripts/check_rust_cli_smoke.sh"
      - ".github/workflows/rust-cli-core.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-classification/**"
      - "crates/xdremux-cli/**"
      - "crates/xdremux-runtime/**"
      - "crates/xdremux-source/**"
      - "crates/xdremux-engine/**"
      - "crates/xdremux-codec/**"
      - "crates/xdremux-heif/**"
      - "crates/xdremux-hdr/**"
      - "crates/xdremux-metadata/**"
      - "crates/xdremux-format/**"
      - "crates/xdremux-container/**"
      - "crates/xdremux-motion-photo/**"
      - "scripts/check_rust_cli_smoke.sh"
      - ".github/workflows/rust-cli-core.yml"

permissions:
  contents: read

jobs:
  rust-cli-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install portable HEVC provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libheif-plugin-x265 libheif-plugin-libde265
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Verify committed workspace lockfile
        shell: bash
        run: |
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.committed"
          cargo generate-lockfile
          if ! cmp -s "$RUNNER_TEMP/Cargo.lock.committed" Cargo.lock; then
            echo "::error::Cargo.lock is stale; commit the generated workspace lockfile"
            echo "::group::Generated Cargo.lock"
            cat Cargo.lock
            echo "::endgroup::"
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --check -p xdremux-classification -p xdremux-source -p xdremux-runtime -p xdremux-cli
      - name: Lint canonical Rust CLI stack
        run: cargo clippy --locked -p xdremux-classification -p xdremux-source -p xdremux-runtime -p xdremux-cli --all-targets -- -D warnings
      - name: Test canonical Rust CLI stack
        run: cargo test --locked -p xdremux-classification -p xdremux-source -p xdremux-runtime -p xdremux-cli
      - name: Exercise real Rust CLI routes
        run: bash scripts/check_rust_cli_smoke.sh
      - name: Verify exact-head completion gate
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/xdremux-rust-cli-gate.json" <<'JSON'
          {
            "schema_version": 1,
            "scope": "Verify the canonical Rust classification, source routing, ProXDR runtime, batch/categorize product surfaces, and xdremux CLI entry point including functional media conversion",
            "checks": [
              {
                "name": "rust-workspace-lock",
                "kind": "static",
                "command": ["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"],
                "timeout_seconds": 600
              },
              {
                "name": "rust-cli-stack-regressions",
                "kind": "regression",
                "command": ["cargo", "test", "--locked", "-p", "xdremux-classification", "-p", "xdremux-source", "-p", "xdremux-runtime", "-p", "xdremux-cli"],
                "timeout_seconds": 900
              },
              {
                "name": "rust-cli-real-file-smoke",
                "kind": "integration",
                "command": ["bash", "scripts/check_rust_cli_smoke.sh"],
                "timeout_seconds": 600
              },
              {
                "name": "rust-cli-stack-clippy",
                "kind": "static",
                "command": ["cargo", "clippy", "--locked", "-p", "xdremux-classification", "-p", "xdremux-source", "-p", "xdremux-runtime", "-p", "xdremux-cli", "--all-targets", "--", "-D", "warnings"],
                "timeout_seconds": 900
              }
            ]
          }
          JSON
          python3 scripts/agent_completion_gate.py run \
            --base origin/feat/rust-xdremux-format \
            --plan "$RUNNER_TEMP/xdremux-rust-cli-gate.json"
          python3 scripts/agent_completion_gate.py verify \
            ".codex/verification-receipts/$(git rev-parse HEAD).json"

  portable-cli-build:
    name: portable-cli-build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install libheif + HEVC on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Install libheif + HEVC on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # libheif-sys uses the MSVC static-runtime-compatible vcpkg triplet by default.
          # Install the exact triplet it probes instead of a parallel dynamic x64-windows tree.
          $triplet = "x64-windows-static-md"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libheif[hevc]:$triplet"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=$triplet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$env:VCPKG_INSTALLATION_ROOT\installed\$triplet\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build canonical Rust CLI
        run: cargo build --locked -p xdremux-cli
      - name: Test portable Rust CLI conversion semantics
        run: cargo test --locked -p xdremux-classification -p xdremux-source -p xdremux-runtime -p xdremux-cli
