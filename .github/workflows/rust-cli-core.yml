name: Rust CLI core

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-cli/**"
      - "crates/xdremux-source/**"
      - "crates/xdremux-container/**"
      - "crates/xdremux-motion-photo/**"
      - "scripts/check_rust_cli_smoke.sh"
      - ".github/workflows/rust-cli-core.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-cli/**"
      - "crates/xdremux-source/**"
      - "crates/xdremux-container/**"
      - "crates/xdremux-motion-photo/**"
      - "scripts/check_rust_cli_smoke.sh"
      - ".github/workflows/rust-cli-core.yml"

permissions:
  contents: read

jobs:
  rust-cli-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Verify committed workspace lockfile
        shell: bash
        run: |
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.committed"
          cargo generate-lockfile
          if ! cmp -s "$RUNNER_TEMP/Cargo.lock.committed" Cargo.lock; then
            echo "::error::Cargo.lock is stale; commit the generated workspace lockfile"
            echo "::group::Generated Cargo.lock"
            cat Cargo.lock
            echo "::endgroup::"
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --check -p xdremux-source -p xdremux-cli
      - name: Lint Rust source routing and CLI
        run: cargo clippy --locked -p xdremux-source -p xdremux-cli --all-targets -- -D warnings
      - name: Test Rust source routing and CLI
        run: cargo test --locked -p xdremux-source -p xdremux-cli
      - name: Exercise real Rust CLI route
        run: bash scripts/check_rust_cli_smoke.sh
      - name: Verify exact-head completion gate
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/xdremux-rust-cli-gate.json" <<'JSON'
          {
            "schema_version": 1,
            "scope": "Introduce the canonical Rust input-routing layer and the first real xdremux Rust CLI product entry point without moving source semantics into the CLI shell",
            "checks": [
              {
                "name": "rust-workspace-lock",
                "kind": "static",
                "command": ["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"],
                "timeout_seconds": 600
              },
              {
                "name": "rust-source-cli-regressions",
                "kind": "regression",
                "command": ["cargo", "test", "--locked", "-p", "xdremux-source", "-p", "xdremux-cli"],
                "timeout_seconds": 600
              },
              {
                "name": "rust-cli-real-file-smoke",
                "kind": "integration",
                "command": ["bash", "scripts/check_rust_cli_smoke.sh"],
                "timeout_seconds": 600
              },
              {
                "name": "rust-source-cli-clippy",
                "kind": "static",
                "command": ["cargo", "clippy", "--locked", "-p", "xdremux-source", "-p", "xdremux-cli", "--all-targets", "--", "-D", "warnings"],
                "timeout_seconds": 600
              }
            ]
          }
          JSON
          python3 scripts/agent_completion_gate.py run \
            --base origin/feat/rust-xdremux-format \
            --plan "$RUNNER_TEMP/xdremux-rust-cli-gate.json"
          python3 scripts/agent_completion_gate.py verify \
            ".codex/verification-receipts/$(git rev-parse HEAD).json"

  portable-cli-build:
    name: portable-cli-build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build canonical Rust CLI
        run: cargo build --locked -p xdremux-cli
      - name: Test portable source and CLI semantics
        run: cargo test --locked -p xdremux-source -p xdremux-cli
