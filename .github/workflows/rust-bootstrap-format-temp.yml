name: Temporary Rust bootstrap formatter

on:
  push:
    branches:
      - feat/rust-xdremux-format
    paths:
      - ".github/workflows/rust-bootstrap-format-temp.yml"

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-xdremux-format
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply canonical rustfmt
        run: cargo fmt --all
      - name: Verify format crate
        run: |
          cargo clippy --locked -p xdremux-format --all-targets -- -D warnings
          cargo test --locked -p xdremux-format
      - name: Verify classification crate
        run: |
          cargo clippy --locked -p xdremux-classification --all-targets -- -D warnings
          cargo test --locked -p xdremux-classification
      - name: Commit verified formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "rustfmt made no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/xdremux-format crates/xdremux-classification
          git commit -m "style(rust): apply canonical core formatting"
          git push origin HEAD:feat/rust-xdremux-format
