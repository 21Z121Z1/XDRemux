name: Temporary Rust bootstrap formatter

on:
  push:
    branches:
      - feat/rust-xdremux-format
    paths:
      - ".github/workflows/rust-bootstrap-format-temp.yml"

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-xdremux-format
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply Clippy-guided JPEG iterator fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/xdremux-format/src/jpeg.rs")
          text = path.read_text()
          old = "for chunk in payload[6..].chunks_exact(3) {"
          new = "for chunk in payload[6..].as_chunks::<3>().0 {"
          if text.count(old) != 1:
              raise SystemExit(f"expected one chunks_exact site, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
      - name: Refresh canonical Cargo lockfile
        run: cargo generate-lockfile
      - name: Apply canonical rustfmt
        run: cargo fmt --all
      - name: Verify format crate
        run: |
          cargo clippy --locked -p xdremux-format --all-targets -- -D warnings
          cargo test --locked -p xdremux-format
      - name: Verify classification crate
        run: |
          cargo clippy --locked -p xdremux-classification --all-targets -- -D warnings
          cargo test --locked -p xdremux-classification
      - name: Commit verified bootstrap output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/xdremux-format crates/xdremux-classification
          git diff --cached --quiet && { echo "no verified source changes"; exit 0; }
          git commit -m "build(rust): normalize classification bootstrap"
          git push origin HEAD:feat/rust-xdremux-format
