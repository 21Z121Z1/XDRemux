name: TextureStyle Xcode 27 Fast Runtime

on:
  push:
    branches:
      - research/photographic-styles-3-texture-probe
    paths:
      - .github/workflows/texture-style-xcode27-fast.yml
      - scripts/research/texture_style_ios27_sim_probe_v2.m
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-runtime:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Select and boot iOS 27
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild -version | tee artifacts/xcode.txt
          xcrun --sdk iphonesimulator --show-sdk-version | tee artifacts/sdk.txt
          xcrun simctl list runtimes -j > artifacts/runtimes.json
          xcrun simctl list devicetypes -j > artifacts/device-types.json
          python3 - <<'PY' > artifacts/selection.env
          import json
          from pathlib import Path
          rs=json.loads(Path('artifacts/runtimes.json').read_text()).get('runtimes',[])
          rs=[r for r in rs if 'iOS' in (str(r.get('name',''))+str(r.get('identifier',''))) and r.get('isAvailable',True)]
          rs=[r for r in rs if str(r.get('version','')).startswith('27.')]
          if not rs: raise SystemExit('no iOS 27 runtime')
          def v(r): return tuple(int(x) if x.isdigit() else 0 for x in str(r.get('version','0')).split('.'))
          r=sorted(rs,key=v)[-1]
          ds=json.loads(Path('artifacts/device-types.json').read_text()).get('devicetypes',[])
          iph=[d for d in ds if str(d.get('name','')).startswith('iPhone')]
          if not iph: raise SystemExit('no iPhone type')
          preferred=[d for d in iph if d.get('identifier') == 'com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro']
          device=(preferred or iph)[0]
          print('RUNTIME_ID='+str(r['identifier']))
          print('RUNTIME_VERSION='+str(r.get('version','')))
          print('RUNTIME_BUILD='+str(r.get('buildversion','')))
          print('DEVICE_TYPE='+str(device['identifier']))
          PY
          cat artifacts/selection.env
          cat artifacts/selection.env >> "$GITHUB_ENV"
      - name: Compile and execute private probe v2
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl create TextureStyleProbe "$DEVICE_TYPE" "$RUNTIME_ID")"
          LAUNCH_PID=""
          cleanup() {
            xcrun simctl terminate "$UDID" org.xdremux.TextureStyleProbe >/dev/null 2>&1 || true
            if [[ -n "${LAUNCH_PID:-}" ]]; then kill "$LAUNCH_PID" >/dev/null 2>&1 || true; fi
            xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$UDID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b | tee artifacts/boot.txt
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          ARCH="$(uname -m)"
          APP="$RUNNER_TEMP/TextureStyleProbe.app"
          mkdir -p "$APP"
          PROBE_SOURCE="$RUNNER_TEMP/texture_style_ios27_sim_probe_v2.m"
          python3 - <<'PY'
          from pathlib import Path
          source = Path('scripts/research/texture_style_ios27_sim_probe_v2.m').read_text()

          # CGDataProviderCreateWithData requires a C callback. This one-shot
          # probe can leave its 256-byte buffer for process teardown.
          callback = '^(void *info,const void *data,size_t size){ free((void *)data); }'
          assert callback in source, 'expected CGDataProvider block callback was not found'
          source = source.replace(callback, 'NULL', 1)

          # Xcode 27/iOS 27 requires the UIScene lifecycle. Run BuildProbe only
          # after a UIWindowScene connects, rather than from didFinishLaunching.
          old_tail = r'''@interface ProbeDelegate:UIResponder<UIApplicationDelegate> @end
          @implementation ProbeDelegate
          - (BOOL)application:(UIApplication *)app didFinishLaunchingWithOptions:(NSDictionary *)opts {
              (void)app;(void)opts;
              NSURL *docs=[[[NSFileManager defaultManager] URLsForDirectory:NSDocumentDirectory inDomains:NSUserDomainMask] firstObject];
              NSDictionary *probe=BuildProbe(docs);
              NSData *json=[NSJSONSerialization dataWithJSONObject:probe options:NSJSONWritingPrettyPrinted|NSJSONWritingSortedKeys error:nil];
              [json writeToURL:[docs URLByAppendingPathComponent:@"texture-style-ios27-probe-v2.json"] atomically:YES];
              NSLog(@"TEXTURE_STYLE_PROBE_V2_BEGIN\n%@\nTEXTURE_STYLE_PROBE_V2_END",[[NSString alloc] initWithData:json encoding:NSUTF8StringEncoding]);
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW,(int64_t)(0.2*NSEC_PER_SEC)),dispatch_get_main_queue(),^{ exit(0); });
              return YES;
          }
          @end
          int main(int argc,char *argv[]){ @autoreleasepool { return UIApplicationMain(argc,argv,nil,NSStringFromClass([ProbeDelegate class])); } }
          '''
          new_tail = r'''static void RunTextureStyleProbe(void) {
              NSURL *docs=[[[NSFileManager defaultManager] URLsForDirectory:NSDocumentDirectory inDomains:NSUserDomainMask] firstObject];
              NSDictionary *probe=BuildProbe(docs);
              NSData *json=[NSJSONSerialization dataWithJSONObject:probe options:NSJSONWritingPrettyPrinted|NSJSONWritingSortedKeys error:nil];
              [json writeToURL:[docs URLByAppendingPathComponent:@"texture-style-ios27-probe-v2.json"] atomically:YES];
              NSLog(@"TEXTURE_STYLE_PROBE_V2_BEGIN\n%@\nTEXTURE_STYLE_PROBE_V2_END",[[NSString alloc] initWithData:json encoding:NSUTF8StringEncoding]);
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW,(int64_t)(0.2*NSEC_PER_SEC)),dispatch_get_main_queue(),^{ exit(0); });
          }

          @interface ProbeSceneDelegate:UIResponder<UIWindowSceneDelegate>
          @property(strong,nonatomic) UIWindow *window;
          @end
          @implementation ProbeSceneDelegate
          - (void)scene:(UIScene *)scene willConnectToSession:(UISceneSession *)session options:(UISceneConnectionOptions *)connectionOptions {
              (void)session;(void)connectionOptions;
              if (![scene isKindOfClass:[UIWindowScene class]]) return;
              self.window=[[UIWindow alloc] initWithWindowScene:(UIWindowScene *)scene];
              self.window.rootViewController=[UIViewController new];
              [self.window makeKeyAndVisible];
              dispatch_async(dispatch_get_main_queue(), ^{ RunTextureStyleProbe(); });
          }
          @end

          @interface ProbeDelegate:UIResponder<UIApplicationDelegate> @end
          @implementation ProbeDelegate
          - (UISceneConfiguration *)application:(UIApplication *)application configurationForConnectingSceneSession:(UISceneSession *)connectingSceneSession options:(UISceneConnectionOptions *)options {
              (void)application;(void)options;
              UISceneConfiguration *configuration=[[UISceneConfiguration alloc] initWithName:@"Default Configuration" sessionRole:connectingSceneSession.role];
              configuration.delegateClass=[ProbeSceneDelegate class];
              return configuration;
          }
          @end
          int main(int argc,char *argv[]){ @autoreleasepool { return UIApplicationMain(argc,argv,nil,NSStringFromClass([ProbeDelegate class])); } }
          '''
          assert old_tail in source, 'expected pre-iOS-27 application delegate tail was not found'
          source = source.replace(old_tail, new_tail, 1)
          Path('/tmp/texture_style_probe_source.tmp').write_text(source)
          PY
          cp /tmp/texture_style_probe_source.tmp "$PROBE_SOURCE"
          xcrun --sdk iphonesimulator clang -fobjc-arc \
            -target "${ARCH}-apple-ios${SDK_VERSION}-simulator" -isysroot "$SDK" \
            -framework Foundation -framework UIKit -framework ImageIO -framework CoreGraphics \
            "$PROBE_SOURCE" -o "$APP/TextureStyleProbe" \
            2>&1 | tee artifacts/compile.txt
          cat > "$APP/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>org.xdremux.TextureStyleProbe</string>
            <key>CFBundleExecutable</key><string>TextureStyleProbe</string>
            <key>CFBundleName</key><string>TextureStyleProbe</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>MinimumOSVersion</key><string>${SDK_VERSION}</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIApplicationSceneManifest</key>
            <dict>
              <key>UIApplicationSupportsMultipleScenes</key><false/>
              <key>UISceneConfigurations</key>
              <dict>
                <key>UIWindowSceneSessionRoleApplication</key>
                <array><dict>
                  <key>UISceneConfigurationName</key><string>Default Configuration</string>
                  <key>UISceneDelegateClassName</key><string>ProbeSceneDelegate</string>
                </dict></array>
              </dict>
            </dict>
          </dict></plist>
          PLIST
          codesign --force --sign - "$APP"
          xcrun simctl install "$UDID" "$APP"
          DATA="$(xcrun simctl get_app_container "$UDID" org.xdremux.TextureStyleProbe data)"
          mkdir -p "$DATA/Documents"

          set +e
          xcrun simctl launch --console "$UDID" org.xdremux.TextureStyleProbe > artifacts/launch.txt 2>&1 &
          LAUNCH_PID=$!
          set -e
          found=0
          for i in $(seq 1 60); do
            if [[ -s "$DATA/Documents/texture-style-ios27-probe-v2.json" ]]; then
              found=1
              break
            fi
            sleep 1
          done
          if [[ "$found" -ne 1 ]]; then
            xcrun simctl spawn "$UDID" log show --style compact --last 3m \
              --predicate 'process == "TextureStyleProbe"' > artifacts/system-log.txt 2>&1 || true
            xcrun simctl terminate "$UDID" org.xdremux.TextureStyleProbe >/dev/null 2>&1 || true
            kill "$LAUNCH_PID" >/dev/null 2>&1 || true
            wait "$LAUNCH_PID" >/dev/null 2>&1 || true
            LAUNCH_PID=""
            cat artifacts/launch.txt || true
            cat artifacts/system-log.txt || true
            exit 1
          fi
          kill "$LAUNCH_PID" >/dev/null 2>&1 || true
          wait "$LAUNCH_PID" >/dev/null 2>&1 || true
          LAUNCH_PID=""
          cp "$DATA/Documents/texture-style-ios27-probe-v2.json" artifacts/runtime-probe-v2.json
          [[ ! -s "$DATA/Documents/texture-style-imageio-probe.jpg" ]] || cp "$DATA/Documents/texture-style-imageio-probe.jpg" artifacts/texture-style-imageio-probe.jpg
          cat artifacts/runtime-probe-v2.json
      - name: Upload runtime probe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: texture-style-xcode27-fast-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/
