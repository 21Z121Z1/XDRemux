name: TextureStyle iOS 27 Runtime Only

on:
  push:
    branches:
      - research/photographic-styles-3-texture-probe
    paths:
      - scripts/research/texture_style_ios27_sim_probe.m
      - .github/workflows/texture-style-ios27-runtime-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-probe:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select latest installed iOS 27 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios27-runtime
          xcodebuild -version | tee artifacts/ios27-runtime/xcode.txt
          xcrun --sdk iphonesimulator --show-sdk-version | tee artifacts/ios27-runtime/sdk-version.txt
          xcrun simctl list runtimes -j > artifacts/ios27-runtime/runtimes.json
          xcrun simctl list devicetypes -j > artifacts/ios27-runtime/device-types.json
          python3 - <<'PY' > artifacts/ios27-runtime/selection.env
          import json
          from pathlib import Path
          obj=json.loads(Path('artifacts/ios27-runtime/runtimes.json').read_text())
          candidates=[]
          for r in obj.get('runtimes', []):
              text=' '.join(str(r.get(k,'')) for k in ('name','version','identifier','buildversion'))
              if 'iOS' in text and ('27.' in text or 'iOS-27' in text) and r.get('isAvailable', True):
                  candidates.append(r)
          if not candidates:
              raise SystemExit('no available iOS 27 runtime')
          def key(r):
              return tuple(int(p) if p.isdigit() else 0 for p in str(r.get('version','0')).split('.'))
          r=sorted(candidates, key=key)[-1]
          print('RUNTIME_ID='+str(r.get('identifier','')))
          print('RUNTIME_NAME='+str(r.get('name','')))
          print('RUNTIME_VERSION='+str(r.get('version','')))
          print('RUNTIME_BUILD='+str(r.get('buildversion','')))
          print('RUNTIME_BUNDLE='+str(r.get('bundlePath','')))
          devices=json.loads(Path('artifacts/ios27-runtime/device-types.json').read_text()).get('devicetypes',[])
          by_name={str(d.get('name','')):d for d in devices}
          preferred=['iPhone 17 Pro','iPhone 17 Pro Max','iPhone 17','iPhone Air','iPhone 16 Pro','iPhone 16 Pro Max']
          chosen=next((by_name[name] for name in preferred if name in by_name), None)
          if chosen is None:
              iphones=[d for d in devices if str(d.get('name','')).startswith('iPhone') and int(d.get('maxRuntimeVersion', 0xffffffff)) >= 0x1b0000]
              chosen=iphones[0] if iphones else None
          if chosen is None:
              raise SystemExit('no iOS 27-compatible iPhone simulator device type')
          print('DEVICE_TYPE='+str(chosen.get('identifier','')))
          print('DEVICE_NAME='+str(chosen.get('name','')))
          PY
          cat artifacts/ios27-runtime/selection.env
          cat artifacts/ios27-runtime/selection.env >> "$GITHUB_ENV"

      - name: Extract selected runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNTIME_BUNDLE"
          printf '%s\n' "$ROOT" > artifacts/ios27-runtime/runtime-root.txt
          for fw in PhotoImaging NeutrinoCore PhotosFormats AVFCapture CMCaptureCore CMImaging CameraEditKit; do
            binary="$(find "$ROOT" -type f -path "*/${fw}.framework/${fw}" -print -quit 2>/dev/null || true)"
            printf '%s\n' "$binary" > "artifacts/ios27-runtime/${fw}-binary.txt"
            [[ -n "$binary" ]] || continue
            {
              file "$binary" || true
              nm -nm "$binary" 2>/dev/null | grep -i -E 'TextureStyle|SemanticStyle|MakerNote' || true
            } > "artifacts/ios27-runtime/${fw}-symbols.txt"
            strings -a "$binary" 2>/dev/null \
              | grep -i -E 'texture.?style|film.?grain|capture.?mode|capture.?type|hardware.?model|port.?type|reversib|maker.?note' \
              > "artifacts/ios27-runtime/${fw}-strings.txt" || true
          done

      - name: Boot simulator and execute private runtime probe
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl create TextureStyleProbe "$DEVICE_TYPE" "$RUNTIME_ID")"
          cleanup() { xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true; xcrun simctl delete "$UDID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          echo "$UDID" > artifacts/ios27-runtime/device-udid.txt
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b | tee artifacts/ios27-runtime/boot.txt

          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          ARCH="$(uname -m)"
          APP="$RUNNER_TEMP/TextureStyleProbe.app"
          mkdir -p "$APP"
          xcrun --sdk iphonesimulator clang \
            -fobjc-arc \
            -target "${ARCH}-apple-ios${SDK_VERSION}-simulator" \
            -isysroot "$SDK" \
            -framework Foundation -framework UIKit -framework ImageIO \
            scripts/research/texture_style_ios27_sim_probe.m \
            -o "$APP/TextureStyleProbe" \
            2>&1 | tee artifacts/ios27-runtime/compile.txt
          cat > "$APP/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>org.xdremux.TextureStyleProbe</string>
            <key>CFBundleExecutable</key><string>TextureStyleProbe</string>
            <key>CFBundleName</key><string>TextureStyleProbe</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>MinimumOSVersion</key><string>${SDK_VERSION}</string>
            <key>LSRequiresIPhoneOS</key><true/>
          </dict></plist>
          PLIST
          codesign --force --sign - "$APP" 2>&1 | tee artifacts/ios27-runtime/codesign.txt
          xcrun simctl install "$UDID" "$APP" 2>&1 | tee artifacts/ios27-runtime/install.txt

          set +e
          xcrun simctl launch "$UDID" org.xdremux.TextureStyleProbe > artifacts/ios27-runtime/launch.txt 2>&1
          LAUNCH_STATUS=$?
          set -e
          echo "$LAUNCH_STATUS" > artifacts/ios27-runtime/launch-status.txt

          DATA_CONTAINER="$(xcrun simctl get_app_container "$UDID" org.xdremux.TextureStyleProbe data)"
          echo "$DATA_CONTAINER" > artifacts/ios27-runtime/data-container.txt
          for _ in $(seq 1 20); do
            [[ -s "$DATA_CONTAINER/Documents/texture-style-ios27-probe.json" ]] && break
            sleep 0.5
          done

          mkdir -p artifacts/ios27-runtime/checkpoints
          find "$DATA_CONTAINER/Documents" -maxdepth 1 -type f -name 'checkpoint-*.json' \
            -exec cp {} artifacts/ios27-runtime/checkpoints/ \; 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process == "TextureStyleProbe" OR process == "SpringBoard"' \
            > artifacts/ios27-runtime/system-log.txt 2>&1 || true
          find "$DATA_CONTAINER/Library/Logs/DiagnosticReports" -type f -maxdepth 1 \
            -exec cp {} artifacts/ios27-runtime/ \; 2>/dev/null || true

          if [[ -s "$DATA_CONTAINER/Documents/texture-style-ios27-probe.json" ]]; then
            cp "$DATA_CONTAINER/Documents/texture-style-ios27-probe.json" artifacts/ios27-runtime/runtime-probe.json
            cat artifacts/ios27-runtime/runtime-probe.json
          else
            echo "probe output missing" | tee artifacts/ios27-runtime/failure.txt
            cat artifacts/ios27-runtime/launch.txt || true
            ls -la artifacts/ios27-runtime/checkpoints || true
            exit 1
          fi

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: texture-style-ios27-runtime-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/ios27-runtime/
