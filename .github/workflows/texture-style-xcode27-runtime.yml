name: TextureStyle Xcode 27 Runtime Probe

on:
  push:
    branches:
      - research/photographic-styles-3-texture-probe
    paths:
      - .github/workflows/texture-style-xcode27-runtime.yml
      - scripts/research/texture_style_ios27_sim_probe.m
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-probe:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Inspect Xcode 27 environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild -version | tee artifacts/xcode.txt
          xcrun --sdk iphonesimulator --show-sdk-version | tee artifacts/sdk.txt
          xcrun simctl list runtimes | tee artifacts/runtimes.txt
          xcrun simctl list runtimes -j > artifacts/runtimes.json
          xcrun simctl list devicetypes -j > artifacts/device-types.json
          python3 - <<'PY' > artifacts/selection.env
          import json
          from pathlib import Path
          runtimes=json.loads(Path('artifacts/runtimes.json').read_text()).get('runtimes',[])
          ios=[r for r in runtimes if 'iOS' in (str(r.get('name',''))+str(r.get('identifier',''))) and r.get('isAvailable', True)]
          if not ios: raise SystemExit('no available iOS runtime')
          def ver(r): return tuple(int(x) if x.isdigit() else 0 for x in str(r.get('version','0')).split('.'))
          r=sorted(ios,key=ver)[-1]
          if not str(r.get('version','')).startswith('27.'):
              raise SystemExit('latest available iOS runtime is not 27.x: '+repr(r))
          devices=json.loads(Path('artifacts/device-types.json').read_text()).get('devicetypes',[])
          iphones=[d for d in devices if str(d.get('name','')).startswith('iPhone')]
          if not iphones: raise SystemExit('no iPhone device type')
          print('RUNTIME_ID='+str(r.get('identifier','')))
          print('RUNTIME_VERSION='+str(r.get('version','')))
          print('RUNTIME_BUILD='+str(r.get('buildversion','')))
          print('RUNTIME_BUNDLE='+str(r.get('bundlePath','')))
          print('DEVICE_TYPE='+str(iphones[-1].get('identifier','')))
          PY
          cat artifacts/selection.env
          cat artifacts/selection.env >> "$GITHUB_ENV"

      - name: Dump selected iOS 27 private framework symbols and strings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/frameworks
          ROOT="$RUNTIME_BUNDLE"
          [[ -d "$ROOT" ]] || ROOT="$(dirname "$(xcrun --sdk iphonesimulator --show-sdk-path)")"
          echo "$ROOT" > artifacts/runtime-root.txt
          for fw in PhotoImaging NeutrinoCore PhotosFormats AVFCapture CMCaptureCore CMImaging CameraEditKit; do
            binary="$(find "$ROOT" -type f -path "*/${fw}.framework/${fw}" -print -quit 2>/dev/null || true)"
            echo "$binary" > "artifacts/frameworks/${fw}.path"
            [[ -n "$binary" ]] || continue
            nm -nm "$binary" 2>/dev/null | grep -i -E 'TextureStyle|SemanticStyle|MakerNote' > "artifacts/frameworks/${fw}.symbols" || true
            strings -a "$binary" 2>/dev/null | grep -i -E 'texture.?style|film.?grain|capture.?mode|capture.?type|hardware.?model|port.?type|reversib|maker.?note' > "artifacts/frameworks/${fw}.strings" || true
          done

      - name: Execute TextureStyle private API probe in iOS 27 Simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl create TextureStyleProbe "$DEVICE_TYPE" "$RUNTIME_ID")"
          cleanup() { xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true; xcrun simctl delete "$UDID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b | tee artifacts/boot.txt

          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          ARCH="$(uname -m)"
          APP="$RUNNER_TEMP/TextureStyleProbe.app"
          mkdir -p "$APP"
          xcrun --sdk iphonesimulator clang -fobjc-arc \
            -target "${ARCH}-apple-ios${SDK_VERSION}-simulator" -isysroot "$SDK" \
            -framework Foundation -framework UIKit -framework ImageIO \
            scripts/research/texture_style_ios27_sim_probe.m -o "$APP/TextureStyleProbe" \
            2>&1 | tee artifacts/compile.txt
          cat > "$APP/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>org.xdremux.TextureStyleProbe</string>
            <key>CFBundleExecutable</key><string>TextureStyleProbe</string>
            <key>CFBundleName</key><string>TextureStyleProbe</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>MinimumOSVersion</key><string>${SDK_VERSION}</string>
            <key>LSRequiresIPhoneOS</key><true/>
          </dict></plist>
          PLIST
          codesign --force --sign - "$APP"
          xcrun simctl install "$UDID" "$APP"
          set +e
          xcrun simctl launch --console "$UDID" org.xdremux.TextureStyleProbe > artifacts/launch.txt 2>&1
          STATUS=$?
          set -e
          echo "$STATUS" > artifacts/launch-status.txt
          DATA="$(xcrun simctl get_app_container "$UDID" org.xdremux.TextureStyleProbe data)"
          if [[ -s "$DATA/Documents/texture-style-ios27-probe.json" ]]; then
            cp "$DATA/Documents/texture-style-ios27-probe.json" artifacts/runtime-probe.json
            cat artifacts/runtime-probe.json
          else
            cat artifacts/launch.txt
            exit 1
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: texture-style-xcode27-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/
