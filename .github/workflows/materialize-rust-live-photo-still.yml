name: Materialize Rust Live Photo HEIF still slice

on:
  push:
    branches: [feat/rust-cli-unification]
    paths:
      - .github/workflows/materialize-rust-live-photo-still.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize lockfile and formatting
        run: |
          cargo generate-lockfile
          cargo fmt -p xdremux-motion-photo
          git diff --check
      - name: Lint portable Motion Photo core
        run: cargo clippy --locked -p xdremux-motion-photo --all-targets -- -D warnings
      - name: Test portable Motion Photo core
        run: cargo test --locked -p xdremux-motion-photo
      - name: Gate real Samsung HEIF Live Photo still
        run: cargo test --locked -p xdremux-motion-photo --test live_photo_heif_still_fixture -- --nocapture
      - name: Commit verified materialization
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- Cargo.lock crates/xdremux-motion-photo; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/xdremux-motion-photo
          git commit -m "test(rust-motion-photo): materialize HEIF still slice"
          git push origin HEAD:feat/rust-cli-unification
