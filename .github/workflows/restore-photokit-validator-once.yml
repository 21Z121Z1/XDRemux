name: Restore PhotoKit Validator Once

on:
  push:
    branches:
      - test/macos26-photographic-styles-smoke
    paths:
      - .github/workflows/restore-photokit-validator-once.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore validator to main behavior
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- Sources/XDRemuxAppleFeatures/LivePhoto/AppleLivePhotoValidator.swift
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/XDRemuxAppleFeatures/LivePhoto/AppleLivePhotoValidator.swift
          git commit -m "test: restore default PhotoKit validation behavior"
          git push origin HEAD:test/macos26-photographic-styles-smoke
