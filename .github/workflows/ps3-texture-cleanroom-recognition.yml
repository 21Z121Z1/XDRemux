name: PS3 TextureStyle Cleanroom Recognition

on:
  workflow_dispatch:
  push:
    branches:
      - research/photographic-styles-3-texture-cleanroom-v8
    paths:
      - .github/workflows/ps3-texture-cleanroom-recognition.yml
      - scripts/research/patch_texture_style_heif_v7_cleanroom.py
      - scripts/research/patch_texture_style_heif_v3.py

permissions:
  actions: read
  contents: read

jobs:
  cleanroom-recognition:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Download public PS3 baseline artifact
        uses: actions/download-artifact@v5
        with:
          name: ps3-texture-style-v5-xcode27-a80e635a1e490ffe6c82ec1625f48e0365b3561c
          path: source-artifact
          github-token: ${{ github.token }}
          repository: 21Z121Z1/XDRemux
          run-id: 34623523344

      - name: Select baseline and record host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/manifests artifacts/probes
          baseline="$(find source-artifact -type f -name 'A-baseline-original.heic' -print -quit)"
          test -s "$baseline"
          cp "$baseline" artifacts/A-baseline-original.heic
          sha256sum artifacts/A-baseline-original.heic | tee artifacts/input-sha256.txt
          sw_vers | tee artifacts/macos.txt
          xcodebuild -version | tee artifacts/xcode.txt

      - name: Build clean-room TextureStyle A/B candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/research/patch_texture_style_heif_v7_cleanroom.py

          python3 scripts/research/patch_texture_style_heif_v7_cleanroom.py \
            artifacts/A-baseline-original.heic artifacts/B-tag84-only.heic \
            --mode tag84-only \
            --manifest artifacts/manifests/B-tag84-only.json

          python3 scripts/research/patch_texture_style_heif_v7_cleanroom.py \
            artifacts/A-baseline-original.heic artifacts/C-native-primary.heic \
            --mode primary --film-grain-seed 0 \
            --hardware-model 'iPhone 18 Pro' \
            --manifest artifacts/manifests/C-native-primary.json

          python3 scripts/research/patch_texture_style_heif_v7_cleanroom.py \
            artifacts/A-baseline-original.heic artifacts/D-native-primary-tmap.heic \
            --mode primary+tmap --film-grain-seed 0 \
            --hardware-model 'iPhone 18 Pro' \
            --manifest artifacts/manifests/D-native-primary-tmap.json

          python3 scripts/research/patch_texture_style_heif_v7_cleanroom.py \
            artifacts/A-baseline-original.heic artifacts/E-internalmodel-primary.heic \
            --mode primary --film-grain-seed 0 \
            --hardware-model 'iPhone19,2' \
            --manifest artifacts/manifests/E-internalmodel-primary.json

          python3 scripts/research/patch_texture_style_heif_v7_cleanroom.py \
            artifacts/A-baseline-original.heic artifacts/F-internalmodel-primary-tmap.heic \
            --mode primary+tmap --film-grain-seed 0 \
            --hardware-model 'iPhone19,2' \
            --manifest artifacts/manifests/F-internalmodel-primary-tmap.json

          sha256sum artifacts/*.heic | tee artifacts/candidate-sha256.txt
          strings -a artifacts/C-native-primary.heic | \
            grep -E '2023:photo:metadata:styles|2026:photo:metadata:texture_styles|metadata' \
            | tee artifacts/native-container-strings.txt || true

      - name: Probe PhotosFormats TextureStyle recognition
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pf_texture_probe.m" <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <objc/message.h>
          #import <objc/runtime.h>
          #import <dlfcn.h>

          static id OpenMetadata(NSURL *url) {
              Class cls = NSClassFromString(@"PFMetadataImage");
              if (!cls) return nil;
              id contentType = nil;
              Class ut = NSClassFromString(@"UTType");
              SEL typeSel = NSSelectorFromString(@"typeWithIdentifier:");
              if (ut && [ut respondsToSelector:typeSel]) {
                  contentType = ((id(*)(id,SEL,id))objc_msgSend)(ut, typeSel, @"public.heic");
              }
              id obj = [cls alloc];
              SEL simple = NSSelectorFromString(@"initWithImageURL:contentType:timeZoneLookup:");
              if ([obj respondsToSelector:simple]) {
                  @try {
                      id v = ((id(*)(id,SEL,id,id,id))objc_msgSend)(obj, simple, url, contentType, nil);
                      if (v) return v;
                  } @catch (__unused NSException *e) {}
              }
              obj = [cls alloc];
              SEL full = NSSelectorFromString(@"initWithImageURL:contentType:options:timeZoneLookup:cacheImageSource:cacheImageData:");
              if ([obj respondsToSelector:full]) {
                  @try {
                      return ((id(*)(id,SEL,id,id,unsigned long long,id,BOOL,BOOL))objc_msgSend)(
                          obj, full, url, contentType, 0, nil, YES, YES);
                  } @catch (__unused NSException *e) {}
              }
              return nil;
          }

          static id BoolSelector(id obj, NSString *name, NSMutableDictionary *out) {
              SEL sel = NSSelectorFromString(name);
              NSString *availableKey = [name stringByAppendingString:@"Available"];
              out[availableKey] = @([obj respondsToSelector:sel]);
              if (![obj respondsToSelector:sel]) return nil;
              @try {
                  BOOL value = ((BOOL(*)(id,SEL))objc_msgSend)(obj, sel);
                  out[name] = @(value);
                  return @(value);
              } @catch (NSException *e) {
                  out[[name stringByAppendingString:@"Exception"]] = e.description ?: @"unknown";
                  return nil;
              }
          }

          int main(int argc, const char **argv) { @autoreleasepool {
              if (argc != 3) return 64;
              void *h = dlopen("/System/Library/PrivateFrameworks/PhotosFormats.framework/PhotosFormats", RTLD_NOW|RTLD_GLOBAL);
              NSMutableDictionary *out = [NSMutableDictionary dictionary];
              out[@"frameworkLoaded"] = @(h != NULL);
              out[@"classAvailable"] = @(NSClassFromString(@"PFMetadataImage") != Nil);
              NSURL *url = [NSURL fileURLWithPath:[NSString stringWithUTF8String:argv[1]]];
              id metadata = OpenMetadata(url);
              out[@"metadataClass"] = metadata ? NSStringFromClass([metadata class]) : @"nil";
              if (metadata) {
                  BoolSelector(metadata, @"hasSmartStyle", out);
                  BoolSelector(metadata, @"hasTextureStyle", out);
              }
              NSData *j = [NSJSONSerialization dataWithJSONObject:out options:(NSJSONWritingPrettyPrinted|NSJSONWritingSortedKeys) error:nil];
              [j writeToFile:[NSString stringWithUTF8String:argv[2]] atomically:YES];
              fwrite(j.bytes, 1, j.length, stdout); fputc('\n', stdout);
              return metadata ? 0 : 2;
          }}
          OBJC

          xcrun clang -fobjc-arc -framework Foundation -framework UniformTypeIdentifiers \
            "$RUNNER_TEMP/pf_texture_probe.m" -o "$RUNNER_TEMP/pf_texture_probe"

          for f in artifacts/*.heic; do
            base="$(basename "$f" .heic)"
            "$RUNNER_TEMP/pf_texture_probe" "$f" "artifacts/probes/${base}.json" \
              > "artifacts/probes/${base}.stdout" 2> "artifacts/probes/${base}.stderr" || true
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          results = {}
          for p in sorted(Path('artifacts/probes').glob('*.json')):
              results[p.stem] = json.loads(p.read_text())
          Path('artifacts/recognition-summary.json').write_text(json.dumps(results, indent=2, sort_keys=True) + '\n')
          print(json.dumps(results, indent=2, sort_keys=True))

          baseline = results.get('A-baseline-original', {})
          if baseline.get('hasTextureStyleAvailable') is not True:
              raise SystemExit('PFMetadataImage.hasTextureStyle is unavailable on this Xcode 27 host')
          if baseline.get('hasTextureStyle') is True:
              raise SystemExit('baseline unexpectedly reports TextureStyle; oracle is not discriminating')

          candidates = {k: v for k, v in results.items() if k != 'A-baseline-original'}
          hits = [k for k, v in candidates.items() if v.get('hasTextureStyle') is True]
          Path('artifacts/recognized-candidates.txt').write_text('\n'.join(hits) + ('\n' if hits else ''))
          if not hits:
              raise SystemExit('no clean-room candidate is recognized as TextureStyle')
          print('TextureStyle recognized candidates:', ', '.join(hits))
          PY

      - name: Upload clean-room candidates and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ps3-texture-cleanroom-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/
