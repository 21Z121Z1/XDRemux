name: Temporary convergence audit

on:
  push:
    branches: [converge/single-main-20260923]
    paths: [.github/workflows/convergence-audit.yml]

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture public repository history and authoritative metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          mkdir -p /tmp/xdremux-convergence
          git bundle create /tmp/xdremux-convergence/repository.bundle --all
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.error, urllib.request
          root = pathlib.Path('/tmp/xdremux-convergence')
          prefix = 'https://api.github.com/repos/21Z121Z1/XDRemux'
          def get(endpoint):
              req = urllib.request.Request(prefix + endpoint, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  return {'http_status': error.code, 'endpoint': endpoint, 'body': error.read().decode()}
          endpoints = {
              'repository': '', 'branches': '/branches?per_page=100',
              'tags': '/tags?per_page=100', 'pulls': '/pulls?state=all&per_page=100&sort=updated&direction=desc',
              'issues': '/issues?state=all&per_page=100&sort=updated&direction=desc',
              'workflows': '/actions/workflows?per_page=100',
              'main_runs': '/actions/runs?branch=main&per_page=30',
              'rules': '/rules/branches/main', 'protection': '/branches/main/protection',
          }
          state = {key: get(value) for key, value in endpoints.items()}
          (root / 'github-state.json').write_text(json.dumps(state, indent=2))
          def git(*args):
              return subprocess.check_output(['git', *args], text=True)
          base = '33de01f071bbf7668fa0ea16e6bbae420cb4d125'
          branches = []
          for line in git('for-each-ref', '--format=%(refname:short) %(objectname)', 'refs/remotes/origin').splitlines():
              ref, head = line.split()
              if ref in ('origin/HEAD', 'origin/main', 'origin/converge/single-main-20260923'):
                  continue
              branch = ref.removeprefix('origin/')
              merge_base = git('merge-base', base, head).strip()
              directory = root / 'branches' / branch.replace('/', '__')
              directory.mkdir(parents=True)
              for name, args in {
                  'unique-history.txt': ('log', '--format=fuller', '--stat', f'{base}..{head}'),
                  'unique.diff': ('diff', '--find-renames', '--full-index', merge_base, head),
                  'main-to-head.diff': ('diff', '--find-renames', '--full-index', base, head),
                  'files.txt': ('diff', '--find-renames', '--name-status', merge_base, head),
                  'patch-equivalence.txt': ('cherry', base, head),
                  'tree.txt': ('ls-tree', '-rl', head),
              }.items():
                  (directory / name).write_text(git(*args))
              branches.append({'branch': branch, 'head': head, 'merge_base': merge_base,
                               'unique_commits': git('rev-list', '--reverse', f'{base}..{head}').splitlines()})
          (root / 'inventory.json').write_text(json.dumps({'starting_main': base, 'branches': branches}, indent=2))
          print(json.dumps({'starting_main': base, 'branches': [dict(x, unique_commits=len(x['unique_commits'])) for x in branches]}, indent=2))
          for p in git('ls-files').splitlines():
              if p.rsplit('/', 1)[-1].lower() in ('agents.md', 'claude.md', 'skill.md'):
                  print('INSTRUCTION FILE:', p)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: xdremux-convergence-snapshot
          path: /tmp/xdremux-convergence/
          retention-days: 7
          if-no-files-found: error
