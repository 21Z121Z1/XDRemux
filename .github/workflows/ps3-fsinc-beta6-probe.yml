name: PS3 FSINC Beta6 Probe

on:
  push:
    branches:
      - research/ps3-fsinc-beta6-probe
    paths:
      - .github/workflows/ps3-fsinc-beta6-probe.yml
      - scripts/research/fsinc_execute.m
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Record runner and fetch public portrait fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/input artifacts/probe artifacts/masks/instances artifacts/masks/semantic
          sw_vers | tee artifacts/probe/macos.txt
          xcodebuild -version | tee artifacts/probe/xcode.txt
          fixture_sha=f89eea8c1714eb5d1e3da1ff8ba83e61655181d5
          fixture_path=fixtures/proxdr/oppo/find-x9-ultra/uhdr-portrait-01.heic
          git fetch --no-tags --depth=1 origin "$fixture_sha"
          git show "$fixture_sha:$fixture_path" > artifacts/input/portrait.heic
          shasum -a 256 artifacts/input/portrait.heic | tee artifacts/input/SHA256.txt
          sips -g pixelWidth -g pixelHeight -g orientation artifacts/input/portrait.heic | tee artifacts/input/sips.txt

      - name: Reverse FSINC version dispatch and inspect bundled MIL
        shell: bash
        run: |
          set -euo pipefail
          BIN=/System/Library/PrivateFrameworks/ANSTKit.framework/Versions/A/ANSTKit
          MODEL=/System/Library/PrivateFrameworks/ANSTKit.framework/Versions/A/Resources/Models/fsinc_v2d4.mlmodelc/model.mil
          xcrun nm -nm "$BIN" > artifacts/probe/anst-nm.txt || true
          xcrun otool -tvV "$BIN" > artifacts/probe/anst-disasm-full.txt
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('artifacts/probe/anst-disasm-full.txt').read_text(errors='replace').splitlines()
          needles=['ANSTFsincAlgorithmVersionToNSString','ANSTFsincInferenceVersionToNSString','_concreteClassOfVersion','ANSTFsincAlgorithmResolutionToNSString']
          out=[]
          for needle in needles:
              hits=[i for i,l in enumerate(lines) if needle in l]
              out.append(f'===== {needle} hits={hits} =====')
              for i in hits:
                  out.extend(lines[max(0,i-8):min(len(lines),i+100)])
          Path('artifacts/probe/fsinc-version-disasm.txt').write_text('\n'.join(out))
          print('\n'.join(out))
          PY
          {
            echo '=== model.mil head ==='
            head -80 "$MODEL" || true
            echo '=== opset/cast references ==='
            grep -a -n -E 'opset|ios17|ios18|cast|program|function' "$MODEL" | head -200 || true
          } | tee artifacts/probe/fsinc-model-mil.txt

      - name: Build executable FSINC inference probe
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc \
            -framework Foundation \
            -framework CoreImage \
            -framework CoreVideo \
            -framework CoreGraphics \
            -framework ImageIO \
            scripts/research/fsinc_execute.m \
            -o artifacts/probe/fsinc_execute

      - name: Execute native FSINC inference
        shell: bash
        run: |
          set -o pipefail
          ./artifacts/probe/fsinc_execute artifacts/input/portrait.heic artifacts/masks 2>&1 | tee artifacts/probe/inference.txt
          status=${PIPESTATUS[0]}
          find artifacts/masks -type f -maxdepth 3 -print | sort | tee artifacts/probe/generated-files.txt
          exit "$status"

      - name: Record bundled FSINC model
        if: always()
        shell: bash
        run: |
          set +e
          find /System/Library/PrivateFrameworks/ANSTKit.framework/Versions/A/Resources/Models -maxdepth 2 -type d -print | sort | tee artifacts/probe/models.txt
          du -sh /System/Library/PrivateFrameworks/ANSTKit.framework/Versions/A/Resources/Models/fsinc_v2d4.mlmodelc 2>/dev/null | tee -a artifacts/probe/models.txt

      - name: Upload native masks and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ps3-fsinc-beta6-native-masks-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: artifacts/
