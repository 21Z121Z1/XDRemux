name: PS3 FSINC Beta6 Probe

on:
  push:
    branches:
      - research/ps3-fsinc-beta6-probe
    paths:
      - .github/workflows/ps3-fsinc-beta6-probe.yml
      - scripts/research/fsinc_execute.m
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Record runner and fetch public portrait fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/input artifacts/probe artifacts/masks/instances artifacts/masks/semantic
          sw_vers | tee artifacts/probe/macos.txt
          xcodebuild -version | tee artifacts/probe/xcode.txt
          fixture_sha=f89eea8c1714eb5d1e3da1ff8ba83e61655181d5
          fixture_path=fixtures/proxdr/oppo/find-x9-ultra/uhdr-portrait-01.heic
          git fetch --no-tags --depth=1 origin "$fixture_sha"
          git show "$fixture_sha:$fixture_path" > artifacts/input/portrait.heic
          shasum -a 256 artifacts/input/portrait.heic | tee artifacts/input/SHA256.txt
          sips -g pixelWidth -g pixelHeight -g orientation artifacts/input/portrait.heic | tee artifacts/input/sips.txt

      - name: Inspect bundled FSINC model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR=/System/Library/PrivateFrameworks/ANSTKit.framework/Versions/A/Resources/Models/fsinc_v2d4.mlmodelc
          test -d "$MODEL_DIR"
          du -sh "$MODEL_DIR" | tee artifacts/probe/model-size.txt
          find "$MODEL_DIR" -maxdepth 2 -type f -print | sort | tee artifacts/probe/model-files.txt
          strings "$MODEL_DIR/model.mil" | grep -E -i 'resolution_|semantic_|instance_|ios17|ios18|cast' | head -500 > artifacts/probe/model-symbols.txt || true

      - name: Build executable FSINC inference probe
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc \
            -framework Foundation \
            -framework CoreImage \
            -framework CoreVideo \
            -framework CoreGraphics \
            -framework ImageIO \
            scripts/research/fsinc_execute.m \
            -o artifacts/probe/fsinc_execute

      - name: Execute native FSINC inference
        shell: bash
        run: |
          set -o pipefail
          ./artifacts/probe/fsinc_execute artifacts/input/portrait.heic artifacts/masks 2>&1 | tee artifacts/probe/inference.txt
          status=${PIPESTATUS[0]}
          find artifacts/masks -maxdepth 3 -type f -print | sort | tee artifacts/probe/generated-files.txt
          exit "$status"

      - name: Upload native masks and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ps3-fsinc-beta6-native-masks-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: artifacts/
