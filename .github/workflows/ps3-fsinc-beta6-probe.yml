name: PS3 FSINC Beta6 Probe

on:
  push:
    branches:
      - research/ps3-fsinc-beta6-probe
    paths:
      - .github/workflows/ps3-fsinc-beta6-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Record runner and fetch public portrait fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/input artifacts/probe
          sw_vers | tee artifacts/probe/macos.txt
          xcodebuild -version | tee artifacts/probe/xcode.txt
          fixture_sha=f89eea8c1714eb5d1e3da1ff8ba83e61655181d5
          fixture_path=fixtures/proxdr/oppo/find-x9-ultra/uhdr-portrait-01.heic
          git fetch --no-tags --depth=1 origin "$fixture_sha"
          git show "$fixture_sha:$fixture_path" > artifacts/input/portrait.heic
          shasum -a 256 artifacts/input/portrait.heic | tee artifacts/input/SHA256.txt

      - name: Build ANSTKit FSINC runtime probe
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/probe/fsinc_probe.m <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>
          #import <dlfcn.h>

          static void dump_methods(Class cls, BOOL classMethods) {
              Class target = classMethods ? object_getClass(cls) : cls;
              unsigned int count = 0;
              Method *methods = class_copyMethodList(target, &count);
              printf("METHODS %s %s count=%u\n", class_getName(cls), classMethods ? "+" : "-", count);
              for (unsigned int i = 0; i < count; i++) {
                  SEL s = method_getName(methods[i]);
                  const char *types = method_getTypeEncoding(methods[i]);
                  printf("  %c[%s %s] types=%s\n", classMethods ? '+' : '-', class_getName(cls), sel_getName(s), types ?: "?");
              }
              free(methods);
          }

          static void dump_ivars(Class cls) {
              unsigned int count = 0;
              Ivar *ivars = class_copyIvarList(cls, &count);
              printf("IVARS %s count=%u\n", class_getName(cls), count);
              for (unsigned int i = 0; i < count; i++) {
                  printf("  %s type=%s\n", ivar_getName(ivars[i]), ivar_getTypeEncoding(ivars[i]));
              }
              free(ivars);
          }

          static void dump_class(NSString *name) {
              Class cls = NSClassFromString(name);
              printf("CLASS %s => %p\n", name.UTF8String, cls);
              if (!cls) return;
              dump_methods(cls, YES);
              dump_methods(cls, NO);
              dump_ivars(cls);
          }

          int main(int argc, const char *argv[]) {
              @autoreleasepool {
                  const char *paths[] = {
                      "/System/Library/PrivateFrameworks/ANSTKit.framework/Versions/A/ANSTKit",
                      "/System/Library/PrivateFrameworks/ANSTKit.framework/ANSTKit",
                      "/System/Library/PrivateFrameworks/VisionCore.framework/Versions/A/VisionCore",
                      "/System/Library/PrivateFrameworks/VisionCore.framework/VisionCore",
                      NULL
                  };
                  for (int i = 0; paths[i]; i++) {
                      void *h = dlopen(paths[i], RTLD_NOW | RTLD_GLOBAL);
                      printf("DLOPEN %s => %p error=%s\n", paths[i], h, h ? "none" : dlerror());
                  }

                  NSArray *classes = @[
                      @"ANSTFsincAlgorithm",
                      @"ANSTFsincAlgorithmConfiguration",
                      @"ANSTFsincAlgorithmResult",
                      @"ANSTFsincInferenceConfiguration",
                      @"ANSTFsincInferenceDescriptor",
                      @"ANSTFsincInferenceDescriptorV2Dot4",
                      @"ANSTFsincInferencePostprocessorV2Dot4",
                      @"ANSTFsincInferencePostprocessorV2",
                      @"ANSTAssetProvider",
                      @"_ANSTMobileAssetManager"
                  ];
                  for (NSString *name in classes) dump_class(name);

                  printf("ENV input=%s\n", argc > 1 ? argv[1] : "none");
                  printf("ANST bundle=%s\n", [[NSBundle bundleWithPath:@"/System/Library/PrivateFrameworks/ANSTKit.framework"] bundlePath].UTF8String);
              }
              return 0;
          }
          OBJC
          clang -fobjc-arc -framework Foundation artifacts/probe/fsinc_probe.m -o artifacts/probe/fsinc_probe

      - name: Run FSINC runtime probe and inspect assets
        shell: bash
        run: |
          set -o pipefail
          ./artifacts/probe/fsinc_probe artifacts/input/portrait.heic 2>&1 | tee artifacts/probe/runtime.txt
          {
            echo '=== ANSTKit files ==='
            find /System/Library/PrivateFrameworks/ANSTKit.framework -maxdepth 5 -type f 2>/dev/null | sort
            echo '=== FSINC/model candidates ==='
            find /System/Library /Library -iname '*fsinc*' -o -iname '*ANST*mlmodelc*' 2>/dev/null | head -500
            echo '=== MobileAsset candidates ==='
            find /System/Library/AssetsV2 /Library/AssetsV2 -maxdepth 5 -iname '*ANST*' -o -iname '*fsinc*' 2>/dev/null | head -500
          } | tee artifacts/probe/assets.txt

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ps3-fsinc-beta6-probe-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: artifacts/
