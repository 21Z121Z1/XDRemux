name: Temporary Rust maintenance

on:
  push:
    branches:
      - feat/rust-cli-unification
    paths:
      - .github/workflows/_temp-rust-maintenance.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Normalize Portrait engine migration
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p xdremux-engine
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock -- '*.rs'
          git commit -m "build: normalize Portrait Rust migration"
          git push origin HEAD:feat/rust-cli-unification
