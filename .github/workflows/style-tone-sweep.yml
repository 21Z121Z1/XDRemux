name: Photographic Styles tone response

on:
  pull_request:
    paths:
      - ".github/workflows/style-tone-sweep.yml"
      - "scripts/apple/run_style_tone_sweep.sh"
      - "scripts/apple/check_style_tone_response.py"
      - "crates/xdremux-engine/**"
      - "crates/xdremux-runtime/**"
      - "crates/xdremux-hdr/**"
      - "crates/xdremux-cli/**"
      - "fixtures/proxdr/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xdremux-style-tone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tone-response:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out the published consumer model
        uses: actions/checkout@v7
        with:
          repository: 21Z121Z1/Photographic_Style_Research
          ref: 37dd551a949047ed14580efa0c0a2556922791b5
          path: consumer-research
          persist-credentials: false

      - name: Install the HEVC provider and the sweep packages
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"
          python3 -m pip install --user numpy pillow

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Build the Rust CLI and the Apple adapter
        shell: bash
        run: |
          cargo build --locked -p xdremux-cli
          swift build --product xdremux-apple-adapter
          test -x target/debug/xdremux
          test -x "$(swift build --show-bin-path)/xdremux-apple-adapter"

      - name: Render tone sweeps
        shell: bash
        env:
          RESEARCH_ROOT: ${{ github.workspace }}/consumer-research
          TONE_OUT: ${{ github.workspace }}/artifacts/tone-response
          XDREMUX_CLI: ${{ github.workspace }}/target/debug/xdremux
        run: |
          adapter="$(swift build --show-bin-path)/xdremux-apple-adapter"
          XDREMUX_APPLE_ADAPTER="$adapter" \
            bash scripts/apple/run_style_tone_sweep.sh

      - name: Upload tone response
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: style-tone-response
          if-no-files-found: warn
          retention-days: 1
          path: artifacts/tone-response/
