name: Verify Rust validate slice

on:
  workflow_dispatch:
  push:
    branches: [feat/rust-cli-unification]
    paths:
      - .github/workflows/implement-rust-validate.yml
      - scripts/materialize_rust_validate.py
      - crates/xdremux-runtime/src/validation.rs
      - crates/xdremux-cli/src/validate.rs
      - crates/xdremux-cli/tests/validate.rs

permissions:
  contents: write

concurrency:
  group: rust-cli-unification-writer
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
          fetch-depth: 0
      - name: Install portable HEVC provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libheif-plugin-x265 libheif-plugin-libde265
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize validate product wiring
        run: |
          python3 scripts/materialize_rust_validate.py
          python3 scripts/materialize_rust_validate.py
          cargo generate-lockfile
          cargo fmt -p xdremux-runtime -p xdremux-cli
          git diff --check
      - name: Lint canonical validation stack
        run: |
          cargo clippy --locked \
            -p xdremux-heif -p xdremux-motion-photo -p xdremux-runtime -p xdremux-cli \
            --all-targets -- -D warnings
      - name: Test canonical validation stack
        run: |
          cargo test --locked -p xdremux-runtime validation -- --nocapture
          cargo test --locked -p xdremux-cli --test validate -- --nocapture
          cargo test --locked -p xdremux-cli --lib -- --nocapture
      - name: Commit verified validation wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/xdremux-runtime/src/lib.rs crates/xdremux-cli/src/lib.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated or formatting changes to commit.'
          else
            git commit -m 'feat(rust): wire canonical validate product slice'
            git push origin HEAD:feat/rust-cli-unification
          fi
