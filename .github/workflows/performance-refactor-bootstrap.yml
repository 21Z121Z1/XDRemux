name: Performance Refactor Bootstrap

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: performance-refactor-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/performance-by-design'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply deterministic refactor
        run: |
          python3 scripts/apply_performance_by_design.py
          python3 scripts/apply_performance_by_design_followup.py
          python3 scripts/apply_performance_by_design_phase2.py
          python3 scripts/apply_performance_by_design_phase2_fix.py
          python3 scripts/apply_performance_by_design_phase3.py
          python3 scripts/apply_performance_by_design_phase3_followup.py

      - name: Architecture regression checks
        run: python3 -m unittest Tests.test_performance_design

      - name: Swift targeted regression tests
        run: swift test --filter PerformanceDesignTests

      - name: Release build
        run: swift build -c release

      - name: macOS app model regression
        shell: bash
        run: |
          xcodebuild \
            -quiet \
            -project apps/macos/XDRemuxApp/XDRemuxApp.xcodeproj \
            -scheme XDRemuxAppModelTests \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/xdremux-app-model-tests" \
            build
          "$RUNNER_TEMP/xdremux-app-model-tests/Build/Products/Debug/XDRemuxAppModelTests"

      - name: Commit verified source transformation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source transformation pending."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Sources/XDRemuxCore/RAW/CoreImageRAW.swift \
            Sources/XDRemuxCore/HDR/HDRPipeline.swift \
            Sources/XDRemuxCore/HEIF/DirectTiledHEVCGainMapEncoder.swift \
            Sources/XDRemuxCore/Resources/Native/apple_vt_hevc_encoder.swift \
            Sources/XDRemuxAppleFeatures/PhotographicStyles/ConstrainedPolynomialStyleDataProducer.swift \
            apps/macos/XDRemuxApp/Sources/XDRemuxViewModel.swift \
            apps/macos/XDRemuxApp/Sources/ContentView.swift \
            apps/macos/XDRemuxApp/Tests/XDRemuxAppModelTests.swift \
            Tests/test_performance_design.py \
            Tests/XDRemuxAppleFeaturesTests/PerformanceDesignTests.swift
          git commit -m "perf: bound app and solver hot-path work"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
