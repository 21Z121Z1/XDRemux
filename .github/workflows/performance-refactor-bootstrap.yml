name: Performance Refactor Bootstrap

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: performance-refactor-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/performance-by-design'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply pending deterministic follow-ups
        run: |
          python3 scripts/apply_performance_by_design_phase5.py
          python3 scripts/apply_performance_by_design_phase6.py

      - name: Architecture regression checks
        run: python3 -m unittest Tests.test_performance_design

      - name: Commit transformed source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source transformation pending."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Sources/XDRemuxCore/HEIF/DirectTiledHEVCGainMapEncoder.swift \
            Sources/XDRemuxAppleFeatures/PhotographicStyles/ConstrainedPolynomialStyleDataProducer.swift \
            Tests/test_performance_design.py \
            Tests/XDRemuxAppleFeaturesTests/PerformanceDesignTests.swift
          git commit -m "perf: finish hot-path ownership cleanup"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
