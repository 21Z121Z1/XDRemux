name: Codex persistent Apple helper runner

on:
  push:
    branches: [codex/persistent-apple-helper]

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/persistent-apple-helper
          fetch-depth: 0

      - name: Install portable HEVC provider
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply persistent transport implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('.github/workflows/_codex-persistent-apple-helper.yml').read_text(encoding='utf-8').splitlines()
          start = source.index("          python3 - <<'PY'") + 1
          end = source.index("          PY", start)
          extracted = []
          for line in source[start:end]:
              if line.startswith('          '):
                  line = line[10:]
              extracted.append(line)
          script = '\n'.join(extracted) + '\n'
          script, client_blocks = re.subn(r"\nold_client = '''.*?'''\.replace\(\"          \", \"\"\)\n", "\n", script, count=1, flags=re.S)
          script, reader_blocks = re.subn(r"\nold_readers = r'''.*?'''\n", "\n", script, count=1, flags=re.S)
          perf_test = '\n'.join([
              '    def test_apple_adapter_transport_is_persistent_bounded_and_fail_closed(self) -> None:',
              '        rust = self.source("crates/xdremux-runtime/src/apple_adapter.rs")',
              '        swift = self.source("Sources/XDRemuxAppleAdapter/main.swift")',
              '        lifecycle = self.source("scripts/characterize_apple_adapter_launches.py")',
              '        for marker in (',
              '            "--persistent-json-lines",',
              '            "MAX_APPLE_ADAPTER_FRAME_BYTES",',
              '            "recv_timeout",',
              '            "child.kill()",',
              '            "child.wait()",',
              '        ):',
              '            self.assertIn(marker, rust)',
              '        self.assertNotIn("POLL_INTERVAL", rust)',
              '        for marker in (',
              '            "--persistent-json-lines",',
              '            "maxTransportFrameBytes",',
              '            "read(upToCount:",',
              '            "runOneShotTransport",',
              '            "runPersistentTransport",',
              '        ):',
              '            self.assertIn(marker, swift)',
              '        self.assertIn("exec ", lifecycle)',
              '        self.assertIn("$@", lifecycle)',
              '',
          ]) + '\n'
          script, perf_blocks = re.subn(
              r"\npersistent_test = '''.*?'''\n",
              lambda _: "\npersistent_test = " + repr(perf_test) + "\n",
              script,
              count=1,
              flags=re.S,
          )
          if client_blocks != 1 or reader_blocks != 1 or perf_blocks != 1:
              raise SystemExit(f'prototype extraction blocks: client={client_blocks}, readers={reader_blocks}, perf={perf_blocks}')
          client_call = 'text = replace_once(text, old_client, new_client, "apple adapter client/session")'
          client_splice = '\n'.join([
              'client_start = text.index("#[derive(Debug, Clone, PartialEq, Eq)]\\npub(super) struct AppleAdapterClient")',
              'client_end = text.index("    pub(super) fn capabilities", client_start)',
              'text = text[:client_start] + new_client + text[client_end:]',
          ])
          reader_call = 'text = replace_once(text, old_readers, new_readers, "apple adapter bounded readers")'
          reader_splice = '\n'.join([
              'readers_start = text.index("fn read_all(mut reader: impl Read)")',
              'readers_end = text.index("#[cfg(test)]", readers_start)',
              'text = text[:readers_start] + new_readers + text[readers_end:]',
          ])
          if script.count(client_call) != 1 or script.count(reader_call) != 1:
              raise SystemExit('prototype extraction splice call count mismatch')
          script = script.replace(client_call, client_splice, 1)
          script = script.replace(reader_call, reader_splice, 1)
          compile(script, '/tmp/xdremux-persistent-apple-helper.py', 'exec')
          Path('/tmp/xdremux-persistent-apple-helper.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/xdremux-persistent-apple-helper.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/xdremux-runtime/src/oppo_portrait.rs')
          text = path.read_text(encoding='utf-8')
          old = 'use std::path::Path;\n'
          if text.count(old) != 1:
              raise SystemExit(f'oppo portrait Path import: expected exactly one match, got {text.count(old)}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          cargo fmt --all
          git diff --check

      - name: Run targeted regression checks
        shell: bash
        run: |
          python3 -m unittest Tests.test_performance_design Tests.test_performance_budget
          cargo test --locked -p xdremux-runtime --all-targets --release

      - name: Build Apple adapter and canonical CLI
        shell: bash
        run: |
          swift build -c release --product xdremux-apple-adapter
          cargo build --locked -p xdremux-cli --release
          echo "XDREMUX_PROTOTYPE_APPLE_ADAPTER=$(swift build -c release --show-bin-path)/xdremux-apple-adapter" >> "$GITHUB_ENV"

      - name: Exercise Rust-driven Apple product paths
        shell: bash
        run: |
          export XDREMUX_APPLE_ADAPTER="$XDREMUX_PROTOTYPE_APPLE_ADAPTER"
          bash scripts/check_rust_cli_apple_portrait.sh
          bash scripts/check_rust_style_consumer.sh

      - name: Require one helper launch per conversion
        shell: bash
        run: |
          python3 scripts/characterize_apple_adapter_launches.py \
            --cli "$GITHUB_WORKSPACE/target/release/xdremux" \
            --apple-adapter "$XDREMUX_PROTOTYPE_APPLE_ADAPTER" \
            --output "$RUNNER_TEMP/apple-adapter-launches.json"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"apple-adapter-launches.json"; r=json.loads(p.read_text()); expected={"apple-portrait":1,"apple-styles":1}; assert r.get("cases")==expected, r.get("cases"); print(r["cases"])'

      - name: Commit verified implementation to prototype branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Sources/XDRemuxAppleAdapter/main.swift \
            crates/xdremux-runtime/src/apple_adapter.rs \
            crates/xdremux-runtime/src/oppo_portrait.rs \
            crates/xdremux-runtime/src/lib.rs \
            scripts/characterize_apple_adapter_launches.py \
            benchmarks/macos26-arm64-product-baseline.json \
            Tests/test_performance_budget.py \
            Tests/test_performance_design.py
          git diff --cached --check
          git commit -m "perf(apple): reuse persistent adapter session"
          git push origin HEAD:codex/persistent-apple-helper
