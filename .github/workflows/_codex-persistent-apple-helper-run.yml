name: Codex persistent Apple helper finalizer

on:
  push:
    branches: [codex/persistent-apple-helper]

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/persistent-apple-helper
          fetch-depth: 0

      - name: Finalize reviewed source and permanent regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          swift = Path('Sources/XDRemuxAppleAdapter/main.swift')
          text = swift.read_text(encoding='utf-8')
          old = '\n'.join([
              '        while let newline = pending.firstIndex(of: 0x0A) {',
              '  let frameLength = pending.distance(from: pending.startIndex, to: newline)',
              '  guard frameLength <= maxTransportFrameBytes else {',
              '      fail("apple adapter request exceeds transport safety limit")',
              '  }',
              '  var frame = Data(pending[..<newline])',
              '  pending.removeFirst(frameLength + 1)',
              '  if frame.last == 0x0D {',
              '      frame.removeLast()',
              '  }',
              '  guard !frame.isEmpty else {',
              '      fail("apple adapter persistent request frame is empty")',
              '  }',
              '  try output.write(contentsOf: encodedResponse(for: frame))',
              '        }',
              '        guard pending.count <= maxTransportFrameBytes else {',
              '  fail("apple adapter request exceeds transport safety limit")',
              '        }',
          ])
          new = '\n'.join([
              '        while let newline = pending.firstIndex(of: 0x0A) {',
              '            let frameLength = pending.distance(from: pending.startIndex, to: newline)',
              '            guard frameLength <= maxTransportFrameBytes else {',
              '                fail("apple adapter request exceeds transport safety limit")',
              '            }',
              '            var frame = Data(pending[..<newline])',
              '            pending.removeFirst(frameLength + 1)',
              '            if frame.last == 0x0D {',
              '                frame.removeLast()',
              '            }',
              '            guard !frame.isEmpty else {',
              '                fail("apple adapter persistent request frame is empty")',
              '            }',
              '            try output.write(contentsOf: encodedResponse(for: frame))',
              '        }',
              '        guard pending.count <= maxTransportFrameBytes else {',
              '            fail("apple adapter request exceeds transport safety limit")',
              '        }',
          ])
          if old in text:
              text = text.replace(old, new, 1)
              swift.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('reviewed Swift persistent framing block not found')

          handshake = Path('scripts/check_apple_adapter_handshake.sh')
          text = handshake.read_text(encoding='utf-8')
          marker = "PY\n\nTEST_INPUT=\"$PWD/fixtures/motion-photo/samsung/jpeg-ultrahdr-01.jpg\"\n"
          insert = '''PY

# Persistent transport must answer successive requests without waiting for stdin EOF.
# This is a behavioral regression gate: a one-shot-style buffered read can otherwise
# look correct in unit tests while deadlocking the first real Rust request.
python3 - "$ADAPTER" <<'PY'
import json
import select
import subprocess
import sys

adapter = sys.argv[1]
process = subprocess.Popen(
    [adapter, "--persistent-json-lines"],
    stdin=subprocess.PIPE,
    stdout=subprocess.PIPE,
    stderr=subprocess.PIPE,
)
assert process.stdin is not None
assert process.stdout is not None
assert process.stderr is not None
request = json.dumps({"schema_version": 2, "operation": "capabilities"}).encode() + b"\\n"
try:
    for index in range(2):
        process.stdin.write(request)
        process.stdin.flush()
        ready, _, _ = select.select([process.stdout], [], [], 5.0)
        if not ready:
            raise SystemExit(
                f"persistent Apple adapter did not answer request {index + 1} while stdin remained open"
            )
        response = json.loads(process.stdout.readline())
        if response.get("schema_version") != 2:
            raise SystemExit(f"unexpected persistent Apple adapter response: {response!r}")
        if sorted(response.get("capabilities", [])) != ["photographic-styles", "portrait"]:
            raise SystemExit(f"unexpected persistent Apple adapter capabilities: {response!r}")
    process.stdin.close()
    status = process.wait(timeout=5.0)
    if status != 0:
        raise SystemExit(
            f"persistent Apple adapter exited with {status}: "
            + process.stderr.read().decode(errors="replace")
        )
finally:
    if process.poll() is None:
        process.kill()
        process.wait()
PY

TEST_INPUT="$PWD/fixtures/motion-photo/samsung/jpeg-ultrahdr-01.jpg"
'''
          permanent = 'persistent Apple adapter did not answer request'
          if permanent not in text:
              if marker not in text:
                  raise SystemExit('Apple adapter handshake insertion marker not found')
              text = text.replace(marker, insert, 1)
              handshake.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Install portable HEVC provider
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Verify permanent handshake and affected runtime
        shell: bash
        run: |
          bash scripts/check_apple_adapter_handshake.sh
          python3 -m unittest Tests.test_performance_design Tests.test_performance_budget
          cargo test --locked -p xdremux-runtime --all-targets --release

      - name: Commit reviewed finalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "prototype already finalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/XDRemuxAppleAdapter/main.swift scripts/check_apple_adapter_handshake.sh
          git diff --cached --check
          git commit -m "test(apple): guard persistent adapter open-pipe behavior"
          git push origin HEAD:codex/persistent-apple-helper
