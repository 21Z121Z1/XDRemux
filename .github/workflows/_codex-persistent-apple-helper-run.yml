name: Codex persistent Apple helper finalizer

on:
  push:
    branches: [codex/persistent-apple-helper]

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/persistent-apple-helper
          fetch-depth: 0

      - name: Finalize reviewed source and permanent regression
        shell: bash
        run: |
          python3 -c "import base64; open('/tmp/finalize.py','wb').write(base64.b64decode(''))"
          python3 /tmp/finalize.py
          git diff --check

      - name: Install portable HEVC provider
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Verify permanent handshake and affected runtime
        shell: bash
        run: |
          bash scripts/check_apple_adapter_handshake.sh
          python3 -m unittest Tests.test_performance_design Tests.test_performance_budget
          cargo test --locked -p xdremux-runtime --all-targets --release

      - name: Commit reviewed finalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "prototype already finalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/XDRemuxAppleAdapter/main.swift scripts/check_apple_adapter_handshake.sh
          git diff --cached --check
          git commit -m "test(apple): guard persistent adapter open-pipe behavior"
          git push origin HEAD:codex/persistent-apple-helper
