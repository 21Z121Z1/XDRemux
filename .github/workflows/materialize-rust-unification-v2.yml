name: Materialize Rust unification v2

on:
  push:
    branches:
      - feat/rust-cli-unification
    paths:
      - ".github/workflows/materialize-rust-unification-v2.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
          fetch-depth: 0
      - name: Install libheif HEVC provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libheif-plugin-x265 libheif-plugin-libde265
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply verified source transformation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/materialize-rust-unification-fixes.yml").read_text()
          section = workflow.index("      - name: Materialize source fixes")
          start = workflow.index("        run: |\n", section) + len("        run: |\n")
          end = workflow.index("      - name: Verify patched source before commit", start)
          lines = []
          for line in workflow[start:end].splitlines():
              if line.startswith("          "):
                  lines.append(line[10:])
              elif not line.strip():
                  lines.append("")
              else:
                  raise SystemExit(f"unexpected materializer indentation: {line!r}")
          Path("/tmp/materialize-base.sh").write_text("\n".join(lines) + "\n")
          PY
          bash /tmp/materialize-base.sh

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/xdremux-heif/src/native.rs")
          text = path.read_text()

          anchor = '''#[derive(Debug, Clone, Copy)]
          struct AppendedIdatLayout {'''
          graph_type = '''#[derive(Debug, Clone, Copy)]
          struct AssemblyGraph<'a> {
              ids: AssemblyItemIds<'a>,
              removed: &'a BTreeSet<u32>,
          }

          #[derive(Debug, Clone, Copy)]
          struct AppendedIdatLayout {'''
          if anchor not in text:
              raise SystemExit("AppendedIdatLayout anchor not found")
          text = text.replace(anchor, graph_type, 1)

          late_ids_start = text.index("    let ids = AssemblyItemIds {", text.index("    let iloc_version ="))
          late_ids_end = text.index("    let idat_layout =", late_ids_start)
          text = text[:late_ids_start] + text[late_ids_end:]

          ids_anchor = "    let maximum_item_id = xmp_id;\n"
          ids_block = '''    let maximum_item_id = xmp_id;
              let ids = AssemblyItemIds {
                  tile_ids: &tile_ids,
                  gain_id,
                  tmap_id,
                  xmp_id,
              };
              let graph = AssemblyGraph {
                  ids,
                  removed: &removed_graph_ids,
              };
          '''
          if ids_anchor not in text:
              raise SystemExit("maximum item id anchor not found")
          text = text.replace(ids_anchor, ids_block, 1)

          start = text.index("fn build_iprp(")
          end = text.index("\nfn build_iinf(", start)
          block = text[start:end]
          sig_end = block.index(") -> Result<Vec<u8>> {") + len(") -> Result<Vec<u8>> {")
          body = block[sig_end:]
          body = re.sub(r'\btile_ids\b', 'graph.ids.tile_ids', body)
          body = re.sub(r'\bgain_id\b', 'graph.ids.gain_id', body)
          body = re.sub(r'\btmap_id\b', 'graph.ids.tmap_id', body)
          body = re.sub(r'\bremoved\b', 'graph.removed', body)
          new_block = '''fn build_iprp(
              source: &[u8],
              iprp_header: &BoxHeader,
              meta: &ParsedMeta,
              gain: &DirectHevcGainMap<'_>,
              graph: AssemblyGraph<'_>,
          ) -> Result<Vec<u8>> {''' + body
          text = text[:start] + new_block + text[end:]

          call_start = text.index("    let iprp = build_iprp(")
          call_end = text.index("    let iref =", call_start)
          text = (
              text[:call_start]
              + "    let iprp = build_iprp(source, iprp_header, &meta, gain, graph)?;\n"
              + text[call_end:]
          )

          start = text.index("fn build_final_locations(")
          end = text.index("\n#[allow(clippy::too_many_arguments)]\nfn build_meta(", start)
          block = text[start:end]
          sig_end = block.index(") -> Result<Vec<IlocEntry>> {") + len(") -> Result<Vec<IlocEntry>> {")
          body = block[sig_end:]
          body = re.sub(r'\bids\b', 'graph.ids', body)
          body = re.sub(r'\bremoved\b', 'graph.removed', body)
          new_block = '''fn build_final_locations(
              source: &[u8],
              meta: &ParsedMeta,
              mdat: &BoxHeader,
              relocation: MdatRelocation,
              graph: AssemblyGraph<'_>,
              layout: AppendedIdatLayout,
              gain: &DirectHevcGainMap<'_>,
          ) -> Result<Vec<IlocEntry>> {''' + body
          text = text[:start] + new_block + text[end:]

          call_start = text.index("    let final_locations = build_final_locations(")
          call_end = text.index("    let final_iloc =", call_start)
          call = '''    let final_locations = build_final_locations(
              source,
              &meta,
              mdat,
              MdatRelocation {
                  new_data_start: new_mdat_data_start_u64,
                  original_payload_len: original_mdat_payload.len(),
              },
              graph,
              idat_layout,
              gain,
          )?;
          '''
          text = text[:call_start] + call + text[call_end:]
          path.write_text(text)
          PY

          rm -f .github/workflows/materialize-rust-unification-v2.yml
          cargo fmt --all
      - name: Verify before commit
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo fmt --all -- --check
          cargo clippy --locked -p xdremux-heif -p xdremux-codec --all-targets -- -D warnings
          cargo test --locked -p xdremux-heif
          cargo test --locked -p xdremux-codec
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(rust-heif): canonicalize existing gain-map graphs"
          git push origin HEAD:feat/rust-cli-unification
