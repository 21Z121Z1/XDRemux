name: Verify Rust minimal product CLI

on:
  workflow_dispatch:
  push:
    branches: [feat/rust-cli-unification]
    paths:
      - .github/workflows/implement-rust-simple-product-cli.yml
      - scripts/materialize_rust_simple_product_intent.py
      - scripts/materialize_rust_motion_photo_product_guard.py
      - scripts/materialize_rust_simple_cli_intent.py
      - crates/xdremux-engine/src/lib.rs
      - crates/xdremux-runtime/src/lib.rs
      - crates/xdremux-runtime/src/batch.rs
      - crates/xdremux-cli/src/lib.rs

permissions:
  contents: write

concurrency:
  group: rust-cli-unification-writer
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
          fetch-depth: 0
      - name: Install portable HEVC provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libheif-plugin-x265 libheif-plugin-libde265
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize product intent surface
        run: |
          python3 scripts/materialize_rust_simple_product_intent.py
          python3 scripts/materialize_rust_simple_product_intent.py
          python3 scripts/materialize_rust_motion_photo_product_guard.py
          python3 scripts/materialize_rust_motion_photo_product_guard.py
          python3 scripts/materialize_rust_simple_cli_intent.py
          python3 scripts/materialize_rust_simple_cli_intent.py
          cargo fmt -p xdremux-engine -p xdremux-runtime -p xdremux-cli
          git diff --check
      - name: Enforce minimal conversion surface
        shell: bash
        run: |
          set -euo pipefail
          for command in convert batch; do
            cargo run --locked -q -p xdremux-cli -- "$command" --help > "/tmp/$command-help.txt"
            grep -F -- '--oppo-compatible' "/tmp/$command-help.txt" >/dev/null
            for forbidden in --family --oppo-compat --oppo-camera-tail --input-processing --tmap-format; do
              if grep -F -- "$forbidden" "/tmp/$command-help.txt"; then
                echo "internal policy option $forbidden leaked into $command" >&2
                exit 1
              fi
            done
          done
      - name: Lint unified product path
        run: |
          cargo clippy --locked -p xdremux-engine -p xdremux-runtime -p xdremux-cli --all-targets -- -D warnings
      - name: Test product intent contracts
        run: |
          cargo test --locked -p xdremux-engine oppo_gallery_intent_owns_internal_compatibility_policy -- --nocapture
          cargo test --locked -p xdremux-cli conversion_help_exposes_intent_not_internal_policy -- --nocapture
          cargo test --locked -p xdremux-cli convert_accepts_oppo_gallery_product_intent -- --nocapture
          cargo test --locked -p xdremux-cli batch_accepts_oppo_gallery_product_intent -- --nocapture
          cargo test --locked -p xdremux-runtime --lib -- --nocapture
      - name: Verify real CLI OPPO conversion
        shell: bash
        run: |
          set -euo pipefail
          input='fixtures/proxdr/oppo/find-x6-pro/lhdr-v1-01.heic'
          output="$RUNNER_TEMP/oppo-compatible.heic"
          cargo run --locked -q -p xdremux-cli -- convert --input "$input" --output "$output" --oppo-compatible
          test -s "$output"
          cargo run --locked -q -p xdremux-cli -- validate "$output" >/tmp/oppo-validation.txt
      - name: Refuse OPPO intent for Motion Photo
        shell: bash
        run: |
          set -euo pipefail
          input='fixtures/motion-photo/samsung/heif-ultrahdr-01.heic'
          output="$RUNNER_TEMP/should-not-exist.heic"
          if cargo run --locked -q -p xdremux-cli -- convert --input "$input" --output "$output" --oppo-compatible 2>"$RUNNER_TEMP/motion-error.txt"; then
            echo 'Motion Photo unexpectedly accepted OPPO-compatible intent' >&2
            exit 1
          fi
          grep -F 'cannot be combined with Motion Photo conversion' "$RUNNER_TEMP/motion-error.txt" >/dev/null
          test ! -e "$output"
          test ! -e "${output%.heic}.mov"
      - name: Commit verified product surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/xdremux-engine crates/xdremux-runtime crates/xdremux-cli
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'feat(rust): expose OPPO Gallery product intent'
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo 'Unexpected dirty working tree after product materialization:' >&2
            git status --short >&2
            exit 1
          fi
          git pull --rebase origin feat/rust-cli-unification
          git push origin HEAD:feat/rust-cli-unification

  verify-macos:
    needs: verify-and-materialize
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
      - name: Install portable HEVC provider
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Verify canonical product CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p xdremux-cli --lib -- --nocapture
          output="$RUNNER_TEMP/oppo-compatible.heic"
          cargo run --locked -q -p xdremux-cli -- convert \
            --input fixtures/proxdr/oppo/find-x6-pro/lhdr-v1-01.heic \
            --output "$output" \
            --oppo-compatible
          test -s "$output"
