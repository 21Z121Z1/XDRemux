name: Rust Texture Style integration harness

on:
  push:
    branches: [feat/rust-texture-style-support]
    paths: [.github/workflows/implement-rust-texture-style.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-texture-style-support
          fetch-depth: 0

      - name: Install dependencies
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply product integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/xdremux-heif/src/texture_styles.rs")
          s = p.read_text()
          s = s.replace("value.as_bytes().chunks_exact(2)", "value.as_bytes().as_chunks::<2>().0")
          s = s.replace("const HDLR: FourCC = FourCC::new(*b\"hdlr\");\nconst DINF: FourCC = FourCC::new(*b\"dinf\");\nconst GRPL: FourCC = FourCC::new(*b\"grpl\");\n", "")
          old = '''    let canonical_order = [HDLR, DINF, ILOC, IINF, PITM, IPRP, IDAT, IREF, GRPL];
    let mut ordered = Vec::with_capacity(graph.meta_children.len());
    for kind in canonical_order {
        ordered.extend(graph.meta_children.iter().filter(|header| header.kind == kind));
    }
    ordered.extend(
        graph
            .meta_children
            .iter()
            .filter(|header| !canonical_order.contains(&header.kind)),
    );
    let mut saw_iref = false;
    for header in ordered {
'''
          new = '''    // H, the physical-device-positive carrier, preserves the source meta child
    // order. Do not introduce an extra canonicalization variable here.
    let mut saw_iref = false;
    for header in &graph.meta_children {
'''
          if old not in s:
              raise SystemExit("meta-order anchor changed")
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/research/apply_texture_style_product_patch.py
          cargo fmt --all
          git diff --check

      - name: Test Rust layers
        shell: bash
        run: |
          cargo test --locked -p xdremux-engine -p xdremux-heif
          cargo clippy --locked -p xdremux-engine -p xdremux-heif -p xdremux-runtime --all-targets -- -D warnings

      - name: Test real ProXDR product path
        shell: bash
        run: bash scripts/check_rust_style_consumer.sh

      - name: Review diff
        shell: bash
        run: |
          git status --short
          git diff --stat
          git diff --check

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-rust-texture-style.yml
          git rm scripts/research/apply_texture_style_product_patch.py
          git add crates/xdremux-engine/src/lib.rs crates/xdremux-engine/src/apple_photographic_styles.rs
          git add crates/xdremux-heif/src/lib.rs crates/xdremux-heif/src/texture_styles.rs
          git add crates/xdremux-runtime/src/apple_styles.rs scripts/check_rust_style_consumer.sh
          git diff --cached --check
          git commit -m "feat: enable Rust iOS 27 Texture Style carrier"
          git push origin HEAD:feat/rust-texture-style-support
