name: macOS 26 Rust Photographic Styles smoke

on:
  push:
    branches:
      - test/macos26-photographic-styles-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  photographic-styles-smoke:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Record runner environment
        shell: bash
        run: |
          mkdir -p artifacts/macos26-photographic-styles
          {
            sw_vers
            echo "arch=$(uname -m)"
            xcodebuild -version
            swift --version
          } | tee artifacts/macos26-photographic-styles/runner.txt

      - name: Install portable HEVC provider
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Run the Rust-driven Styles consumer gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check_rust_style_consumer.sh \
            2>&1 | tee artifacts/macos26-photographic-styles/rust-consumer.log

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## macOS 26 Rust Photographic Styles smoke"
            echo
            echo "The Rust CLI owns source analysis, Styles policy, graph assembly, validation, and publication."
            echo "The Swift process is used only for Apple Vision/ImageIO/VideoToolbox primitive observations."
            echo "Structural and ImageIO consumer facts do not claim visual equivalence or Photos device acceptance."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Styles evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos26-rust-photographic-styles
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/macos26-photographic-styles/
