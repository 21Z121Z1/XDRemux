name: macOS 26 Photographic Styles Smoke

on:
  push:
    branches:
      - test/macos26-photographic-styles-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  photographic-styles-smoke:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      XDREMUX_STYLE_RUNNER_FIXTURE: ${{ github.workspace }}/fixtures/IMG20260801190843_ColorOS_16.jpg
      XDREMUX_STYLE_RUNNER_OUTPUT: ${{ github.workspace }}/artifacts/macos26-photographic-styles
    steps:
      - uses: actions/checkout@v7

      - name: Record runner environment
        shell: bash
        run: |
          mkdir -p "$XDREMUX_STYLE_RUNNER_OUTPUT"
          {
            sw_vers
            echo "arch=$(uname -m)"
            xcodebuild -version
            swift --version
          } | tee "$XDREMUX_STYLE_RUNNER_OUTPUT/runner.txt"

      - name: Convert Motion Photo with Photographic Styles and validate
        shell: bash
        run: |
          set -o pipefail
          swift test --filter PhotographicStylesRunnerSmokeTests \
            2>&1 | tee "$XDREMUX_STYLE_RUNNER_OUTPUT/swift-test.log"

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## macOS 26 Live Photo + Photographic Styles smoke"
            echo
            echo "Fixture: \`IMG20260801190843_ColorOS_16.jpg\`"
            echo "Path: ColorOS 16 Motion Photo -> Apple Live Photo HEIC+MOV -> Photographic Styles -> NeutrinoCore -> PhotoKit"
            echo
            if [[ -f "$XDREMUX_STYLE_RUNNER_OUTPUT/smoke-summary.json" ]]; then
              echo '```json'
              cat "$XDREMUX_STYLE_RUNNER_OUTPUT/smoke-summary.json"
              echo '```'
            else
              echo "No success summary was produced; inspect the uploaded test log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final outputs and receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos26-live-photo-photographic-styles
          if-no-files-found: warn
          retention-days: 1
          path: |
            artifacts/macos26-photographic-styles/coloros16-live-styles.heic
            artifacts/macos26-photographic-styles/coloros16-live-styles.mov
            artifacts/macos26-photographic-styles/failed-styles.heic
            artifacts/macos26-photographic-styles/validation.json
            artifacts/macos26-photographic-styles/smoke-summary.json
            artifacts/macos26-photographic-styles/runner.txt
            artifacts/macos26-photographic-styles/swift-test.log
