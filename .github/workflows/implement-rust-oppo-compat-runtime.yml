name: Verify Rust OPPO compatibility runtime

on:
  workflow_dispatch:
  push:
    branches: [feat/rust-cli-unification]
    paths:
      - .github/workflows/implement-rust-oppo-compat-runtime.yml
      - scripts/materialize_rust_oppo_compat_runtime.py
      - crates/xdremux-metadata/src/oppo.rs
      - crates/xdremux-metadata/src/oppo_heif.rs
      - crates/xdremux-metadata/src/lib.rs
      - crates/xdremux-runtime/src/oppo_compat.rs
      - crates/xdremux-runtime/tests/oppo_compat_fixture.rs

permissions:
  contents: write

concurrency:
  group: rust-cli-unification-writer
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
          fetch-depth: 0
      - name: Install portable HEVC provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libheif-plugin-x265 libheif-plugin-libde265
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize portable OPPO compatibility wiring
        run: |
          python3 scripts/materialize_rust_oppo_compat_runtime.py
          python3 scripts/materialize_rust_oppo_compat_runtime.py
          cargo generate-lockfile
          cargo fmt -p xdremux-metadata -p xdremux-runtime
          git diff --check
      - name: Lint portable OPPO compatibility stack
        run: |
          cargo clippy --locked -p xdremux-metadata -p xdremux-engine -p xdremux-runtime --all-targets -- -D warnings
      - name: Test OPPO metadata and real conversion contract
        run: |
          cargo test --locked -p xdremux-metadata oppo -- --nocapture
          cargo test --locked -p xdremux-runtime oppo_compat -- --nocapture
          cargo test --locked -p xdremux-runtime --test oppo_compat_fixture -- --nocapture
      - name: Commit verified OPPO compatibility wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/xdremux-metadata crates/xdremux-runtime/src/lib.rs crates/xdremux-runtime/src/oppo_compat.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated or formatting changes to commit.'
          else
            git commit -m 'feat(rust): execute hybrid OPPO compatibility'
            git pull --rebase origin feat/rust-cli-unification
            git push origin HEAD:feat/rust-cli-unification
          fi

  verify-macos:
    needs: verify-and-materialize
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
      - name: Install portable HEVC provider
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Verify real OPPO compatibility conversion
        run: cargo test --locked -p xdremux-runtime --test oppo_compat_fixture -- --nocapture
