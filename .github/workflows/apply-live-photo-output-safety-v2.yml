name: Apply Live Photo output safety patch v2

on:
  push:
    branches:
      - fix/live-photo-output-safety

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/live-photo-output-safety
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: python3 scripts/_apply_live_photo_output_safety.py

      - name: Commit patched tree
        shell: bash
        run: |
          git rm .github/workflows/_apply-live-photo-output-safety.yml
          git rm .github/workflows/apply-live-photo-output-safety-v2.yml
          git rm scripts/_apply_live_photo_output_safety.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: protect Live Photo single-file outputs"
          git push origin HEAD:fix/live-photo-output-safety
