name: Verify Rust batch resume slice

on:
  workflow_dispatch:
  push:
    branches: [feat/rust-cli-unification]
    paths:
      - .github/workflows/implement-rust-batch-resume.yml
      - scripts/materialize_rust_batch_resume.py
      - crates/xdremux-cli/tests/batch_resume.rs

permissions:
  contents: write

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
          fetch-depth: 0
      - name: Install portable HEVC provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libheif-plugin-x265 libheif-plugin-libde265
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize durable batch resume wiring
        run: |
          python3 scripts/materialize_rust_batch_resume.py
          python3 scripts/materialize_rust_batch_resume.py
          cargo generate-lockfile
          cargo fmt -p xdremux-runtime -p xdremux-cli
          git diff --check
      - name: Lint batch resume stack
        run: |
          cargo clippy --locked \
            -p xdremux-motion-photo -p xdremux-runtime -p xdremux-cli \
            --all-targets -- -D warnings
      - name: Test checkpoint and batch resume stack
        run: |
          cargo test --locked -p xdremux-runtime batch_checkpoint -- --nocapture
          cargo test --locked -p xdremux-runtime batch -- --nocapture
          cargo test --locked -p xdremux-cli --test batch -- --nocapture
          cargo test --locked -p xdremux-cli --test batch_resume -- --nocapture
          cargo test --locked -p xdremux-cli --lib -- --nocapture
      - name: Commit verified materialized state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/xdremux-runtime crates/xdremux-cli
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated or formatting changes to commit.'
          else
            git commit -m 'feat(rust): wire durable batch resume provenance'
            git push origin HEAD:feat/rust-cli-unification
          fi
