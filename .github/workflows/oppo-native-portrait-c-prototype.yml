      - name: Targeted Rust tests
        shell: bash
        run: |
          cargo test --locked -p xdremux-engine apple::tests::oppo_native_portrait_contract_accepts_only_producer_backed_resources
          cargo test --locked -p xdremux-runtime oppo_portrait::tests::oppo_native_payload_set_contains_only_c_resources
          cargo test --locked -p xdremux-cli convert_accepts_oppo_native_portrait_profile
          cargo test --locked -p xdremux-cli convert_rejects_combining_complete_and_oppo_native_portrait
          cargo test --locked -p xdremux-runtime --all-targets --release

      - name: Build Apple adapter and canonical CLI
        shell: bash
        run: |
          swift build -c release --product xdremux-apple-adapter
          cargo build --locked -p xdremux-cli --release

      - name: Execute real OPPO-native Portrait C conversion
        shell: bash
        run: |
          ADAPTER_BIN="$(swift build -c release --show-bin-path)/xdremux-apple-adapter"
          OUTPUT="$RUNNER_TEMP/oppo-native-c.heic"
          export XDREMUX_APPLE_ADAPTER="$ADAPTER_BIN"
          target/release/xdremux convert \
            --input fixtures/proxdr/oppo/find-x9-ultra/uhdr-portrait-01.heic \
            --output "$OUTPUT" \
            --apple-portrait-oppo
          test -s "$OUTPUT"
          python3 - "$ADAPTER_BIN" "$OUTPUT" <<'PY'
          import json
          import subprocess
          import sys

          adapter, output = sys.argv[1:]
          request = {
              "schema_version": 2,
              "operation": "imageio-auxiliary-facts",
              "input_path": output,
          }
          completed = subprocess.run(
              [adapter],
              input=(json.dumps(request) + "\n").encode(),
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              check=True,
          )
          response = json.loads(completed.stdout)
          facts = response["auxiliary"]
          required_true = [
              "iso_gain_map",
              "disparity",
              "portrait_effects_matte",
              "hair_matte",
              "focus_metadata",
          ]
          required_false = ["skin_matte", "teeth_matte", "glasses_matte"]
          for key in required_true:
              assert facts[key] is True, (key, facts)
          for key in required_false:
              assert facts[key] is False, (key, facts)
          print(json.dumps(facts, sort_keys=True))
          PY

