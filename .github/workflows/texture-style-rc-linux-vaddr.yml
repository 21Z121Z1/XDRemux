name: TextureStyle RC Linux vaddr disassembly

on:
  push:
    branches: [research/photographic-styles-3-texture-probe]
    paths: [.github/workflows/texture-style-rc-linux-vaddr.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disass:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Install ipsw and apfs-fuse
        env:
          GH_TOKEN: ${{ github.token }}
          APFS_FUSE_SHA: 66b86bd525e8cb90f9012543be89b1f092b75cf3
        shell: bash
        run: |
          set -euo pipefail
          url="$(gh api repos/blacktop/ipsw/releases/latest --jq '.assets[] | select(.name | test("^ipsw_.*linux_x86_64\\.deb$")) | .browser_download_url' | head -n1)"
          curl -fsSL -o /tmp/ipsw.deb "$url"
          sudo dpkg -i /tmp/ipsw.deb
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fuse3 libfuse3-dev libbz2-dev libattr1-dev zlib1g-dev cmake g++ git
          src="$RUNNER_TEMP/apfs-fuse"
          git clone --quiet https://github.com/sgan81/apfs-fuse.git "$src"
          git -C "$src" checkout --quiet "$APFS_FUSE_SHA"
          git -C "$src" submodule update --init --recursive --quiet
          cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build "$src/build" --parallel "$(nproc)" >/dev/null
          sudo install -m 0755 "$src/build/apfs-fuse" /usr/local/bin/apfs-fuse
          mkdir -p artifacts/cache artifacts/macho artifacts/out

      - name: Extract exact iOS 27 RC 24A435 cache
        shell: bash
        run: |
          set -euo pipefail
          URL='https://updates.cdn-apple.com/2026FallFCS/452c0b80-3d97-455f-a941-ea7e4dd2f964/iPhone18,1_27.0_24A435_Restore.ipsw'
          ipsw extract --remote --dyld --dyld-arch arm64e -o "$PWD/artifacts/cache" "$URL" > artifacts/out/extract.log 2>&1
          CACHE="$(find artifacts/cache -type f -name dyld_shared_cache_arm64e -print -quit)"
          test -s "$CACHE"
          echo "CACHE=$CACHE" >> "$GITHUB_ENV"

      - name: Read the unresolved PhotoImaging outer-key slot directly
        shell: bash
        run: |
          set -uo pipefail
          SLOT=0x1e010e930
          timeout 90s ipsw dyld dump "$CACHE" "$SLOT" --addr --count 8 > artifacts/out/outer-slot-addresses.txt 2>&1 || true
          timeout 90s ipsw dyld dump "$CACHE" "$SLOT" --bytes --size 64 > artifacts/out/outer-slot-bytes.txt 2>&1 || true
          timeout 90s ipsw dyld a2o "$CACHE" "$SLOT" --hex > artifacts/out/outer-slot-a2o.txt 2>&1 || true
          cat artifacts/out/outer-slot-addresses.txt artifacts/out/outer-slot-a2o.txt || true

      - name: Extract only the target Mach-O images
        shell: bash
        run: |
          set -uo pipefail
          timeout 300s ipsw dyld extract "$CACHE" PhotoImaging --objc --stubs --force -o artifacts/macho/photo > artifacts/out/extract-photoimaging.log 2>&1 || true
          timeout 300s ipsw dyld extract "$CACHE" CMImaging --objc --stubs --force -o artifacts/macho/cmi > artifacts/out/extract-cmimaging.log 2>&1 || true
          timeout 300s ipsw dyld extract "$CACHE" ImageIO --objc --stubs --force -o artifacts/macho/imageio > artifacts/out/extract-imageio.log 2>&1 || true
          find artifacts/macho -type f -maxdepth 8 -print > artifacts/out/extracted-files.txt
          cat artifacts/out/extracted-files.txt

      - name: Disassemble the exact CMImaging SmartStyle MakerNote mapping IMPs
        shell: bash
        run: |
          set -uo pipefail
          CMI="$(find artifacts/macho/cmi -type f -name CMImaging -print -quit)"
          if [ -z "$CMI" ]; then
            echo 'CMImaging extraction did not produce a Mach-O' | tee artifacts/out/cmimaging-missing.txt
            exit 0
          fi
          # Addresses come from the 24A435 CMImaging class dump in the supplied evidence pack.
          declare -A FNS=(
            [maker-tag-cast]=0x1d42e8398
            [maker-tag-tuning]=0x1d42f4260
            [cast-from-maker-tag]=0x1d446bff8
            [tuning-from-maker-tag]=0x1d4329734
            [default-texture-for-cast]=0x1d43287c8
          )
          for name in "${!FNS[@]}"; do
            timeout 90s ipsw macho disass "$CMI" --vaddr "${FNS[$name]}" --count 180 --quiet --force \
              > "artifacts/out/cm-${name}.asm" 2>&1 || true
          done
          grep -n -E -C 28 'cmp|subs|mov[zk]?|#0x|0x[0-9a-f]+|SmartStyle|TextureStyle|MakerNote' artifacts/out/cm-*.asm \
            > artifacts/out/cmimaging-focused.txt || true
          sed -n '1,1800p' artifacts/out/cmimaging-focused.txt || true

      - name: Re-run the known PhotoImaging reader on the extracted image
        shell: bash
        run: |
          set -uo pipefail
          PHOTO="$(find artifacts/macho/photo -type f -name PhotoImaging -print -quit)"
          if [ -z "$PHOTO" ]; then
            echo 'PhotoImaging extraction did not produce a Mach-O' | tee artifacts/out/photoimaging-missing.txt
            exit 0
          fi
          timeout 90s ipsw macho disass "$PHOTO" --vaddr 0x1c20de7d8 --count 220 --quiet --force \
            > artifacts/out/photo-settings-reader.asm 2>&1 || true
          timeout 90s ipsw macho disass "$PHOTO" --vaddr 0x1c20dcea8 --count 140 --quiet --force \
            > artifacts/out/photo-preset-reader.asm 2>&1 || true
          grep -n -E -C 24 '0x1e010e930|#0x930|TextureStyle|SmartStyle|MakerNote|objectForKey|objc_msgSend' \
            artifacts/out/photo-*.asm > artifacts/out/photoimaging-focused.txt || true
          sed -n '1,1000p' artifacts/out/photoimaging-focused.txt || true

      - name: Check whether ImageIO itself knows the Texture Style MakerNote names
        shell: bash
        run: |
          set -uo pipefail
          IMAGEIO="$(find artifacts/macho/imageio -type f -name ImageIO -print -quit)"
          if [ -z "$IMAGEIO" ]; then
            echo 'ImageIO extraction did not produce a Mach-O' | tee artifacts/out/imageio-missing.txt
            exit 0
          fi
          strings -a "$IMAGEIO" | grep -n -E -C 20 'TextureStyle|SmartStyle|MakerApple|MakerNote|AppleMaker' \
            > artifacts/out/imageio-style-strings.txt || true
          sed -n '1,1200p' artifacts/out/imageio-style-strings.txt || true

      - name: Build compact evidence summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          out = Path('artifacts/out')
          names = [
              'outer-slot-addresses.txt', 'outer-slot-a2o.txt',
              'cmimaging-focused.txt', 'photoimaging-focused.txt',
              'imageio-style-strings.txt', 'extracted-files.txt',
          ]
          rows = []
          for name in names:
              p = out / name
              if not p.exists():
                  continue
              rows.append(f'===== {name} =====')
              text = p.read_text(errors='replace')
              rows.append(text[:120000])
          (out / 'evidence-summary.txt').write_text('\n'.join(rows))
          PY
          sed -n '1,2600p' artifacts/out/evidence-summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: texture-style-rc-linux-vaddr-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/out/

      - name: Remove large cache and extracted images
        if: always()
        run: rm -rf artifacts/cache artifacts/macho
