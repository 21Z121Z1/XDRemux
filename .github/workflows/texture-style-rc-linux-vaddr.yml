name: TextureStyle RC Linux vaddr disassembly

on:
  push:
    branches: [research/photographic-styles-3-texture-probe]
    paths: [.github/workflows/texture-style-rc-linux-vaddr.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disass:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install ipsw and apfs-fuse
        env:
          GH_TOKEN: ${{ github.token }}
          APFS_FUSE_SHA: 66b86bd525e8cb90f9012543be89b1f092b75cf3
        shell: bash
        run: |
          set -euo pipefail
          url="$(gh api repos/blacktop/ipsw/releases/latest --jq '.assets[] | select(.name | test("^ipsw_.*linux_x86_64\\.deb$")) | .browser_download_url' | head -n1)"
          curl -fsSL -o /tmp/ipsw.deb "$url"
          sudo dpkg -i /tmp/ipsw.deb
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fuse3 libfuse3-dev libbz2-dev libattr1-dev zlib1g-dev cmake g++ git
          src="$RUNNER_TEMP/apfs-fuse"
          git clone --quiet https://github.com/sgan81/apfs-fuse.git "$src"
          git -C "$src" checkout --quiet "$APFS_FUSE_SHA"
          git -C "$src" submodule update --init --recursive --quiet
          cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build "$src/build" --parallel "$(nproc)" >/dev/null
          sudo install -m 0755 "$src/build/apfs-fuse" /usr/local/bin/apfs-fuse
          mkdir -p artifacts/cache artifacts/out

      - name: Extract exact 24A435 cache
        shell: bash
        run: |
          set -euo pipefail
          URL='https://updates.cdn-apple.com/2026FallFCS/452c0b80-3d97-455f-a941-ea7e4dd2f964/iPhone18,1_27.0_24A435_Restore.ipsw'
          ipsw extract --remote --dyld --dyld-arch arm64e -o "$PWD/artifacts/cache" "$URL" > artifacts/out/extract.log 2>&1
          CACHE="$(find artifacts/cache -type f -name dyld_shared_cache_arm64e -print -quit)"
          test -s "$CACHE"
          echo "CACHE=$CACHE" >> "$GITHUB_ENV"

      - name: Disassemble reader directly by known 24A435 VA
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s ipsw dyld disass "$CACHE" --vaddr 0x1c20de7d8 --count 440 --force > artifacts/out/settings-vaddr.asm 2>&1
          timeout 120s ipsw dyld disass "$CACHE" --vaddr 0x1c20dcea8 --count 240 --force > artifacts/out/preset-vaddr.asm 2>&1
          grep -n -E -C 16 'TextureStyle|SmartStyle|MakerNote|objectForKey|objectForKeyedSubscript|doubleValue|integerValue|longLongValue|floatValue|NSNumber|NSString|CFString' \
            artifacts/out/settings-vaddr.asm artifacts/out/preset-vaddr.asm > artifacts/out/focused.txt || true
          sed -n '1,1800p' artifacts/out/focused.txt
          test -s artifacts/out/settings-vaddr.asm
          test -s artifacts/out/preset-vaddr.asm

      - name: Upload disassembly
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: texture-style-rc-linux-vaddr-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/out/

      - name: Remove cache
        if: always()
        run: rm -rf artifacts/cache
