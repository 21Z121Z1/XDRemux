name: TextureStyle RC Linux vaddr disassembly

on:
  push:
    branches: [research/photographic-styles-3-texture-probe]
    paths: [.github/workflows/texture-style-rc-linux-vaddr.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disass:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install ipsw and apfs-fuse
        env:
          GH_TOKEN: ${{ github.token }}
          APFS_FUSE_SHA: 66b86bd525e8cb90f9012543be89b1f092b75cf3
        shell: bash
        run: |
          set -euo pipefail
          url="$(gh api repos/blacktop/ipsw/releases/latest --jq '.assets[] | select(.name | test("^ipsw_.*linux_x86_64\\.deb$")) | .browser_download_url' | head -n1)"
          curl -fsSL -o /tmp/ipsw.deb "$url"
          sudo dpkg -i /tmp/ipsw.deb
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fuse3 libfuse3-dev libbz2-dev libattr1-dev zlib1g-dev cmake g++ git
          src="$RUNNER_TEMP/apfs-fuse"
          git clone --quiet https://github.com/sgan81/apfs-fuse.git "$src"
          git -C "$src" checkout --quiet "$APFS_FUSE_SHA"
          git -C "$src" submodule update --init --recursive --quiet
          cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build "$src/build" --parallel "$(nproc)" >/dev/null
          sudo install -m 0755 "$src/build/apfs-fuse" /usr/local/bin/apfs-fuse
          mkdir -p artifacts/cache artifacts/out

      - name: Extract exact 24A435 cache
        shell: bash
        run: |
          set -euo pipefail
          URL='https://updates.cdn-apple.com/2026FallFCS/452c0b80-3d97-455f-a941-ea7e4dd2f964/iPhone18,1_27.0_24A435_Restore.ipsw'
          ipsw extract --remote --dyld --dyld-arch arm64e -o "$PWD/artifacts/cache" "$URL" > artifacts/out/extract.log 2>&1
          CACHE="$(find artifacts/cache -type f -name dyld_shared_cache_arm64e -print -quit)"
          test -s "$CACHE"
          echo "CACHE=$CACHE" >> "$GITHUB_ENV"

      - name: Disassemble known Texture Style readers
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s ipsw dyld disass "$CACHE" --vaddr 0x1c20de7d8 --count 440 --force > artifacts/out/settings-vaddr.asm 2>&1
          timeout 120s ipsw dyld disass "$CACHE" --vaddr 0x1c20dcea8 --count 240 --force > artifacts/out/preset-vaddr.asm 2>&1
          grep -n -E -C 16 'TextureStyle|SmartStyle|MakerNote|objectForKey|objectForKeyedSubscript|doubleValue|integerValue|longLongValue|floatValue|NSNumber|NSString|CFString' \
            artifacts/out/settings-vaddr.asm artifacts/out/preset-vaddr.asm > artifacts/out/focused.txt || true
          test -s artifacts/out/settings-vaddr.asm
          test -s artifacts/out/preset-vaddr.asm

      - name: Resolve the outer MakerNote global slot
        shell: bash
        run: |
          set -uo pipefail
          SLOT=0x1e010e930
          {
            echo '== a2s =='
            timeout 120s ipsw dyld a2s "$CACHE" "$SLOT" || true
            echo
            echo '== a2f =='
            timeout 120s ipsw dyld a2f "$CACHE" "$SLOT" || true
            echo
            echo '== a2o =='
            timeout 120s ipsw dyld a2o "$CACHE" "$SLOT" --hex || true
          } > artifacts/out/outer-slot-resolution.txt 2>&1
          timeout 300s ipsw dyld xref "$CACHE" "$SLOT" --image PhotoImaging > artifacts/out/outer-slot-xrefs.txt 2>&1 || true
          timeout 300s ipsw dyld xref "$CACHE" "$SLOT" --all > artifacts/out/outer-slot-xrefs-all.txt 2>&1 || true

      - name: Dump PhotoImaging symbols, strings, ObjC metadata, and references
        shell: bash
        run: |
          set -uo pipefail
          timeout 300s ipsw dyld macho "$CACHE" PhotoImaging --symbols > artifacts/out/photoimaging-symbols.txt 2>&1 || true
          timeout 300s ipsw dyld macho "$CACHE" PhotoImaging --strings > artifacts/out/photoimaging-strings.txt 2>&1 || true
          timeout 420s ipsw dyld macho "$CACHE" PhotoImaging --objc > artifacts/out/photoimaging-objc.txt 2>&1 || true
          timeout 420s ipsw dyld macho "$CACHE" PhotoImaging --objc-refs > artifacts/out/photoimaging-objc-refs.txt 2>&1 || true
          grep -n -E -C 24 'TextureStyle|SmartStyle|MakerNote|style properties|TextureStylePreset|TextureStyleIntensity|TextureStyleGrain|1e010e930' \
            artifacts/out/photoimaging-*.txt > artifacts/out/photoimaging-focused.txt || true

      - name: Resolve Smart Style MakerNote accessors in CMImaging
        shell: bash
        run: |
          set -uo pipefail
          timeout 300s ipsw dyld macho "$CACHE" CMImaging --symbols > artifacts/out/cmimaging-symbols.txt 2>&1 || true
          timeout 420s ipsw dyld macho "$CACHE" CMImaging --objc > artifacts/out/cmimaging-objc.txt 2>&1 || true
          timeout 420s ipsw dyld macho "$CACHE" CMImaging --objc-refs > artifacts/out/cmimaging-objc-refs.txt 2>&1 || true
          timeout 240s ipsw dyld objc sel "$CACHE" --image CMImaging > artifacts/out/cmimaging-selectors.txt 2>&1 || true
          grep -n -E -C 40 'makerNoteTagForSmartStyle|SmartStyleCast|SmartStyleTuningType|makerNoteTagFor.*Style|TextureStyle|SmartStyle' \
            artifacts/out/cmimaging-*.txt > artifacts/out/cmimaging-focused.txt || true

      - name: Build evidence summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          out = Path('artifacts/out')
          needles = (
              'TextureStylePreset', 'TextureStyleIntensity', 'TextureStyleGrain',
              'makerNoteTagForSmartStyle', 'SmartStyleCast', 'SmartStyleTuningType',
              'Missing smart style properties', '0x1e010e930', '1e010e930',
          )
          rows = []
          for p in sorted(out.glob('*.txt')) + sorted(out.glob('*.asm')):
              try:
                  lines = p.read_text(errors='replace').splitlines()
              except Exception:
                  continue
              hits = [(i + 1, line) for i, line in enumerate(lines) if any(n in line for n in needles)]
              if hits:
                  rows.append(f'## {p.name}')
                  rows.extend(f'{lineno}: {line}' for lineno, line in hits[:250])
                  rows.append('')
          (out / 'evidence-summary.txt').write_text('\n'.join(rows) + '\n')
          PY
          sed -n '1,2200p' artifacts/out/evidence-summary.txt

      - name: Upload disassembly
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: texture-style-rc-linux-vaddr-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/out/

      - name: Remove cache
        if: always()
        run: rm -rf artifacts/cache