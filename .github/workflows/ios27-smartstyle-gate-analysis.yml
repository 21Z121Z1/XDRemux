name: iOS 27 Smart Style gate analysis

on:
  push:
    branches:
      - analysis/ios27-video-smartstyle-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reverse-camera-ui:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      IPSW_URL: https://updates.cdn-apple.com/2026FallFCS/0f4c05a9-05f9-472c-a2ec-d7046fe0872b/iPhone19,2_27.0_24A437_Restore.ipsw
    steps:
      - name: Prepare
        run: mkdir -p /tmp/report /tmp/ios27 /tmp/cameraui

      - name: Install ipsw
        run: |
          set -euxo pipefail
          brew tap blacktop/tap
          brew trust blacktop/tap
          brew install --formula blacktop/tap/ipsw
          ipsw version | tee /tmp/report/ipsw-version.txt

      - name: Extract dyld cache and CameraUI
        run: |
          set -euxo pipefail
          ipsw extract --remote --dyld --dyld-arch arm64e --output /tmp/ios27 "$IPSW_URL" 2>&1 | tee /tmp/report/extract.log
          DSC="$(find /tmp/ios27 -type f -name 'dyld_shared_cache_arm64e*' ! -name '*.symbols' ! -name '*.atlas' ! -name '*.dylddata' ! -name '*.dyldreadonly' ! -name '*.dyldlinkedit' | sort | head -1)"
          echo "$DSC" > /tmp/report/dsc-path.txt
          ipsw dyld extract "$DSC" /System/Library/PrivateFrameworks/CameraUI.framework/CameraUI --objc --output /tmp/cameraui
          test -f /tmp/cameraui/CameraUI
          nm -nm /tmp/cameraui/CameraUI > /tmp/report/nm.txt || true

      - name: Raw disassembly
        run: |
          set -euxo pipefail
          BIN=/tmp/cameraui/CameraUI
          # _desiredSmartStyleSupportForMode:devicePosition: is 0x60 bytes in this build.
          ipsw macho disass "$BIN" --vaddr 0x1bdd478fc --count 24 --quiet --force > /tmp/report/desired-smartstyle-raw.txt 2>&1
          # isPhotographicStylesPickerSupportedForMode:device:resolvedRAWMode: is 0x60 bytes.
          ipsw macho disass "$BIN" --vaddr 0x1bdf25490 --count 24 --quiet --force > /tmp/report/picker-raw.txt 2>&1
          # Comparative semantic-style gates.
          ipsw macho disass "$BIN" --vaddr 0x1bdf251a8 --count 42 --quiet --force > /tmp/report/semantic-support-raw.txt 2>&1
          ipsw macho disass "$BIN" --vaddr 0x1bdf25250 --count 42 --quiet --force > /tmp/report/desired-semantic-raw.txt 2>&1
          grep -n -C 5 -E '_desiredSmartStyleSupportForMode|isPhotographicStylesPickerSupportedForMode|semanticStyleSupportForMode|_desiredSemanticStyleSupportForMode' /tmp/report/nm.txt > /tmp/report/nm-context.txt || true
          cat /tmp/report/desired-smartstyle-raw.txt
          cat /tmp/report/picker-raw.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios27-smartstyle-gate-fast-report
          path: /tmp/report
          if-no-files-found: warn
          retention-days: 7
