name: Patch Styles Cleanup Once

on:
  push:
    branches:
      - test/macos26-photographic-styles-smoke
    paths:
      - .github/workflows/patch-styles-cleanup-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Make shared semantic cleanup idempotent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Sources/XDRemuxAppleFeatures/PhotographicStyles/ApplePhotographicStylesPipeline.swift")
          text = path.read_text()
          old = '''        defer { try? FileManager.default.removeItem(at: featureInputURL) }
          defer { try? FileManager.default.removeItem(at: sharedSemanticDirectory) }
          '''
          new = '''        defer { try? FileManager.default.removeItem(at: featureInputURL) }
          defer {
              if FileManager.default.fileExists(atPath: sharedSemanticDirectory.path) {
                  try? FileManager.default.removeItem(at: sharedSemanticDirectory)
              }
          }
          '''
          if old not in text:
              raise SystemExit("expected shared-semantics cleanup block was not found exactly once")
          if text.count(old) != 1:
              raise SystemExit(f"expected one cleanup block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git diff -- Sources/XDRemuxAppleFeatures/PhotographicStyles/ApplePhotographicStylesPipeline.swift

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/XDRemuxAppleFeatures/PhotographicStyles/ApplePhotographicStylesPipeline.swift
          git commit -m "fix: make styles semantic scratch cleanup idempotent"
          git push origin HEAD:test/macos26-photographic-styles-smoke
