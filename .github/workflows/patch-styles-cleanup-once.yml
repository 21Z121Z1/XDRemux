name: Patch Styles Cleanup Once

on:
  push:
    branches:
      - test/macos26-photographic-styles-smoke
    paths:
      - .github/workflows/patch-styles-cleanup-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Make shared semantic cleanup idempotent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("Sources/XDRemuxAppleFeatures/PhotographicStyles/ApplePhotographicStylesPipeline.swift")
          text = path.read_text()
          pattern = re.compile(
              r'(?m)^(\s*)defer \{ try\? FileManager\.default\.removeItem\(at: featureInputURL\) \}\n'
              r'^\1defer \{ try\? FileManager\.default\.removeItem\(at: sharedSemanticDirectory\) \}$'
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one shared-semantics cleanup block, found {len(matches)}")
          indent = matches[0].group(1)
          replacement = (
              f"{indent}defer {{ try? FileManager.default.removeItem(at: featureInputURL) }}\n"
              f"{indent}defer {{\n"
              f"{indent}    if FileManager.default.fileExists(atPath: sharedSemanticDirectory.path) {{\n"
              f"{indent}        try? FileManager.default.removeItem(at: sharedSemanticDirectory)\n"
              f"{indent}    }}\n"
              f"{indent}}}"
          )
          path.write_text(pattern.sub(replacement, text, count=1))
          PY

          git diff --check
          git diff -- Sources/XDRemuxAppleFeatures/PhotographicStyles/ApplePhotographicStylesPipeline.swift

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/XDRemuxAppleFeatures/PhotographicStyles/ApplePhotographicStylesPipeline.swift
          git commit -m "fix: make styles semantic scratch cleanup idempotent"
          git push origin HEAD:test/macos26-photographic-styles-smoke
