name: Patch PhotoKit Timeout Once

on:
  push:
    branches:
      - test/macos26-photographic-styles-smoke
    paths:
      - .github/workflows/patch-photokit-timeout-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Make PhotoKit validation timeout configurable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Sources/XDRemuxAppleFeatures/LivePhoto/AppleLivePhotoValidator.swift")
          text = path.read_text()
          marker = '''    private static func validateWithPhotoKit(imageURL: URL, videoURL: URL) throws {
          '''
          replacement = '''    private static var photoKitValidationTimeout: TimeInterval {
              guard let raw = ProcessInfo.processInfo.environment["XDREMUX_PHOTOKIT_VALIDATION_TIMEOUT_SECONDS"],
                    let seconds = Double(raw), seconds.isFinite, seconds >= 1 else {
                  return 30
              }
              return min(seconds, 300)
          }

          private static func validateWithPhotoKit(imageURL: URL, videoURL: URL) throws {
          '''
          if text.count(marker) != 1:
              raise SystemExit(f"expected one PhotoKit validator marker, found {text.count(marker)}")
          text = text.replace(marker, replacement, 1)
          old = '        guard semaphore.wait(timeout: .now() + 30) == .success else {\n            throw AppleLivePhotoError.pairValidationFailed("PhotoKit validation timed out")\n        }'
          new = '        let timeout = photoKitValidationTimeout\n        guard semaphore.wait(timeout: .now() + timeout) == .success else {\n            throw AppleLivePhotoError.pairValidationFailed(\n                "PhotoKit validation timed out after \\(Int(timeout)) seconds"\n            )\n        }'
          if text.count(old) != 1:
              raise SystemExit(f"expected one PhotoKit timeout guard, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- Sources/XDRemuxAppleFeatures/LivePhoto/AppleLivePhotoValidator.swift

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/XDRemuxAppleFeatures/LivePhoto/AppleLivePhotoValidator.swift
          git commit -m "test: make PhotoKit validation timeout configurable"
          git push origin HEAD:test/macos26-photographic-styles-smoke
