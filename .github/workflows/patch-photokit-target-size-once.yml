name: Patch PhotoKit Target Size Once

on:
  push:
    branches:
      - test/macos26-photographic-styles-smoke
    paths:
      - .github/workflows/patch-photokit-target-size-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bound PhotoKit validation render size
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("Sources/XDRemuxAppleFeatures/LivePhoto/AppleLivePhotoValidator.swift"); s=p.read_text(); assert s.count("targetSize: .zero,")==1; p.write_text(s.replace("targetSize: .zero,", "targetSize: CGSize(width: 512, height: 512),", 1))'
          git diff --check
          git diff -- Sources/XDRemuxAppleFeatures/LivePhoto/AppleLivePhotoValidator.swift

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/XDRemuxAppleFeatures/LivePhoto/AppleLivePhotoValidator.swift
          git commit -m "fix: bound PhotoKit Live Photo validation render size"
          git push origin HEAD:test/macos26-photographic-styles-smoke
