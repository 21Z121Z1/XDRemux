name: Rust HDR core

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-hdr/**"
      - "Sources/XDRemuxCore/HDR/**"
      - "Tests/XDRemuxCoreTests/HDRRustConformanceOracleTests.swift"
      - "Tests/fixtures/hdr_edr_cases.tsv"
      - "scripts/check_hdr_edr_conformance.sh"
      - ".github/workflows/rust-hdr-core.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-hdr/**"
      - "Sources/XDRemuxCore/HDR/**"
      - "Tests/XDRemuxCoreTests/HDRRustConformanceOracleTests.swift"
      - "Tests/fixtures/hdr_edr_cases.tsv"
      - "scripts/check_hdr_edr_conformance.sh"
      - ".github/workflows/rust-hdr-core.yml"

permissions:
  contents: read

jobs:
  hdr-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint xdremux-hdr
        run: cargo clippy --locked -p xdremux-hdr --all-targets -- -D warnings

      - name: Test xdremux-hdr
        run: cargo test --locked -p xdremux-hdr

      - name: Verify repository completion gate
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/xdremux-hdr-core-gate.json" <<'JSON'
          {
            "schema_version": 1,
            "scope": "Add isolated Rust HDR EDR semantics with precision-path regressions",
            "checks": [
              {
                "name": "rust-hdr-regressions",
                "kind": "regression",
                "command": ["cargo", "test", "--locked", "-p", "xdremux-hdr"],
                "timeout_seconds": 300
              },
              {
                "name": "rust-hdr-clippy",
                "kind": "static",
                "command": ["cargo", "clippy", "--locked", "-p", "xdremux-hdr", "--all-targets", "--", "-D", "warnings"],
                "timeout_seconds": 300
              }
            ]
          }
          JSON
          python3 scripts/agent_completion_gate.py run \
            --base origin/main \
            --plan "$RUNNER_TEMP/xdremux-hdr-core-gate.json"
          python3 scripts/agent_completion_gate.py verify \
            ".codex/verification-receipts/$(git rev-parse HEAD).json"

  hdr-conformance:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Pin Swift HDR branch contract
        run: swift test --filter HDRRustConformanceOracleTests/testEDRSharedVectorsCoverPrecisionAndBranchBoundaries

      - name: Compare Swift and Rust EDR semantics
        run: bash scripts/check_hdr_edr_conformance.sh

      - name: Verify cross-language completion gate
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/xdremux-hdr-conformance-gate.json" <<'JSON'
          {
            "schema_version": 1,
            "scope": "Prove Rust EDR resolution and knee computation match current Swift Float32/Float64 semantics",
            "checks": [
              {
                "name": "swift-hdr-branch-contract",
                "kind": "regression",
                "command": ["swift", "test", "--filter", "HDRRustConformanceOracleTests/testEDRSharedVectorsCoverPrecisionAndBranchBoundaries"],
                "timeout_seconds": 600
              },
              {
                "name": "swift-rust-edr-conformance",
                "kind": "integration",
                "command": ["bash", "scripts/check_hdr_edr_conformance.sh"],
                "timeout_seconds": 1200
              }
            ]
          }
          JSON
          python3 scripts/agent_completion_gate.py run \
            --base origin/main \
            --plan "$RUNNER_TEMP/xdremux-hdr-conformance-gate.json"
          python3 scripts/agent_completion_gate.py verify \
            ".codex/verification-receipts/$(git rev-parse HEAD).json"
