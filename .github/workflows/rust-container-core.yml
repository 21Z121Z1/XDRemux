name: Rust container core

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Package.swift"
      - "crates/xdremux-container/**"
      - "Sources/XDRemuxCore/HDR/**"
      - "Tests/XDRemuxCoreTests/ContainerRustConformanceOracleTests.swift"
      - "scripts/check_container_conformance.sh"
      - ".github/workflows/rust-container-core.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Package.swift"
      - "crates/xdremux-container/**"
      - "Sources/XDRemuxCore/HDR/**"
      - "Tests/XDRemuxCoreTests/ContainerRustConformanceOracleTests.swift"
      - "scripts/check_container_conformance.sh"
      - ".github/workflows/rust-container-core.yml"

permissions:
  contents: read

jobs:
  container-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint xdremux-container
        run: cargo clippy --locked -p xdremux-container --all-targets -- -D warnings
      - name: Test xdremux-container
        run: cargo test --locked -p xdremux-container

  container-conformance:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Compare Swift and Rust deterministic corpus
        run: bash scripts/check_container_conformance.sh
      - name: Verify cross-language completion gate
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/xdremux-container-conformance-gate.json" <<'JSON'
          {
            "schema_version": 1,
            "scope": "Port current LHDR/UHDR extraction, data-base calibration, metadata recovery, mask selection, and portrait block materialization into the isolated Rust container crate",
            "checks": [
              {
                "name": "rust-container-regressions",
                "kind": "regression",
                "command": ["cargo", "test", "--locked", "-p", "xdremux-container"],
                "timeout_seconds": 600
              },
              {
                "name": "swift-rust-container-corpus",
                "kind": "integration",
                "command": ["bash", "scripts/check_container_conformance.sh"],
                "timeout_seconds": 1800
              }
            ]
          }
          JSON
          python3 scripts/agent_completion_gate.py run \
            --base origin/main \
            --plan "$RUNNER_TEMP/xdremux-container-conformance-gate.json"
          python3 scripts/agent_completion_gate.py verify \
            ".codex/verification-receipts/$(git rev-parse HEAD).json"
