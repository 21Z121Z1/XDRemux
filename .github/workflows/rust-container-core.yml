name: Rust container core

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-container/**"
      - "Sources/XDRemuxCore/HDR/**"
      - "Sources/ContainerConformanceOracle/**"
      - "Tests/XDRemuxCoreTests/ContainerRustConformanceOracleTests.swift"
      - "scripts/check_container_conformance.sh"
      - ".github/workflows/rust-container-core.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-container/**"
      - "Sources/XDRemuxCore/HDR/**"
      - "Sources/ContainerConformanceOracle/**"
      - "Tests/XDRemuxCoreTests/ContainerRustConformanceOracleTests.swift"
      - "scripts/check_container_conformance.sh"
      - ".github/workflows/rust-container-core.yml"

permissions:
  contents: read

jobs:
  container-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format working copy for bootstrap diagnostics
        run: cargo fmt --all
      - name: Lint xdremux-container
        run: cargo clippy --locked -p xdremux-container --all-targets -- -D warnings
      - name: Test xdremux-container
        run: cargo test --locked -p xdremux-container
      - name: Print formatted extractor for bootstrap diagnostics
        if: always()
        shell: bash
        run: |
          echo '--- XDREMUX_FORMATTED_EXTRACTOR_BEGIN ---'
          cat crates/xdremux-container/src/extractor.rs
          echo '--- XDREMUX_FORMATTED_EXTRACTOR_END ---'
