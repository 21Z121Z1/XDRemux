name: Temporary Rust Clippy fix

on:
  push:
    branches:
      - feat/rust-xdremux-format
    paths:
      - ".github/workflows/rust-clippy-fix-temp.yml"

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-xdremux-format
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Refactor validator index tuple
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/xdremux-heif/src/validation.rs")
          text = path.read_text()
          old_signature = '''fn validate_meta_integrity<'a>(
              source: &[u8],
              meta: &'a ParsedMeta,
          ) -> Result<(
              HashMap<u32, &'a xdremux_format::isobmff::ItemInfo>,
              HashMap<u32, &'a IlocEntry>,
              HashMap<u32, &'a IpmaEntry>,
              HashMap<u32, &'a PropertyInfo>,
          )> {'''
          new_signature = '''struct MetaIndex<'a> {
              items: HashMap<u32, &'a xdremux_format::isobmff::ItemInfo>,
              locations: HashMap<u32, &'a IlocEntry>,
              ipma_by_item: HashMap<u32, &'a IpmaEntry>,
              properties: HashMap<u32, &'a PropertyInfo>,
          }

          fn validate_meta_integrity<'a>(source: &[u8], meta: &'a ParsedMeta) -> Result<MetaIndex<'a>> {'''
          old_return = '    Ok((items, locations, ipma_by_item, properties))\n}'
          new_return = '''    Ok(MetaIndex {
              items,
              locations,
              ipma_by_item,
              properties,
          })
          }'''
          old_call = '    let (items, locations, ipma_by_item, properties) = validate_meta_integrity(source, &meta)?;'
          new_call = '''    let MetaIndex {
              items,
              locations,
              ipma_by_item,
              properties,
          } = validate_meta_integrity(source, &meta)?;'''
          for label, old in [("signature", old_signature), ("return", old_return), ("call", old_call)]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one {label} match, found {count}")
          text = text.replace(old_signature, new_signature)
          text = text.replace(old_return, new_return)
          text = text.replace(old_call, new_call)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all --check
      - name: Verify Clippy
        run: cargo clippy --locked -p xdremux-heif --all-targets -- -D warnings
      - name: Verify Rust regressions
        run: cargo test --locked -p xdremux-heif
      - name: Commit verified refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/xdremux-heif/src/validation.rs
          git commit -m "refactor(rust): name HEIF validator indices"
          git push origin HEAD:feat/rust-xdremux-format
