name: Codex persistent Apple helper prototype

on:
  push:
    branches: [codex/persistent-apple-helper]

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/persistent-apple-helper
          fetch-depth: 0

      - name: Install portable HEVC provider
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply persistent transport implementation
        shell: bash
        run: |
          python3 - <<'PY'
