name: PS3 Texture V12 compound original results r4d
on:
  workflow_dispatch:
  push:
    branches: [research/photographic-styles-3-texture-v12-spi-matrix]
    paths: [.github/workflows/ps3-texture-v12-compound-original-results-r4d.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1}
      - shell: bash
        run: |
          set -euo pipefail; mkdir -p artifacts/r4d
          git fetch --no-tags --depth=1 origin f89eea8c1714eb5d1e3da1ff8ba83e61655181d5
          git show f89eea8c1714eb5d1e3da1ff8ba83e61655181d5:fixtures/proxdr/oppo/find-x9-ultra/uhdr-portrait-02.heic > "$RUNNER_TEMP/p.heic"
          cat > "$RUNNER_TEMP/p.m" <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <Vision/Vision.h>
          #import <ImageIO/ImageIO.h>
          #import <CoreVideo/CoreVideo.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <objc/message.h>
          static NSDictionary*desc(id x){NSMutableDictionary*d=[@{@"class":NSStringFromClass([x class])}mutableCopy];SEL fs=NSSelectorFromString(@"featureName");if([x respondsToSelector:fs]){id(*f)(id,SEL)=(void*)objc_msgSend;id v=f(x,fs);if(v)d[@"featureName"]=[v description];}SEL ps=NSSelectorFromString(@"pixelBuffer");if([x respondsToSelector:ps]){CVPixelBufferRef(*f)(id,SEL)=(void*)objc_msgSend;CVPixelBufferRef p=f(x,ps);if(p){d[@"width"]=@(CVPixelBufferGetWidth(p));d[@"height"]=@(CVPixelBufferGetHeight(p));d[@"pixelFormat"]=@(CVPixelBufferGetPixelFormatType(p));}}return d;}
          int main(int ac,const char**av){@autoreleasepool{if(ac!=2)return 64;NSArray*names=@[@"VNGenerateHumanAttributesSegmentationRequest",@"VNGenerateGlassesSegmentationRequest",@"VNGenerateSkySegmentationRequest",@"VNGeneratePersonSegmentationRequest"];NSMutableArray*orig=[NSMutableArray array];for(NSString*n in names){Class c=NSClassFromString(n);[orig addObject:[[c alloc]init]];}Class cc=NSClassFromString(@"VNGenerateSemanticSegmentationCompoundRequest");id(*mk)(id,SEL,id)=(void*)objc_msgSend;id compound=mk([cc alloc],NSSelectorFromString(@"initWithOriginalRequests:"),orig);NSURL*u=[NSURL fileURLWithPath:[NSString stringWithUTF8String:av[1]]];CGImageSourceRef s=CGImageSourceCreateWithURL((__bridge CFURLRef)u,NULL);CGImageRef im=CGImageSourceCreateImageAtIndex(s,0,NULL);NSError*e=nil;VNImageRequestHandler*h=[[VNImageRequestHandler alloc]initWithCGImage:im options:@{}];BOOL ok=[h performRequests:@[compound] error:&e];NSMutableArray*rows=[NSMutableArray array];for(NSUInteger i=0;i<orig.count;i++){id q=orig[i];NSArray*z=[q valueForKey:@"results"]?:@[];NSMutableArray*r=[NSMutableArray array];for(id x in z)[r addObject:desc(x)];[rows addObject:@{@"request":names[i],@"resultCount":@(z.count),@"results":r}];}NSDictionary*out=@{@"ok":@(ok),@"error":e?e.description:[NSNull null],@"compoundResultCount":@([[compound valueForKey:@"results"] count]),@"originalResults":rows};NSData*j=[NSJSONSerialization dataWithJSONObject:out options:NSJSONWritingPrettyPrinted|NSJSONWritingSortedKeys error:nil];fwrite(j.bytes,1,j.length,stdout);fputc('\n',stdout);CGImageRelease(im);CFRelease(s);}}
          OBJC
          xcrun clang -fobjc-arc -framework Foundation -framework Vision -framework ImageIO -framework CoreVideo -framework CoreGraphics "$RUNNER_TEMP/p.m" -o "$RUNNER_TEMP/p"
          "$RUNNER_TEMP/p" "$RUNNER_TEMP/p.heic" | tee artifacts/r4d/results.json
      - uses: actions/upload-artifact@v7
        with:
          name: ps3-texture-v12-compound-original-results-r4d-${{ github.sha }}
          retention-days: 14
          path: artifacts/r4d/
