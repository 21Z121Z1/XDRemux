name: Photographic Styles 3 Texture Probe (manual archive)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-note:
    runs-on: ubuntu-latest
    steps:
      - name: Explain focused replacements
        shell: bash
        run: |
          cat <<'EOF'
          The original broad PS3 probe is retained in git history and its Actions artifacts.
          Push-time research is now split into focused fail-closed workflows:
          - PS3 Portrait Native macOS 26
          - PS3 Portrait Native Xcode 27
          - PS3 Portrait Materialize Parser-Valid Baseline
          - PS3 PhotosFormats Xcode 27 Gate
          - TextureStyle Xcode 27 Constants
          This prevents long generic private-framework probes from starving the dedicated runners.
          EOF
