name: Photographic Styles 3 Texture Probe

on:
  push:
    branches:
      - research/photographic-styles-3-texture-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texture-probe:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build XDRemux
        shell: bash
        run: |
          set -euo pipefail
          swift build
          mkdir -p artifacts/candidates artifacts/debug artifacts/runner-smoke

      - name: Probe current macOS private TextureStyle runtime
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -framework Foundation \
            scripts/research/texture_style_runtime_probe.m \
            -o "$RUNNER_TEMP/texture-runtime-probe"
          "$RUNNER_TEMP/texture-runtime-probe" artifacts/texture-runtime-probe.json
          cat artifacts/texture-runtime-probe.json

      - name: Generate hosted-runner Photographic Styles baseline
        shell: bash
        env:
          XDREMUX_STYLE_RUNNER_OUTPUT: ${{ github.workspace }}/artifacts/runner-smoke
        run: |
          set -euo pipefail
          swift test \
            --filter PhotographicStylesRunnerSmokeTests/testColorOS16MotionPhotoConvertsToLivePhotoWithPhotographicStyles \
            2>&1 | tee artifacts/runner-smoke/test.log
          test -s artifacts/runner-smoke/coloros16-live-styles.heic
          cp artifacts/runner-smoke/coloros16-live-styles.heic artifacts/baseline.heic
          .build/debug/xdremux validate-apple \
            --input artifacts/baseline.heic \
            > artifacts/baseline-validation.json
          cat artifacts/baseline-validation.json

      - name: Build TextureStyle metadata candidate matrix without re-encoding media
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/research/patch_texture_style_heif.py \
            artifacts/baseline.heic \
            artifacts/texture-runtime-probe.json \
            artifacts/candidates \
            | tee artifacts/candidate-build-report.json

      - name: Validate every candidate and record offline evidence
        shell: bash
        run: |
          set -euo pipefail
          printf 'candidate\timageio\txdremux_validate_apple\n' > artifacts/candidate-results.tsv
          for file in artifacts/candidates/*.heic; do
            name="$(basename "$file" .heic)"
            imageio=fail
            validator=fail
            if sips -g pixelWidth -g pixelHeight "$file" \
                > "artifacts/candidates/${name}.sips.txt" 2>&1; then
              imageio=pass
            fi
            if .build/debug/xdremux validate-apple --input "$file" \
                > "artifacts/candidates/${name}.validation.json" \
                2> "artifacts/candidates/${name}.validation.stderr"; then
              validator=pass
            fi
            printf '%s\t%s\t%s\n' "$name" "$imageio" "$validator" \
              >> artifacts/candidate-results.tsv
          done
          cat artifacts/candidate-results.tsv
          python3 - <<'PY'
          from pathlib import Path
          rows = Path('artifacts/candidate-results.tsv').read_text().strip().splitlines()[1:]
          if not rows:
              raise SystemExit('no HEIC candidates were produced')
          failed = [row for row in rows if not row.endswith('\tpass\tpass')]
          if failed:
              raise SystemExit('candidate offline validation failed:\n' + '\n'.join(failed))
          PY

      - name: Verify baseline media payloads are unchanged in candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import plistlib
          from pathlib import Path

          baseline = Path('artifacts/baseline.heic').read_bytes()
          manifest = json.loads(Path('artifacts/candidates/candidate-manifest.json').read_text())
          assert manifest['sourceSHA256'] == hashlib.sha256(baseline).hexdigest()
          for item in manifest['candidates']:
              candidate = Path('artifacts/candidates', item['file']).read_bytes()
              # The patcher only edits the original iloc fields and appends one mdat.
              # It must never shrink or replace the baseline media payload.
              assert len(candidate) > len(baseline), item['file']
              assert candidate[:8] == baseline[:8], item['file']
          print(f"verified {len(manifest['candidates'])} appended-metadata candidates")
          PY

      - name: Run targeted repository checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest Tests.validation.test_agent_completion_gate
          python3 -m unittest Tests.test_swift_app_architecture

      - name: Write experiment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Photographic Styles 3 Texture probe'
            echo
            echo '- Baseline: existing hosted-runner PhotographicStylesRunnerSmokeTests output using the deterministic identity producer.'
            echo '- Candidate mutation: redirect only the semantic-style plist item to an appended mdat payload; image, Gain Map and the 51,840-byte StyleData are not re-encoded.'
            echo '- Candidate fields: Preset, Intensity, Grain, RenderingVersion and OriginalInsteadOfReversibility, derived from iOS 27 firmware symbols.'
            echo '- Runtime probe records whether the current macOS runner already exposes PITextureStyle/CEKTextureStyle private APIs.'
            echo '- This is offline structural evidence only. Texture/Grain UI activation requires importing a candidate into iOS 27/macOS 27 Photos.'
            echo
            if [[ -f artifacts/candidate-results.tsv ]]; then
              echo '```text'
              cat artifacts/candidate-results.tsv
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HEIC candidates and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: photographic-styles-3-texture-probe-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/
