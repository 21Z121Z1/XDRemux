name: Photographic Styles 3 Texture Probe

on:
  push:
    branches:
      - research/photographic-styles-3-texture-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texture-probe:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build XDRemux
        shell: bash
        run: |
          set -euo pipefail
          swift build
          mkdir -p artifacts/candidates artifacts/debug

      - name: Prepare Apple Styles fixture
        shell: bash
        env:
          FIXTURE_ARCHIVE_URL: ${{ secrets.XDREMUX_REGRESSION_FIXTURE_ARCHIVE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${FIXTURE_ARCHIVE_URL:-}" ]]; then
            echo "::error::XDREMUX_REGRESSION_FIXTURE_ARCHIVE_URL is not configured"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/xdremux-fixtures"
          curl --fail --location --silent --show-error \
            "$FIXTURE_ARCHIVE_URL" \
            --output "$RUNNER_TEMP/xdremux-fixtures.zip"
          ditto -x -k \
            "$RUNNER_TEMP/xdremux-fixtures.zip" \
            "$RUNNER_TEMP/xdremux-fixtures"
          INPUT="$(find "$RUNNER_TEMP/xdremux-fixtures" -type f -name 'apple-styles.heic' -print -quit)"
          if [[ -z "$INPUT" ]]; then
            echo "::error::apple-styles.heic is absent from the private fixture archive"
            exit 1
          fi
          echo "APPLE_STYLES_INPUT=$INPUT" >> "$GITHUB_ENV"

      - name: Generate known-good Photographic Styles baseline
        shell: bash
        run: |
          set -euo pipefail
          .build/debug/xdremux convert \
            --apple-photographic-styles \
            --debug-dir artifacts/debug/baseline \
            --input "$APPLE_STYLES_INPUT" \
            --output artifacts/baseline.heic \
            > artifacts/baseline-convert.json \
            2> artifacts/baseline-convert.stderr
          .build/debug/xdremux validate-apple \
            --input artifacts/baseline.heic \
            > artifacts/baseline-validation.json

      - name: Probe current macOS private TextureStyle runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/texture_runtime_probe.m" <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <objc/message.h>
          #import <objc/runtime.h>
          #import <dlfcn.h>

          static id Send0(id target, NSString *selector) {
              SEL sel = NSSelectorFromString(selector);
              if (!target || ![target respondsToSelector:sel]) return nil;
              return ((id (*)(id, SEL))objc_msgSend)(target, sel);
          }

          static id Send1(id target, NSString *selector, id arg) {
              SEL sel = NSSelectorFromString(selector);
              if (!target || ![target respondsToSelector:sel]) return nil;
              return ((id (*)(id, SEL, id))objc_msgSend)(target, sel, arg);
          }

          static NSString *ResolvedCFString(const char *symbol) {
              void *address = dlsym(RTLD_DEFAULT, symbol);
              if (!address) return nil;
              CFTypeRef value = *(CFTypeRef *)address;
              if (!value || CFGetTypeID(value) != CFStringGetTypeID()) return nil;
              return (__bridge NSString *)value;
          }

          static id JSONSafe(id value) {
              if (!value || value == [NSNull null]) return [NSNull null];
              if ([value isKindOfClass:[NSString class]] ||
                  [value isKindOfClass:[NSNumber class]]) return value;
              if ([value isKindOfClass:[NSData class]]) {
                  return @{ @"type": @"data", @"length": @([(NSData *)value length]) };
              }
              if ([value isKindOfClass:[NSArray class]]) {
                  NSMutableArray *out = [NSMutableArray array];
                  for (id item in (NSArray *)value) [out addObject:JSONSafe(item)];
                  return out;
              }
              if ([value isKindOfClass:[NSDictionary class]]) {
                  NSMutableDictionary *out = [NSMutableDictionary dictionary];
                  for (id key in (NSDictionary *)value) {
                      out[[key description]] = JSONSafe(((NSDictionary *)value)[key]);
                  }
                  return out;
              }
              return @{ @"class": NSStringFromClass([value class]), @"description": [value description] ?: @"" };
          }

          static NSDictionary *TextureStyleRecord(id style) {
              if (!style) return @{};
              NSMutableDictionary *out = [NSMutableDictionary dictionary];
              out[@"description"] = [style description] ?: @"";
              for (NSString *key in @[ @"preset", @"intensity", @"grain" ]) {
                  @try {
                      id value = [style valueForKey:key];
                      if (value) out[key] = JSONSafe(value);
                  } @catch (__unused NSException *exception) {}
              }
              id dict = Send1(style, @"dictionaryRepresentationUsingReferenceStyle:", nil);
              if (dict) out[@"dictionaryRepresentation"] = JSONSafe(dict);
              return out;
          }

          int main(int argc, const char *argv[]) {
              @autoreleasepool {
                  if (argc != 2) return 64;
                  NSArray<NSString *> *frameworks = @[
                      @"/System/Library/PrivateFrameworks/PhotoImaging.framework/PhotoImaging",
                      @"/System/Library/PrivateFrameworks/CameraEditKit.framework/CameraEditKit",
                      @"/System/Library/PrivateFrameworks/CMImaging.framework/CMImaging",
                      @"/System/Library/PrivateFrameworks/AVFCapture.framework/AVFCapture",
                      @"/System/Library/PrivateFrameworks/CMCaptureCore.framework/CMCaptureCore"
                  ];
                  NSMutableDictionary *loaded = [NSMutableDictionary dictionary];
                  for (NSString *path in frameworks) {
                      void *handle = dlopen(path.fileSystemRepresentation, RTLD_LAZY | RTLD_GLOBAL);
                      loaded[path] = @(handle != NULL);
                  }

                  NSMutableDictionary *symbols = [NSMutableDictionary dictionary];
                  for (NSString *name in @[
                      @"PITextureStyleAdjustmentKey",
                      @"AVAppleMakerNote_TextureStyleKey_Grain",
                      @"AVAppleMakerNote_TextureStyleKey_Intensity",
                      @"AVAppleMakerNote_TextureStyleKey_OriginalInsteadOfReversibility",
                      @"AVAppleMakerNote_TextureStyleKey_Preset",
                      @"AVAppleMakerNote_TextureStyleKey_RenderingVersion",
                      @"kFigAppleMakerNote_TextureStyleKey_Grain",
                      @"kFigAppleMakerNote_TextureStyleKey_Intensity",
                      @"kFigAppleMakerNote_TextureStyleKey_OriginalInsteadOfReversibility",
                      @"kFigAppleMakerNote_TextureStyleKey_Preset",
                      @"kFigAppleMakerNote_TextureStyleKey_RenderingVersion"
                  ]) {
                      NSString *value = ResolvedCFString(name.UTF8String);
                      if (value) symbols[name] = value;
                  }

                  NSMutableArray *defaultStyles = [NSMutableArray array];
                  Class cek = NSClassFromString(@"CEKTextureStyle");
                  id styles = Send0(cek, @"defaultStyles");
                  if ([styles isKindOfClass:[NSArray class]]) {
                      for (id style in styles) [defaultStyles addObject:TextureStyleRecord(style)];
                  }

                  Class controller = NSClassFromString(@"PITextureStyleAdjustmentController");
                  Class piTexture = NSClassFromString(@"PITextureStyle");
                  Class schema = NSClassFromString(@"PISchema");
                  Class processor = NSClassFromString(@"CMITextureStylesProcessor");

                  NSMutableDictionary *objects = [NSMutableDictionary dictionary];
                  id allPresets = Send0(controller, @"allPresets");
                  if (allPresets) objects[@"PITextureStyleAdjustmentController.allPresets"] = JSONSafe(allPresets);
                  for (NSString *selector in @[ @"identifier", @"adjustmentFormat", @"availableOptions" ]) {
                      id value = Send0(piTexture, selector);
                      if (value) objects[[NSString stringWithFormat:@"PITextureStyle.%@", selector]] = JSONSafe(value);
                  }
                  id textureSchema = Send0(schema, @"textureStyleSchema");
                  if (textureSchema) objects[@"PISchema.textureStyleSchema"] = JSONSafe(textureSchema);
                  id apiVersion = Send0(processor, @"APIVersion");
                  if (apiVersion) objects[@"CMITextureStylesProcessor.APIVersion"] = JSONSafe(apiVersion);

                  NSDictionary *result = @{
                      @"frameworks": loaded,
                      @"symbols": symbols,
                      @"classes": @{
                          @"CEKTextureStyle": @(cek != Nil),
                          @"PITextureStyleAdjustmentController": @(controller != Nil),
                          @"PITextureStyle": @(piTexture != Nil),
                          @"PISchema": @(schema != Nil),
                          @"CMITextureStylesProcessor": @(processor != Nil)
                      },
                      @"defaultStyles": defaultStyles,
                      @"objects": objects
                  };
                  NSData *json = [NSJSONSerialization dataWithJSONObject:result options:NSJSONWritingPrettyPrinted error:nil];
                  [json writeToFile:[NSString stringWithUTF8String:argv[1]] atomically:YES];
              }
              return 0;
          }
          OBJC
          xcrun clang -fobjc-arc -framework Foundation \
            "$RUNNER_TEMP/texture_runtime_probe.m" \
            -o "$RUNNER_TEMP/texture-runtime-probe"
          "$RUNNER_TEMP/texture-runtime-probe" artifacts/texture-runtime-probe.json
          cat artifacts/texture-runtime-probe.json

      - name: Build TextureStyle metadata candidate matrix without re-encoding media
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/patch_texture_style.py" <<'PY'
          import json
          import plistlib
          import shutil
          import struct
          import sys
          from pathlib import Path

          src = Path(sys.argv[1])
          probe_path = Path(sys.argv[2])
          out_dir = Path(sys.argv[3])
          out_dir.mkdir(parents=True, exist_ok=True)
          original = src.read_bytes()
          probe = json.loads(probe_path.read_text())

          def u(data, pos, width):
              return int.from_bytes(data[pos:pos+width], 'big') if width else 0

          def boxes(data, start, end):
              pos = start
              while pos + 8 <= end:
                  size = u(data, pos, 4)
                  typ = data[pos+4:pos+8].decode('latin1')
                  header = 8
                  if size == 1:
                      if pos + 16 > end: break
                      size = u(data, pos+8, 8)
                      header = 16
                  elif size == 0:
                      size = end - pos
                  if size < header or pos + size > end: break
                  yield pos, size, header, typ
                  pos += size

          top = list(boxes(original, 0, len(original)))
          meta = next((b for b in top if b[3] == 'meta'), None)
          if not meta:
              raise SystemExit('meta box not found')
          meta_pos, meta_size, meta_header, _ = meta
          children_start = meta_pos + meta_header + 4
          children_end = meta_pos + meta_size
          children = list(boxes(original, children_start, children_end))
          iloc = next((b for b in children if b[3] == 'iloc'), None)
          idat = next((b for b in children if b[3] == 'idat'), None)
          if not iloc:
              raise SystemExit('iloc box not found')
          idat_payload_start = None if not idat else idat[0] + idat[2]

          pos, size, header, _ = iloc
          p = pos + header
          version = original[p]
          p += 4
          sizes0 = original[p]; p += 1
          sizes1 = original[p]; p += 1
          offset_size = sizes0 >> 4
          length_size = sizes0 & 0x0f
          base_offset_size = sizes1 >> 4
          index_size = (sizes1 & 0x0f) if version in (1, 2) else 0
          if version < 2:
              item_count = u(original, p, 2); p += 2
              item_id_size = 2
          else:
              item_count = u(original, p, 4); p += 4
              item_id_size = 4

          entries = []
          for _ in range(item_count):
              item_id = u(original, p, item_id_size); p += item_id_size
              method_pos = None
              method = 0
              if version in (1, 2):
                  method_pos = p
                  cm = u(original, p, 2); p += 2
                  method = cm & 0x000f
              data_ref_pos = p
              data_ref = u(original, p, 2); p += 2
              base_pos = p
              base = u(original, p, base_offset_size); p += base_offset_size
              extent_count = u(original, p, 2); p += 2
              extents = []
              for _ in range(extent_count):
                  if version in (1, 2) and index_size:
                      p += index_size
                  off_pos = p
                  off = u(original, p, offset_size); p += offset_size
                  len_pos = p
                  length = u(original, p, length_size); p += length_size
                  extents.append((off_pos, off, len_pos, length))
              entries.append({
                  'item_id': item_id,
                  'method_pos': method_pos,
                  'method': method,
                  'data_ref_pos': data_ref_pos,
                  'data_ref': data_ref,
                  'base_pos': base_pos,
                  'base': base,
                  'extents': extents,
              })

          def payload_for(entry):
              if entry['data_ref'] != 0 or len(entry['extents']) != 1:
                  return None
              _, off, _, length = entry['extents'][0]
              if not length:
                  return None
              if entry['method'] == 0:
                  absolute = entry['base'] + off
              elif entry['method'] == 1 and idat_payload_start is not None:
                  absolute = idat_payload_start + entry['base'] + off
              else:
                  return None
              if absolute < 0 or absolute + length > len(original):
                  return None
              return original[absolute:absolute+length]

          style_entry = None
          style_object = None
          for entry in entries:
              payload = payload_for(entry)
              if not payload or not payload.startswith(b'bplist00'):
                  continue
              try:
                  obj = plistlib.loads(payload)
              except Exception:
                  continue
              if isinstance(obj, dict) and obj.get('0') == 15 and isinstance(obj.get('1'), bytes) and len(obj['1']) == 51840:
                  style_entry = entry
                  style_object = obj
                  break
          if not style_entry:
              raise SystemExit('semantic style bplist item was not found through iloc')
          if len(style_entry['extents']) != 1 or not offset_size or not length_size:
              raise SystemExit('style item layout cannot be safely redirected')

          symbols = probe.get('symbols', {})
          private_key = symbols.get('PITextureStyleAdjustmentKey') or 'PITextureStyleAdjustmentKey'

          defaults = probe.get('defaultStyles') or []
          def pick_style(word, fallback):
              word = word.lower()
              for item in defaults:
                  if word in str(item.get('description', '')).lower():
                      d = item.get('dictionaryRepresentation')
                      if isinstance(d, dict):
                          return d
              return fallback

          studio = pick_style('studio', {'Preset': 'Studio', 'Intensity': 1.0, 'Grain': 0.0})
          soft = pick_style('soft', {'Preset': 'Soft', 'Intensity': 1.0, 'Grain': 0.0})
          film = pick_style('film', {'Preset': 'Filmic', 'Intensity': 1.0, 'Grain': 1.0})

          def enriched(style, version):
              d = dict(style)
              d.setdefault('Preset', d.get('preset', 'Studio'))
              d.setdefault('Intensity', d.get('intensity', 1.0))
              d.setdefault('Grain', d.get('grain', 0.0))
              d['RenderingVersion'] = version
              d['OriginalInsteadOfReversibility'] = False
              return d

          candidates = []
          for version in (1, 2, 3):
              candidates.append((f'private-studio-v{version}', private_key, enriched(studio, version)))
              candidates.append((f'private-film-grain-v{version}', private_key, enriched(film, version)))
          candidates += [
              ('private-soft-v2', private_key, enriched(soft, 2)),
              ('TextureStyle-studio-v2', 'TextureStyle', enriched(studio, 2)),
              ('textureStyle-studio-v2', 'textureStyle', enriched(studio, 2)),
              ('short-l-studio-v2', 'l', enriched(studio, 2)),
          ]

          # A flat candidate mirrors the firmware-exposed metadata names without
          # assuming a nested PhotoImaging adjustment dictionary.
          flat = dict(style_object)
          flat.update({
              'TextureStylePreset': 'Studio',
              'TextureStyleIntensity': 1.0,
              'TextureStyleGrain': 0.0,
              'TextureStyleRenderingVersion': 2,
              'TextureStyleOriginalInsteadOfReversibility': False,
          })

          manifest = {
              'sourceSHA256': __import__('hashlib').sha256(original).hexdigest(),
              'ilocVersion': version,
              'styleItemID': style_entry['item_id'],
              'resolvedAdjustmentKey': private_key,
              'runtimeDefaultStyles': defaults,
              'candidates': [],
          }

          def write_candidate(name, obj):
              payload = plistlib.dumps(obj, fmt=plistlib.FMT_BINARY, sort_keys=False)
              mutable = bytearray(original)
              # Append a new top-level mdat and redirect only the existing style
              # metadata item. No primary/gain-map/style-data media payload is
              # decoded or rewritten.
              payload_start = len(mutable) + 8
              if payload_start >= (1 << (8 * offset_size)):
                  raise SystemExit('iloc offset field is too small for appended payload')
              if len(payload) >= (1 << (8 * length_size)):
                  raise SystemExit('iloc length field is too small for candidate payload')
              mutable.extend(struct.pack('>I4s', 8 + len(payload), b'mdat'))
              mutable.extend(payload)

              if style_entry['method_pos'] is not None:
                  cm = u(mutable, style_entry['method_pos'], 2)
                  cm = cm & 0xfff0
                  mutable[style_entry['method_pos']:style_entry['method_pos']+2] = cm.to_bytes(2, 'big')
              mutable[style_entry['data_ref_pos']:style_entry['data_ref_pos']+2] = (0).to_bytes(2, 'big')
              if base_offset_size:
                  mutable[style_entry['base_pos']:style_entry['base_pos']+base_offset_size] = b'\x00' * base_offset_size
              off_pos, _, len_pos, _ = style_entry['extents'][0]
              mutable[off_pos:off_pos+offset_size] = payload_start.to_bytes(offset_size, 'big')
              mutable[len_pos:len_pos+length_size] = len(payload).to_bytes(length_size, 'big')

              out = out_dir / f'{name}.heic'
              out.write_bytes(mutable)
              manifest['candidates'].append({
                  'name': name,
                  'file': out.name,
                  'stylePayloadBytes': len(payload),
                  'rootKeys': [str(k) for k in obj.keys()],
              })

          for name, key, texture in candidates:
              obj = dict(style_object)
              obj[key] = texture
              write_candidate(name, obj)
          write_candidate('flat-firmware-keys', flat)

          (out_dir / 'candidate-manifest.json').write_text(json.dumps(manifest, indent=2, default=str))
          print(json.dumps(manifest, indent=2, default=str))
          PY
          python3 "$RUNNER_TEMP/patch_texture_style.py" \
            artifacts/baseline.heic \
            artifacts/texture-runtime-probe.json \
            artifacts/candidates \
            | tee artifacts/candidate-build-report.json

      - name: Validate every candidate and record offline evidence
        shell: bash
        run: |
          set -euo pipefail
          printf 'candidate\timageio\txdremux_validate_apple\n' > artifacts/candidate-results.tsv
          any_failure=0
          for file in artifacts/candidates/*.heic; do
            name="$(basename "$file" .heic)"
            imageio=fail
            validator=fail
            if sips -g pixelWidth -g pixelHeight "$file" \
                > "artifacts/candidates/${name}.sips.txt" 2>&1; then
              imageio=pass
            fi
            if .build/debug/xdremux validate-apple --input "$file" \
                > "artifacts/candidates/${name}.validation.json" \
                2> "artifacts/candidates/${name}.validation.stderr"; then
              validator=pass
            else
              any_failure=1
            fi
            printf '%s\t%s\t%s\n' "$name" "$imageio" "$validator" \
              >> artifacts/candidate-results.tsv
          done
          cat artifacts/candidate-results.tsv
          # Candidate rejection is useful experimental evidence, not a workflow
          # infrastructure failure. The known-good baseline above is mandatory.
          exit 0

      - name: Run repository policy checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest Tests.test_swift_app_architecture
          python3 -m unittest \
            Tests.validation.test_agent_completion_gate \
            Tests.test_public_documentation \
            Tests.test_categorization_documentation

      - name: Write experiment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Photographic Styles 3 Texture probe'
            echo
            echo '- Baseline: existing XDRemux Photographic Styles output'
            echo '- Mutation: redirect only the semantic-style plist item to an appended mdat payload'
            echo '- Firmware-derived fields: Preset, Intensity, Grain, RenderingVersion, OriginalInsteadOfReversibility'
            echo '- Runtime-derived field when available: PITextureStyleAdjustmentKey and CEKTextureStyle dictionaries'
            echo '- Device claim: NOT TESTED. Import candidates into iOS 27/macOS Photos to check whether Texture/Grain controls appear.'
            echo
            if [[ -f artifacts/candidate-results.tsv ]]; then
              echo '```text'
              cat artifacts/candidate-results.tsv
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HEIC candidates and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: photographic-styles-3-texture-probe-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/
