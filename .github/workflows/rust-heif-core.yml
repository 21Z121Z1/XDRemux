name: Rust HEIF core

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Package.swift"
      - "crates/xdremux-format/**"
      - "crates/xdremux-heif/**"
      - "Sources/XDRemuxCore/HEIF/ISOBMFF.swift"
      - "Tests/XDRemuxCoreTests/HEIFRustConformanceTests.swift"
      - "scripts/check_heif_conformance.sh"
      - ".github/workflows/rust-heif-core.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Package.swift"
      - "crates/xdremux-format/**"
      - "crates/xdremux-heif/**"
      - "Sources/XDRemuxCore/HEIF/ISOBMFF.swift"
      - "Tests/XDRemuxCoreTests/HEIFRustConformanceTests.swift"
      - "scripts/check_heif_conformance.sh"
      - ".github/workflows/rust-heif-core.yml"

permissions:
  contents: write

jobs:
  migrate-imageio-auxl:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Patch canonical ISO Gain Map auxl graph
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/xdremux-heif/src/native.rs")
          text = path.read_text()
          old = """    entries.push(IrefEntry {\n        kind: AUXL,\n        from_item_id: gain_id,\n        to_item_ids: vec![meta.primary_item_id],\n    });\n"""
          new = """    entries.push(IrefEntry {\n        kind: AUXL,\n        from_item_id: gain_id,\n        to_item_ids: vec![meta.primary_item_id, tmap_id],\n    });\n"""
          if text.count(old) != 1:
              raise SystemExit("expected exactly one canonical auxl reference")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all --check
          cargo clippy --locked -p xdremux-heif --all-targets -- -D warnings
          cargo test --locked -p xdremux-heif
          git diff --check
      - name: Commit graph fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/xdremux-heif/src/native.rs
          git commit -m "fix(heif): link gain map auxl to tmap"
          git push origin HEAD:feat/rust-cli-unification

  heif-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint xdremux-heif
        run: cargo clippy --locked -p xdremux-heif --all-targets -- -D warnings
      - name: Test xdremux-heif
        run: cargo test --locked -p xdremux-heif

  heif-conformance:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Compare Swift and Rust HEIF writer outputs
        run: bash scripts/check_heif_conformance.sh
      - name: Verify cross-language completion gate
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/xdremux-heif-conformance-gate.json" <<'JSON'
          {
            "schema_version": 1,
            "scope": "Use the shared xdremux-format hvcC parser and explicit semantic-channel/chroma/bit-depth profiles throughout the isolated Rust HEIF writer and structural validator while preserving the existing Swift mono8/4448 writer corpus byte-for-byte; Apple ImageIO/Photos consumer recognition remains a separate Apple-platform gate",
            "checks": [
              {
                "name": "rust-heif-profile-and-structural-regressions",
                "kind": "regression",
                "command": ["cargo", "test", "--locked", "-p", "xdremux-heif"],
                "timeout_seconds": 600
              },
              {
                "name": "swift-rust-heif-writer-and-validator-corpus",
                "kind": "integration",
                "command": ["bash", "scripts/check_heif_conformance.sh"],
                "timeout_seconds": 1800
              }
            ]
          }
          JSON
          python3 scripts/agent_completion_gate.py run \
            --base origin/main \
            --plan "$RUNNER_TEMP/xdremux-heif-conformance-gate.json"
          python3 scripts/agent_completion_gate.py verify \
            ".codex/verification-receipts/$(git rev-parse HEAD).json"
