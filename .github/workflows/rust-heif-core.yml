name: Rust HEIF core

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-format/**"
      - "crates/xdremux-heif/**"
      - "Tests/XDRemuxCoreTests/HEIFRustConformanceTests.swift"
      - "scripts/check_heif_conformance.sh"
      - ".github/workflows/rust-heif-core.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-format/**"
      - "crates/xdremux-heif/**"
      - "Tests/XDRemuxCoreTests/HEIFRustConformanceTests.swift"
      - "scripts/check_heif_conformance.sh"
      - ".github/workflows/rust-heif-core.yml"

permissions:
  contents: write

jobs:
  heif-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Normalize HEIF writer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/xdremux-heif/src/direct.rs")
          s = p.read_text()
          old = '''    for chunk in payload[8..].chunks_exact(4) {\n        brands.push(chunk.try_into().expect("chunks_exact(4)"));\n    }'''
          new = '''    let (chunks, _) = payload[8..].as_chunks::<4>();\n    for chunk in chunks {\n        brands.push(*chunk);\n    }'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("expected source_brand_order chunk loop not found")
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Lint xdremux-heif
        run: cargo clippy --locked -p xdremux-heif --all-targets -- -D warnings
      - name: Test xdremux-heif
        run: cargo test --locked -p xdremux-heif
      - name: Commit normalized source
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- crates/xdremux-heif/src/direct.rs crates/xdremux-heif/src/lib.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/xdremux-heif/src/direct.rs crates/xdremux-heif/src/lib.rs
          git commit -m "style(rust): normalize HEIF writer"
          git push origin HEAD:feat/rust-xdremux-format
