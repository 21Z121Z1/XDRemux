name: Rust HEIF core

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-format/**"
      - "crates/xdremux-heif/**"
      - "Tests/XDRemuxCoreTests/HEIFRustConformanceTests.swift"
      - "scripts/check_heif_conformance.sh"
      - ".github/workflows/rust-heif-core.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-format/**"
      - "crates/xdremux-heif/**"
      - "Tests/XDRemuxCoreTests/HEIFRustConformanceTests.swift"
      - "scripts/check_heif_conformance.sh"
      - ".github/workflows/rust-heif-core.yml"

permissions:
  contents: read

jobs:
  heif-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint xdremux-heif
        run: cargo clippy --locked -p xdremux-heif --all-targets -- -D warnings
      - name: Test xdremux-heif
        run: cargo test --locked -p xdremux-heif
