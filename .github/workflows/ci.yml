name: XDRemux CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: xdremux-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product_required: ${{ steps.classify.outputs.product_required }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          event = os.environ["EVENT_NAME"]
          base = os.environ.get("BASE_SHA", "")
          head = os.environ["HEAD_SHA"]

          # A new-branch push has no meaningful "before" commit. Be conservative
          # and run the product validation in that case.
          zero = "0" * 40
          paths: list[str]
          if not base or base == zero:
              paths = ["<unknown>"]
          else:
              try:
                  subprocess.run(
                      ["git", "cat-file", "-e", f"{base}^{{commit}}"],
                      check=True,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  subprocess.run(
                      ["git", "fetch", "--no-tags", "origin", base],
                      check=True,
                  )

              separator = "..." if event == "pull_request" else ".."
              output = subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base}{separator}{head}"],
                  text=True,
              )
              paths = [line for line in output.splitlines() if line]

          def lightweight_only(path: str) -> bool:
              # Markdown, security-policy text, and Dependabot scheduling do not
              # need an expensive macOS compile/test pass. Everything unknown
              # defaults to product validation.
              return path.endswith(".md") or path == ".github/dependabot.yml"

          product_required = not paths or any(
              not lightweight_only(path) for path in paths
          )

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as stream:
              stream.write(
                  f"product_required={'true' if product_required else 'false'}\n"
              )
              stream.write(f"changed_count={len(paths)}\n")

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as stream:
              stream.write("## XDRemux CI path classification\n\n")
              stream.write(
                  f"- Product validation required: `{str(product_required).lower()}`\n"
              )
              stream.write(f"- Changed paths: `{len(paths)}`\n")
              if paths:
                  stream.write("\n```text\n")
                  stream.write("\n".join(paths[:100]))
                  stream.write("\n```\n")
          PY

  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run repository policy and documentation regressions
        run: |
          python3 -m unittest Tests.test_swift_app_architecture
          python3 -m unittest \
            Tests.validation.test_agent_completion_gate \
            Tests.test_public_documentation \
            Tests.test_categorization_documentation

  product:
    name: product
    needs: changes
    if: needs.changes.outputs.product_required == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "[1/7] Build Swift package"
        shell: bash
        run: |
          mkdir -p artifacts
          echo "::group::Swift package build"
          swift build 2>&1 | tee artifacts/swift-build.log
          echo "::endgroup::"
          echo "SWIFT_BUILD_RESULT=Passed" >> "$GITHUB_ENV"

      - name: "[2/7] Build diagnostics target"
        shell: bash
        run: |
          swift build --target CoreImageRAWDiagnostics 2>&1 | tee artifacts/raw-diagnostics-build.log
          echo "RAW_DIAGNOSTICS_RESULT=Passed" >> "$GITHUB_ENV"

      - name: "[3/7] Validate public package surface"
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          package = json.loads(
              subprocess.check_output(["swift", "package", "dump-package"], text=True)
          )
          products = {item["name"] for item in package["products"]}
          expected = {"XDRemuxCore", "XDRemuxAppleFeatures", "xdremux"}
          if products != expected:
              raise SystemExit(f"unexpected public package surface: {products!r}")
          PY
          echo "PACKAGE_SURFACE_RESULT=Passed" >> "$GITHUB_ENV"

      - name: "[4/7] Run Swift regression suite"
        shell: bash
        run: |
          echo "::group::Swift package tests"
          swift test 2>&1 | tee artifacts/swift-test.log
          echo "::endgroup::"
          echo "SWIFT_TEST_RESULT=Passed" >> "$GITHUB_ENV"

      - name: "[5/7] Build macOS App"
        shell: bash
        env:
          XDREMUX_DERIVED_DATA: ${{ runner.temp }}/xdremuxapp-derived
        run: |
          echo "::group::macOS App build"
          xcodebuild \
            -quiet \
            -project apps/macos/XDRemuxApp/XDRemuxApp.xcodeproj \
            -scheme XDRemuxApp \
            -configuration Debug \
            -derivedDataPath "$XDREMUX_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild \
            -quiet \
            -project apps/macos/XDRemuxApp/XDRemuxApp.xcodeproj \
            -scheme XDRemuxAppModelTests \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/xdremux-app-model-tests" \
            build
          "$RUNNER_TEMP/xdremux-app-model-tests/Build/Products/Debug/XDRemuxAppModelTests"
          echo "::endgroup::"
          echo "MACOS_APP_RESULT=Passed" >> "$GITHUB_ENV"

      - name: Prepare private fixtures
        shell: bash
        env:
          FIXTURE_ARCHIVE_URL: ${{ secrets.XDREMUX_REGRESSION_FIXTURE_ARCHIVE_URL }}
        run: |
          if [[ -z "$FIXTURE_ARCHIVE_URL" ]]; then
            echo "FIXTURE_ROOT=" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/xdremux-fixtures"
          curl --fail --location --silent --show-error \
            "$FIXTURE_ARCHIVE_URL" \
            --output "$RUNNER_TEMP/xdremux-fixtures.zip"
          ditto -x -k \
            "$RUNNER_TEMP/xdremux-fixtures.zip" \
            "$RUNNER_TEMP/xdremux-fixtures"
          echo "FIXTURE_ROOT=$RUNNER_TEMP/xdremux-fixtures" >> "$GITHUB_ENV"

      - name: Run private Motion Photo fixtures
        shell: bash
        run: |
          if [[ -z "${FIXTURE_ROOT:-}" ]]; then
            echo "MOTION_PHOTO_REAL_RESULT=Not configured" >> "$GITHUB_ENV"
            exit 0
          fi
          C15="$(find "$FIXTURE_ROOT" -type f -name 'IMG20250425184722.jpg' -print -quit)"
          C16="$(find "$FIXTURE_ROOT" -type f -name 'IMG20250901181353.jpg' -print -quit)"
          if [[ -z "$C15" && -z "$C16" ]]; then
            echo "MOTION_PHOTO_REAL_RESULT=Fixtures not present" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::group::Real OPPO Motion Photo characterization and conversion"
          XDREMUX_MOTION_PHOTO_FIXTURE_ROOT="$FIXTURE_ROOT" \
            swift test --filter RealMotionPhotoFixtureTests \
            2>&1 | tee artifacts/motion-photo-real-fixtures.log
          echo "::endgroup::"
          if [[ -n "$C15" && -n "$C16" ]]; then
            echo "MOTION_PHOTO_REAL_RESULT=Passed (ColorOS 15 + 16)" >> "$GITHUB_ENV"
          else
            echo "MOTION_PHOTO_REAL_RESULT=Passed available fixture; one generation absent" >> "$GITHUB_ENV"
          fi

      - name: "[6/7] Run fixture conversions and container validation"
        shell: bash
        run: |
          mkdir -p artifacts/fixtures artifacts/diagnostics
          if [[ -z "${FIXTURE_ROOT:-}" ]]; then
            echo "FIXTURE_RESULT=Not configured" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::group::Fixture conversions"
          .build/debug/xdremux convert \
            --input "$FIXTURE_ROOT/standard.heic" \
            --output artifacts/fixtures/standard.heic \
            > artifacts/fixtures/standard.log \
            2> artifacts/fixtures/standard.stderr
          .build/debug/xdremux convert --oppo-compatible \
            --input "$FIXTURE_ROOT/oppo.heic" \
            --output artifacts/fixtures/oppo.heic \
            > artifacts/fixtures/oppo.log \
            2> artifacts/fixtures/oppo.stderr
          .build/debug/xdremux convert --apple-photographic-styles \
            --debug-dir artifacts/diagnostics/apple-styles \
            --input "$FIXTURE_ROOT/apple-styles.heic" \
            --output artifacts/fixtures/apple-styles.heic \
            > artifacts/fixtures/apple-styles.log \
            2> artifacts/fixtures/apple-styles.stderr
          .build/debug/xdremux convert --apple-portrait \
            --debug-dir artifacts/diagnostics/apple-portrait \
            --input "$FIXTURE_ROOT/apple-portrait.heic" \
            --output artifacts/fixtures/apple-portrait.heic \
            > artifacts/fixtures/apple-portrait.log \
            2> artifacts/fixtures/apple-portrait.stderr
          echo "::endgroup::"

          echo "::group::Container validation"
          python3 Tests/validation/verify_swift_cli_sample.py \
            --validate-only \
            --input artifacts/fixtures/standard.heic \
            --expected-pixel-format 444f
          python3 Tests/validation/verify_swift_cli_sample.py \
            --validate-only \
            --input artifacts/fixtures/oppo.heic \
            --expected-pixel-format 420f
          .build/debug/xdremux validate-apple \
            --input artifacts/fixtures/apple-styles.heic \
            > artifacts/fixtures/apple-styles-validation.json
          .build/debug/xdremux validate-portrait \
            --input artifacts/fixtures/apple-portrait.heic \
            > artifacts/fixtures/apple-portrait-validation.json
          echo "::endgroup::"
          echo "FIXTURE_RESULT=Passed" >> "$GITHUB_ENV"

      - name: "[7/7] Run canonical CLI smoke"
        shell: bash
        run: |
          set -euo pipefail
          test ! -e xdremux/swift-cli/XDRemux.swift
          test ! -e xdremux/python/XDRemux.py
          .build/debug/xdremux --help >/dev/null
          for command in \
            convert batch categorize validate-apple validate-portrait portrait-self-test
          do
            .build/debug/xdremux "$command" --help >/dev/null
          done
          set +e
          .build/debug/xdremux convert >/dev/null 2>&1
          exit_code=$?
          set -e
          test "$exit_code" -eq 64
          echo "CLI_SMOKE_RESULT=Passed" >> "$GITHUB_ENV"

      - name: Annotate failure
        if: failure()
        shell: bash
        run: |
          echo "::error file=.github/workflows/ci.yml::XDRemux product validation failed; download the diagnostic artifact for complete logs"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xdremux-ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/
            ${{ runner.temp }}/xdremuxapp-derived/Logs/XDRemux/build.log
            ${{ runner.temp }}/xdremuxapp-derived/Logs/XDRemux/*.xcresult
            ${{ runner.temp }}/xdremux-app-model-tests/Logs/Test/*.xcresult

      - name: Write product summary
        if: always()
        shell: bash
        run: |
          {
            echo "## XDRemux product validation"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Swift package build | ${SWIFT_BUILD_RESULT:-Failed} |"
            echo "| Diagnostics target | ${RAW_DIAGNOSTICS_RESULT:-Not run} |"
            echo "| Public package surface | ${PACKAGE_SURFACE_RESULT:-Not run} |"
            echo "| Swift regression suite | ${SWIFT_TEST_RESULT:-Not run} |"
            echo "| macOS App | ${MACOS_APP_RESULT:-Not run} |"
            echo "| Private Motion Photo fixtures | ${MOTION_PHOTO_REAL_RESULT:-Not run} |"
            echo "| Fixture conversion/container validation | ${FIXTURE_RESULT:-Not run} |"
            echo "| CLI smoke | ${CLI_SMOKE_RESULT:-Not run} |"
          } >> "$GITHUB_STEP_SUMMARY"

  merge-gate:
    name: exact-head
    if: always()
    needs:
      - changes
      - policy
      - product
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable validation job
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          PRODUCT_RESULT: ${{ needs.product.result }}
          PRODUCT_REQUIRED: ${{ needs.changes.outputs.product_required }}
        run: |
          python3 - <<'PY'
          import os

          failures = []
          if os.environ["CHANGES_RESULT"] != "success":
              failures.append(
                  f"path classification={os.environ['CHANGES_RESULT']}"
              )
          if os.environ["POLICY_RESULT"] != "success":
              failures.append(f"policy={os.environ['POLICY_RESULT']}")

          product_required = os.environ.get("PRODUCT_REQUIRED") == "true"
          product_result = os.environ["PRODUCT_RESULT"]
          if product_required and product_result != "success":
              failures.append(f"product={product_result}")
          if not product_required and product_result not in {"skipped", "success"}:
              failures.append(f"unexpected product result={product_result}")

          if failures:
              raise SystemExit(
                  "required XDRemux validation did not pass: " + ", ".join(failures)
              )

          print(
              "XDRemux merge gate passed "
              f"(product_required={str(product_required).lower()}, "
              f"product_result={product_result})"
          )
          PY
