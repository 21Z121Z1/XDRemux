name: XDRemux Rust Product Integration

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - main
      - feat/rust-cli-unification
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xdremux-product-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-product:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Verify exact checked-out head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          mkdir -p artifacts/product-integration
          printf 'head=%s\n' "$actual" | tee artifacts/product-integration/head.txt

      - name: Install portable HEVC provider
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Verify locked workspace and formatting
        shell: bash
        run: |
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo fmt --all -- --check

      - name: Lint canonical Rust product stack
        shell: bash
        run: |
          cargo clippy --locked --workspace --all-targets -- --deny warnings \
            2>&1 | tee artifacts/product-integration/clippy.log

      - name: Test canonical Rust product stack
        shell: bash
        run: |
          cargo test --locked --workspace --all-targets \
            2>&1 | tee artifacts/product-integration/rust-tests.log

      - name: Build canonical CLI and Apple primitive adapter
        shell: bash
        run: |
          cargo build --locked -p xdremux-cli \
            2>&1 | tee artifacts/product-integration/rust-cli-build.log
          swift build --product xdremux-apple-adapter \
            2>&1 | tee artifacts/product-integration/apple-adapter-build.log
          adapter="$(swift build --show-bin-path)/xdremux-apple-adapter"
          test -x "$adapter"
          echo "XDREMUX_CI_APPLE_ADAPTER=$adapter" >> "$GITHUB_ENV"

      - name: Run ownership and repository policy regressions
        shell: bash
        run: |
          python3 -m unittest \
            Tests.validation.test_agent_completion_gate \
            Tests.test_app_architecture \
            Tests.test_product_ownership \
            Tests.test_public_documentation \
            Tests.test_categorization_documentation \
            Tests.test_performance_design \
            Tests.test_rust_artifact_lifecycle \
            Tests.test_rust_apple_semantic_policy \
            Tests.test_rust_portrait_translation \
            2>&1 | tee artifacts/product-integration/policy-tests.log

      - name: Exercise canonical public CLI routes
        shell: bash
        run: |
          bash scripts/check_rust_cli_smoke.sh \
            2>&1 | tee artifacts/product-integration/rust-cli-smoke.log

      # Keep Apple framework execution behind shared, versioned test clients.
      # Do not duplicate adapter request JSON in workflow YAML; doing so allowed
      # stale schema-v1 clients to survive the schema-v2 ownership migration.
      - name: Verify Apple adapter handshake
        shell: bash
        run: |
          bash scripts/check_apple_adapter_handshake.sh \
            2>&1 | tee artifacts/product-integration/apple-handshake.log

      - name: Verify Rust-driven Apple Portrait path
        shell: bash
        run: |
          bash scripts/check_rust_cli_apple_portrait.sh \
            2>&1 | tee artifacts/product-integration/apple-portrait.log

      - name: Verify Rust-driven Photographic Styles path
        shell: bash
        run: |
          bash scripts/check_rust_style_consumer.sh \
            2>&1 | tee artifacts/product-integration/apple-styles.log

      - name: Build and exercise macOS app against Rust CLI
        shell: bash
        env:
          XDREMUX_DERIVED_DATA: ${{ runner.temp }}/xdremux-app-model-tests
        run: |
          xcodebuild \
            -quiet \
            -project apps/macos/XDRemuxApp/XDRemuxApp.xcodeproj \
            -scheme XDRemuxApp \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/xdremux-app" \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild \
            -quiet \
            -project apps/macos/XDRemuxApp/XDRemuxApp.xcodeproj \
            -scheme XDRemuxAppModelTests \
            -configuration Debug \
            -derivedDataPath "$XDREMUX_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build
          XDREMUX_CLI="$GITHUB_WORKSPACE/target/debug/xdremux" \
            "$XDREMUX_DERIVED_DATA/Build/Products/Debug/XDRemuxAppModelTests" \
            2>&1 | tee artifacts/product-integration/app-model.log

      - name: Write integration summary
        if: always()
        shell: bash
        run: |
          {
            echo "## XDRemux canonical Rust product integration"
            echo
            echo "The checked-out commit is the exact pull-request head or push SHA."
            echo "The public CLI, product policy, media runtime, Apple primitive adapter, Portrait, Styles, and macOS app bridge are exercised without a second Swift/Python product implementation."
            echo
            echo "Windows portability, real fixture suites, performance measurements, completion receipts, and device-only Apple Photos acceptance remain separate evidence classes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xdremux-rust-product-integration
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/product-integration/
