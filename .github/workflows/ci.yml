name: XDRemux macOS Integration

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "Tests/test_public_documentation.py"
      - "AGENTS.md"
      - "scripts/agent_completion_gate.py"
      - "Tests/validation/test_agent_completion_gate.py"
      - ".github/workflows/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "Tests/test_public_documentation.py"
      - "AGENTS.md"
      - "scripts/agent_completion_gate.py"
      - "Tests/validation/test_agent_completion_gate.py"
      - ".github/workflows/**"

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install portable HEVC provider
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: "[1/5] Build Rust product and Apple migration oracle"
        shell: bash
        run: |
          mkdir -p artifacts
          echo "::group::Canonical Rust CLI build"
          cargo build --locked -p xdremux-cli 2>&1 | tee artifacts/rust-cli-build.log
          echo "::endgroup::"
          echo "RUST_BUILD_RESULT=Passed" >> "$GITHUB_ENV"
          echo "::group::Swift Apple migration build"
          swift build 2>&1 | tee artifacts/swift-build.log
          echo "::endgroup::"
          echo "APPLE_ORACLE_BUILD_RESULT=Passed" >> "$GITHUB_ENV"

      - name: "[2/5] Run migration and architecture tests"
        shell: bash
        run: |
          echo "::group::Swift migration-oracle tests"
          swift test 2>&1 | tee artifacts/swift-test.log
          echo "::endgroup::"
          echo "::group::Architecture policy tests"
          python3 -m unittest Tests.test_swift_app_architecture 2>&1 | tee artifacts/architecture-tests.log
          echo "::endgroup::"
          echo "MIGRATION_TEST_RESULT=Passed" >> "$GITHUB_ENV"

      - name: "[3/5] Build macOS App"
        shell: bash
        env:
          XDREMUX_DERIVED_DATA: ${{ runner.temp }}/xdremuxapp-derived
        run: |
          echo "::group::macOS App build"
          xcodebuild \
            -quiet \
            -project apps/macos/XDRemuxApp/XDRemuxApp.xcodeproj \
            -scheme XDRemuxApp \
            -configuration Debug \
            -derivedDataPath "$XDREMUX_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild \
            -quiet \
            -project apps/macos/XDRemuxApp/XDRemuxApp.xcodeproj \
            -scheme XDRemuxAppModelTests \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/xdremux-app-model-tests" \
            build
          "$RUNNER_TEMP/xdremux-app-model-tests/Build/Products/Debug/XDRemuxAppModelTests"
          echo "::endgroup::"
          echo "MACOS_APP_RESULT=Passed" >> "$GITHUB_ENV"

      # This bundle is the pre-existing private ProXDR / Apple feature regression fixture set.
      # Portable conversion is exercised through the canonical Rust CLI below. Swift remains only
      # where Apple feature ownership has not yet moved behind the Rust capability adapter.
      - name: Prepare private fixtures
        shell: bash
        env:
          FIXTURE_ARCHIVE_URL: ${{ secrets.XDREMUX_REGRESSION_FIXTURE_ARCHIVE_URL }}
        run: |
          if [[ -z "$FIXTURE_ARCHIVE_URL" ]]; then
            echo "FIXTURE_ROOT=" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/xdremux-fixtures"
          curl --fail --location --silent --show-error "$FIXTURE_ARCHIVE_URL" --output "$RUNNER_TEMP/xdremux-fixtures.zip"
          ditto -x -k "$RUNNER_TEMP/xdremux-fixtures.zip" "$RUNNER_TEMP/xdremux-fixtures"
          echo "FIXTURE_ROOT=$RUNNER_TEMP/xdremux-fixtures" >> "$GITHUB_ENV"

      - name: Run private Motion Photo migration oracle
        shell: bash
        run: |
          if [[ -z "${FIXTURE_ROOT:-}" ]]; then
            echo "MOTION_PHOTO_REAL_RESULT=Not configured" >> "$GITHUB_ENV"
            exit 0
          fi
          C15="$(find "$FIXTURE_ROOT" -type f -name 'IMG20250425184722.jpg' -print -quit)"
          C16="$(find "$FIXTURE_ROOT" -type f -name 'IMG20250901181353.jpg' -print -quit)"
          if [[ -z "$C15" && -z "$C16" ]]; then
            echo "MOTION_PHOTO_REAL_RESULT=Fixtures not present" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::group::Legacy Swift OPPO Motion Photo characterization oracle"
          XDREMUX_MOTION_PHOTO_FIXTURE_ROOT="$FIXTURE_ROOT" \
            swift test --filter RealMotionPhotoFixtureTests 2>&1 | tee artifacts/motion-photo-real-fixtures.log
          echo "::endgroup::"
          if [[ -n "$C15" && -n "$C16" ]]; then
            echo "MOTION_PHOTO_REAL_RESULT=Passed oracle (ColorOS 15 + 16)" >> "$GITHUB_ENV"
          else
            echo "MOTION_PHOTO_REAL_RESULT=Passed available oracle fixture; one generation absent" >> "$GITHUB_ENV"
          fi

      - name: "[4/5] Run fixture conversions"
        shell: bash
        run: |
          mkdir -p artifacts/fixtures artifacts/diagnostics
          if [[ -z "${FIXTURE_ROOT:-}" ]]; then
            echo "STANDARD_FIXTURE_RESULT=Not configured" >> "$GITHUB_ENV"
            echo "OPPO_FIXTURE_RESULT=Not configured" >> "$GITHUB_ENV"
            echo "APPLE_STYLES_RESULT=Not configured" >> "$GITHUB_ENV"
            echo "APPLE_PORTRAIT_RESULT=Not configured" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::group::Canonical Rust portable fixture conversions"
          target/debug/xdremux convert \
            --input "$FIXTURE_ROOT/standard.heic" --output artifacts/fixtures/standard.heic \
            > artifacts/fixtures/standard.log 2> artifacts/fixtures/standard.stderr
          echo "STANDARD_FIXTURE_RESULT=Passed (Rust)" >> "$GITHUB_ENV"
          target/debug/xdremux convert --oppo-compatible \
            --input "$FIXTURE_ROOT/oppo.heic" --output artifacts/fixtures/oppo.heic \
            > artifacts/fixtures/oppo.log 2> artifacts/fixtures/oppo.stderr
          echo "OPPO_FIXTURE_RESULT=Passed (Rust)" >> "$GITHUB_ENV"
          echo "::endgroup::"
          echo "::group::Apple feature migration-oracle fixture conversions"
          .build/debug/xdremux convert --apple-photographic-styles \
            --debug-dir artifacts/diagnostics/apple-styles \
            --input "$FIXTURE_ROOT/apple-styles.heic" --output artifacts/fixtures/apple-styles.heic \
            > artifacts/fixtures/apple-styles.log 2> artifacts/fixtures/apple-styles.stderr
          echo "APPLE_STYLES_RESULT=Passed (Swift oracle)" >> "$GITHUB_ENV"
          .build/debug/xdremux convert --apple-portrait \
            --debug-dir artifacts/diagnostics/apple-portrait \
            --input "$FIXTURE_ROOT/apple-portrait.heic" --output artifacts/fixtures/apple-portrait.heic \
            > artifacts/fixtures/apple-portrait.log 2> artifacts/fixtures/apple-portrait.stderr
          echo "APPLE_PORTRAIT_RESULT=Passed (Swift oracle)" >> "$GITHUB_ENV"
          echo "::endgroup::"

      - name: "[5/5] Validate output containers"
        shell: bash
        run: |
          if [[ -z "${FIXTURE_ROOT:-}" ]]; then
            echo "CONTAINER_VALIDATION_RESULT=Not configured" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::group::Portable output validation"
          target/debug/xdremux validate artifacts/fixtures/standard.heic >/dev/null
          target/debug/xdremux validate artifacts/fixtures/oppo.heic >/dev/null
          python3 Tests/validation/verify_swift_cli_sample.py \
            --validate-only --input artifacts/fixtures/standard.heic --expected-pixel-format 444f
          python3 Tests/validation/verify_swift_cli_sample.py \
            --validate-only --input artifacts/fixtures/oppo.heic --expected-pixel-format 420f
          echo "::endgroup::"
          echo "::group::Apple migration-oracle validation"
          .build/debug/xdremux validate-apple --input artifacts/fixtures/apple-styles.heic \
            > artifacts/fixtures/apple-styles-validation.json
          .build/debug/xdremux validate-portrait --input artifacts/fixtures/apple-portrait.heic \
            > artifacts/fixtures/apple-portrait-validation.json
          echo "::endgroup::"
          echo "CONTAINER_VALIDATION_RESULT=Passed" >> "$GITHUB_ENV"

      - name: Annotate failure
        if: failure()
        shell: bash
        run: echo "::error file=.github/workflows/ci.yml::XDRemux macOS integration failed; download the diagnostic artifact for complete logs"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xdremux-macos-integration-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/
            ${{ runner.temp }}/xdremuxapp-derived/Logs/XDRemux/build.log
            ${{ runner.temp }}/xdremuxapp-derived/Logs/XDRemux/*.xcresult
            ${{ runner.temp }}/xdremux-app-model-tests/Logs/Test/*.xcresult

      - name: Write CI summary
        if: always()
        shell: bash
        run: |
          {
            echo "## XDRemux macOS integration"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Canonical Rust CLI build | ${RUST_BUILD_RESULT:-Failed} |"
            echo "| Apple migration-oracle build | ${APPLE_ORACLE_BUILD_RESULT:-Failed} |"
            echo "| Migration/oracle tests | ${MIGRATION_TEST_RESULT:-Not run} |"
            echo "| macOS App build | ${MACOS_APP_RESULT:-Not run} |"
            echo "| Legacy Motion Photo oracle | ${MOTION_PHOTO_REAL_RESULT:-Not run} |"
            echo "| Standard ISO fixture | ${STANDARD_FIXTURE_RESULT:-Not run} |"
            echo "| OPPO compatibility fixture | ${OPPO_FIXTURE_RESULT:-Not run} |"
            echo "| Apple styles fixture | ${APPLE_STYLES_RESULT:-Not run} |"
            echo "| Apple portrait fixture | ${APPLE_PORTRAIT_RESULT:-Not run} |"
            echo "| Output validation | ${CONTAINER_VALIDATION_RESULT:-Not run} |"
          } >> "$GITHUB_STEP_SUMMARY"
