name: XDRemux Rust Product Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.select.outputs.base }}
      runner: ${{ steps.select.outputs.runner }}
      plan: ${{ steps.select.outputs.plan }}
      product: ${{ steps.select.outputs.product }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks for the current change
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 -m scripts.ci.select_checks \
            --base "$BASE_SHA" --head "$EXPECTED_HEAD" --event "$EVENT_NAME" >> "$GITHUB_OUTPUT"

  exact-head:
    name: exact-head
    needs: changes
    # A failed selector must fail the required context, rather than skip it.
    if: ${{ always() }}
    runs-on: ${{ needs.changes.outputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      XDREMUX_GATE_BASE: ${{ needs.changes.outputs.base }}
      XDREMUX_ORIENTATION_OUTPUT: ${{ github.workspace }}/artifacts/product-integration/orientation
      XDREMUX_STYLES_ACCEPTANCE_DIR: ${{ github.workspace }}/artifacts/styles-acceptance
      XDREMUX_DERIVED_DATA: ${{ runner.temp }}/xdremux-app-model-tests
    steps:
      - name: Require successful check selection
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
        run: test "$SELECTION_RESULT" = success

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p artifacts/product-integration

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install portable HEVC provider
        if: needs.changes.outputs.product == 'true'
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        if: needs.changes.outputs.product == 'true'
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Run exact-HEAD completion gate
        shell: bash
        env:
          PLAN: ${{ needs.changes.outputs.plan }}
        run: |
          python3 scripts/ci/agent_completion_gate.py run \
            --base "$XDREMUX_GATE_BASE" --plan "scripts/ci/$PLAN-plan.json"
          python3 scripts/ci/agent_completion_gate.py verify \
            ".codex/verification-receipts/$(git rev-parse HEAD).json"

      - name: Upload completion receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xdremux-completion-receipt-${{ env.EXPECTED_HEAD }}
          path: .codex/verification-receipts/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xdremux-rust-product-integration
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/product-integration/*.log
            artifacts/product-integration/**/*.log
            artifacts/product-integration/orientation/*.json
            artifacts/product-integration/texture/result.json

      - name: Upload HDR-first Linear Thumbnail diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xdremux-hdr-first-styles-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/styles-acceptance/linear-thumbnail-roundtrip.json
