name: PS3 TextureStyle Cleanroom V10 Device Candidates

on:
  workflow_dispatch:
  push:
    branches:
      - research/photographic-styles-3-texture-cleanroom-v8
    paths:
      - .github/workflows/ps3-texture-cleanroom-v10-device-candidates.yml
      - scripts/research/patch_texture_style_heif_v10_contract.py
      - scripts/research/patch_texture_style_heif_v8_cleanroom.py
      - scripts/research/patch_texture_style_heif_v3.py
      - scripts/research/texture_style_v8_simulator_probe.m

permissions:
  actions: read
  contents: read

jobs:
  build-and-probe:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download public Photographic Styles baseline
        uses: actions/download-artifact@v5
        with:
          name: ps3-texture-style-v5-xcode27-a80e635a1e490ffe6c82ec1625f48e0365b3561c
          path: source-artifact
          github-token: ${{ github.token }}
          repository: 21Z121Z1/XDRemux
          run-id: 34623523344

      - name: Build known controls and V10 differential matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/manifests artifacts/simulator
          baseline="$(find source-artifact -type f -name 'A-baseline-original.heic' -print -quit)"
          test -s "$baseline"
          cp "$baseline" artifacts/A-baseline-original.heic

          python3 -m py_compile \
            scripts/research/patch_texture_style_heif_v8_cleanroom.py \
            scripts/research/patch_texture_style_heif_v10_contract.py

          # Physical-device facts from the previous round:
          # A/C/D/E preserve the ordinary Photographic Styles control.
          # F (adding the 2026 item) does not. Keep those controls byte-for-byte
          # comparable while changing one contract layer at a time after F.
          build_v8() {
            local name="$1" mode="$2"
            python3 scripts/research/patch_texture_style_heif_v8_cleanroom.py \
              artifacts/A-baseline-original.heic "artifacts/${name}.heic" \
              --mode "$mode" --hardware-model 'iPhone19,2' --film-grain-seed 0 \
              --manifest "artifacts/manifests/${name}.json"
          }
          build_v8 C-style-v16 style-v16
          build_v8 D-maker-surgical maker-surgical
          build_v8 E-style-v16-maker style-v16-maker
          build_v8 F-full-v16-known-negative full-v16

          post() {
            local name="$1"; shift
            python3 scripts/research/patch_texture_style_heif_v10_contract.py \
              artifacts/F-full-v16-known-negative.heic "artifacts/${name}.heic" \
              "$@" --manifest "artifacts/manifests/${name}.json"
          }

          # Highest-value new discriminator: every genuine PS3 TextureStyle
          # positive examined in the private local corpus carries the twelve
          # 2026 semantic matte roles, including positives with no people-data
          # records. Reuse a matte already owned by the public baseline as a
          # clean-room structural alias; no private sample bytes are embedded.
          post G-full-plus-semantic-roles --semantic-aliases

          # Native PS3 metadata is located before the large image payloads.
          post H-full-semantic-early --semantic-aliases --pack-early

          # Test camera-provenance coherence independently of semantic aliases.
          # Exif Make/Model are rewritten structurally, not copied from a donor.
          post I-full-early-apple-provenance --pack-early --provenance

          # Combine semantic resources + early metadata + Apple/iPhone Exif.
          post J-full-semantic-early-provenance --semantic-aliases --pack-early --provenance

          # Strongest clean-room approximation of the native PS3 carrier:
          # native-compatible brands, native meta-child order, one final mdat,
          # early style/texture/Exif, 12 semantic roles, coherent provenance.
          post K-full-native-layout --semantic-aliases --pack-early --provenance --canonical

          shasum -a 256 artifacts/*.heic | tee artifacts/candidate-sha256.txt
          python3 - <<'PY' | tee artifacts/v10-contract-matrix.txt
          import json
          from pathlib import Path
          for p in sorted(Path('artifacts/manifests').glob('*.json')):
              d=json.loads(p.read_text())
              print(p.stem)
              if d.get('schema') == 'xdremux-texture-style-cleanroom-v10':
                  print('  semanticAliasCount=',d['semanticAliasCount'])
                  print('  earlyPackedItemIDs=',d['earlyPackedItemIDs'])
                  print('  provenancePatched=',bool(d['provenancePatched']))
                  print('  canonicalContainer=',d['canonicalContainer'])
                  print('  topLevelBoxes=',d['topLevelBoxes'])
                  print('  metaChildOrder=',d['metaChildOrder'])
              else:
                  print('  style=',d.get('styleAfter'))
                  print('  textureItemAdded=',d.get('textureItemAdded'))
          PY

      - name: Verify ImageIO still decodes all candidates
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/decode.m" <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <ImageIO/ImageIO.h>
          int main(int argc, const char **argv) { @autoreleasepool {
              if (argc != 2) return 64;
              NSURL *url=[NSURL fileURLWithPath:[NSString stringWithUTF8String:argv[1]]];
              CGImageSourceRef src=CGImageSourceCreateWithURL((__bridge CFURLRef)url,NULL);
              if(!src) return 2;
              NSDictionary *p=CFBridgingRelease(CGImageSourceCopyPropertiesAtIndex(src,0,NULL));
              size_t n=CGImageSourceGetCount(src);
              CFRelease(src);
              if(!p || n==0) return 3;
              printf("%s count=%zu width=%s height=%s\n",argv[1],n,
                     [[p objectForKey:(id)kCGImagePropertyPixelWidth] description].UTF8String,
                     [[p objectForKey:(id)kCGImagePropertyPixelHeight] description].UTF8String);
              return 0;
          }}
          OBJC
          xcrun clang -fobjc-arc -framework Foundation -framework ImageIO \
            "$RUNNER_TEMP/decode.m" -o "$RUNNER_TEMP/decode"
          : > artifacts/imageio-decode.txt
          for f in artifacts/*.heic; do
            "$RUNNER_TEMP/decode" "$f" | tee -a artifacts/imageio-decode.txt
          done

      - name: Build iOS 27 semantic-style probe app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Probe.app
          cp artifacts/*.heic Probe.app/
          cat > Probe.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>com.xdremux.PS3V10Probe</string>
            <key>CFBundleExecutable</key><string>Probe</string>
            <key>CFBundleName</key><string>PS3V10Probe</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>MinimumOSVersion</key><string>27.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict></plist>
          PLIST
          xcrun --sdk iphonesimulator clang -fobjc-arc -fblocks -arch arm64 -mios-simulator-version-min=27.0 \
            -framework Foundation -framework ImageIO \
            scripts/research/texture_style_v8_simulator_probe.m -o Probe.app/Probe
          codesign --force --sign - Probe.app

      - name: Run iOS 27 ordinary-style regression oracle
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME='com.apple.CoreSimulator.SimRuntime.iOS-27-0'
          DEVTYPE='com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro'
          UDID="$(xcrun simctl create PS3V10Probe "$DEVTYPE" "$RUNTIME")"
          trap 'xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true; xcrun simctl delete "$UDID" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$UDID"
          for i in $(seq 1 90); do
            state="$(xcrun simctl list devices -j | python3 -c 'import json,sys; d=json.load(sys.stdin); u=sys.argv[1]; print(next((x.get("state","") for xs in d["devices"].values() for x in xs if x.get("udid")==u),""))' "$UDID")"
            [ "$state" = Booted ] && break
            sleep 2
          done
          xcrun simctl install "$UDID" Probe.app
          xcrun simctl launch "$UDID" com.xdremux.PS3V10Probe | tee artifacts/simulator/launch.txt
          DATA_DIR="$(xcrun simctl get_app_container "$UDID" com.xdremux.PS3V10Probe data)"
          RESULT="$DATA_DIR/tmp/ps3-v8-results.json"
          for i in $(seq 1 60); do [ -s "$RESULT" ] && break; sleep 1; done
          test -s "$RESULT"
          cp "$RESULT" artifacts/simulator/results.json
          python3 - <<'PY' | tee artifacts/simulator/summary.txt
          import json
          from pathlib import Path
          rows=json.loads(Path('artifacts/simulator/results.json').read_text())
          def value(r,k):
              x=r.get(k); return x.get('value') if isinstance(x,dict) and x.get('available') is True else None
          for r in rows:
              print(r['file'],'hasSmartStyle=',value(r,'hasSmartStyle'),'textureSelectorAvailable=',r.get('hasTextureStyle',{}).get('available'))
          failures=[r['file'] for r in rows if value(r,'hasSmartStyle') is not True]
          if failures:
              raise SystemExit('simulator ordinary-style regressions: '+repr(failures))
          PY

      - name: Write physical-device test order
        if: always()
        shell: bash
        run: |
          cat > artifacts/DEVICE-TEST-ORDER.txt <<'TXT'
          Physical iOS 27 Photos test. Previous round already established:
            A, C, D, E => ordinary Photographic Styles control YES
            F          => ordinary Photographic Styles control NO; TextureStyle NO

          Test new files in this order:
          1. G-full-plus-semantic-roles.heic
             isolates the 12 native 2026 semantic matte roles.
          2. H-full-semantic-early.heic
             adds native-like early placement of style/texture/Exif.
          3. I-full-early-apple-provenance.heic
             isolates early placement + Apple/iPhone Exif, without the 12 aliases.
          4. J-full-semantic-early-provenance.heic
             combines semantic roles + early placement + coherent camera provenance.
          5. K-full-native-layout.heic
             strongest candidate; additionally canonicalizes ftyp/top-level/meta ordering.

          Record TWO independent results for every file:
          - ordinary Photographic Styles control: YES / NO
          - TextureStyle / 质感 control: YES / NO
          If TextureStyle is YES, also test preset/intensity/grain and save/reopen.
          TXT

      - name: Upload V10 physical-device candidates and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ps3-texture-cleanroom-v10-device-candidates-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/
