name: macOS Rust Distribution

on:
  push:
    branches: [main, feat/rust-cli-distribution-i18n-20260924]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-distribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  MACOSX_DEPLOYMENT_TARGET: '15.0'

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-26-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: '1.98.1'
      - name: Install build tools only
        run: brew install cmake ninja nasm pkgconf
      - name: Build pinned native dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/distribution-artifacts/evidence"
          python3 scripts/distribution/build_native.py --arch '${{ matrix.arch }}' --work "$RUNNER_TEMP/xdremux-native" 2>&1 | tee "$RUNNER_TEMP/distribution-artifacts/evidence/native-build.log"
      - name: Build Rust and narrow Apple adapter
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$RUNNER_TEMP/xdremux-native/prefix/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PKG_CONFIG_PATH"
          export RUSTFLAGS='-C link-arg=-Wl,-headerpad_max_install_names'
          cargo build --locked --release --target '${{ matrix.target }}' -p xdremux-cli
          swift build --package-path platforms/apple -c release --product xdremux-apple-adapter -Xlinker -headerpad_max_install_names
          adapter="$(swift build --package-path platforms/apple -c release --show-bin-path)/xdremux-apple-adapter"
          package="$RUNNER_TEMP/staging/XDRemux-macOS-${{ matrix.arch }}"
          python3 scripts/distribution/macos.py stage --cli 'target/${{ matrix.target }}/release/xdremux' --adapter "$adapter" --native "$RUNNER_TEMP/xdremux-native" --output "$package" --arch '${{ matrix.arch }}' --head "$EXPECTED_HEAD"
          python3 scripts/distribution/macos.py archive --package "$package" --output "$RUNNER_TEMP/distribution-artifacts/XDRemux-macOS-${{ matrix.arch }}.tar.gz" --epoch "$(git show -s --format=%ct HEAD)"
          cp "$RUNNER_TEMP/staging/XDRemux-macOS-${{ matrix.arch }}-linkage.json" "$RUNNER_TEMP/distribution-artifacts/evidence/"
          cp "$RUNNER_TEMP/xdremux-native/build/libheif/CMakeCache.txt" "$RUNNER_TEMP/distribution-artifacts/evidence/libheif-cmake-cache.txt"
          {
            git rev-parse HEAD
            rustc --version
            cargo --version
            swift --version
            xcodebuild -version
            sw_vers
            printf 'ImageVersion=%s\n' "${ImageVersion:-unknown}"
          } > "$RUNNER_TEMP/distribution-artifacts/evidence/toolchain.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: XDRemux-macOS-${{ matrix.arch }}
          path: ${{ runner.temp }}/distribution-artifacts/
          retention-days: 14
          if-no-files-found: error
