name: macOS Rust Distribution

on:
  push:
    branches: [feat/rust-cli-distribution-i18n-20260924]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-implementation:
    if: github.ref == 'refs/heads/feat/rust-cli-distribution-i18n-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      head: ${{ steps.apply.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply immutable reviewed CLI changes
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='feat/rust-cli-distribution-i18n-20260924'
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          if ! test -f crates/xdremux-cli/src/i18n.rs; then
            gh api repos/21Z121Z1/XDRemux/git/blobs/1a6c8c9f4a5abccf9b2cec29a7835784f8eae29c --jq .content | base64 --decode > crates/xdremux-cli/src/i18n.rs
            gh api repos/21Z121Z1/XDRemux/git/blobs/e7088c1b071f001f917219bf1a3fc37e247a0413 --jq .content | base64 --decode > crates/xdremux-cli/tests/i18n.rs
            gh api repos/21Z121Z1/XDRemux/git/blobs/531393e58aef1d457623443059dcbc6c0ecd7c25 --jq .content | base64 --decode > "$RUNNER_TEMP/cli-presentation.py"
            python3 "$RUNNER_TEMP/cli-presentation.py"
            cargo fmt --all
            git add crates/xdremux-cli
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(cli): localize terminal presentation without changing machine contracts'
            git push origin "HEAD:refs/heads/$branch"
          fi
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  cli-validation:
    needs: cli-implementation
    runs-on: macos-26
    timeout-minutes: 60
    env:
      LANG: C
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.cli-implementation.outputs.head }}
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Validate actual CLI presentation and machine receipts
        shell: bash
        run: |
          set -euo pipefail
          brew install libheif
          export PKG_CONFIG_PATH="$(brew --prefix libheif)/lib/pkgconfig"
          mkdir -p artifacts/distribution
          git rev-parse HEAD | tee artifacts/distribution/head.txt
          rustc --version | tee artifacts/distribution/rust-version.txt
          cargo fmt --all -- --check
          cargo clippy --locked -p xdremux-cli --all-targets -- --deny warnings
          cargo test --locked -p xdremux-cli --all-targets
          target/debug/xdremux --lang en --help > artifacts/distribution/help-en.txt
          target/debug/xdremux --lang zh-CN --help > artifacts/distribution/help-zh-CN.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xdremux-cli-i18n-validation
          path: artifacts/distribution/
          retention-days: 3
          if-no-files-found: error
