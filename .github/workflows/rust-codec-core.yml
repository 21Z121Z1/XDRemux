name: Rust codec provider

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-codec/**"
      - "crates/xdremux-engine/**"
      - "crates/xdremux-format/**"
      - "crates/xdremux-heif/**"
      - "xdremux_py/heif_io.py"
      - "Sources/XDRemuxCore/Resources/Native/apple_vt_hevc_encoder.swift"
      - ".github/workflows/rust-codec-core.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-codec/**"
      - "crates/xdremux-engine/**"
      - "crates/xdremux-format/**"
      - "crates/xdremux-heif/**"
      - "xdremux_py/heif_io.py"
      - "Sources/XDRemuxCore/Resources/Native/apple_vt_hevc_encoder.swift"
      - ".github/workflows/rust-codec-core.yml"

permissions:
  contents: read

jobs:
  codec-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install libheif HEVC provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libheif-plugin-x265 libheif-plugin-libde265
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Bootstrap dependency lockfile
        run: cargo generate-lockfile
      - name: Apply diagnostic checkout fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("crates/xdremux-codec/src/portable/libheif.rs")
          text = path.read_text()
          text = text.replace("origin_y\n            .checked_add(y)\n            .unwrap_or(u32::MAX)", "origin_y.saturating_add(y)")
          text = text.replace("origin_x\n                .checked_add(x)\n                .unwrap_or(u32::MAX)", "origin_x.saturating_add(x)")
          text, count = re.subn(r'        match encoder\.parameter\("chroma"\).*?\n        \}\n', '', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("expected one chroma readback block")
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Lint portable codec provider
        run: cargo clippy -p xdremux-codec --all-targets -- -D warnings
      - name: Test portable codec provider
        run: cargo test -p xdremux-codec
