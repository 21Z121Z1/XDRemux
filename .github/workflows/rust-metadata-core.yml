name: Rust metadata core

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-format/**"
      - "crates/xdremux-metadata/**"
      - "Package.swift"
      - "Sources/MetadataConformanceOracle/**"
      - "Sources/XDRemuxCore/Metadata/OppoMetadata.swift"
      - "Sources/XDRemuxCore/HEIF/ISOBMFF.swift"
      - "scripts/check_rust_metadata_fixtures.sh"
      - "scripts/check_metadata_conformance.sh"
      - ".github/workflows/rust-metadata-core.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-format/**"
      - "crates/xdremux-metadata/**"
      - "Package.swift"
      - "Sources/MetadataConformanceOracle/**"
      - "Sources/XDRemuxCore/Metadata/OppoMetadata.swift"
      - "Sources/XDRemuxCore/HEIF/ISOBMFF.swift"
      - "scripts/check_rust_metadata_fixtures.sh"
      - "scripts/check_metadata_conformance.sh"
      - ".github/workflows/rust-metadata-core.yml"

permissions:
  contents: read

jobs:
  metadata-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint xdremux-metadata
        run: cargo clippy --locked -p xdremux-metadata --all-targets -- -D warnings

      - name: Test xdremux-metadata
        run: cargo test --locked -p xdremux-metadata

      - name: Exercise real OPPO HEIF metadata fixtures
        run: bash scripts/check_rust_metadata_fixtures.sh

      - name: Verify repository completion gate
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/xdremux-metadata-gate.json" <<'JSON'
          {
            "schema_version": 1,
            "scope": "Add isolated Rust OPPO UserComment and ISO 21496 metadata semantics and exercise them on repository HEIF fixtures",
            "checks": [
              {
                "name": "rust-metadata-regressions",
                "kind": "regression",
                "command": ["cargo", "test", "--locked", "-p", "xdremux-metadata"],
                "timeout_seconds": 300
              },
              {
                "name": "rust-metadata-real-fixtures",
                "kind": "integration",
                "command": ["bash", "scripts/check_rust_metadata_fixtures.sh"],
                "timeout_seconds": 600
              },
              {
                "name": "rust-metadata-clippy",
                "kind": "static",
                "command": ["cargo", "clippy", "--locked", "-p", "xdremux-metadata", "--all-targets", "--", "-D", "warnings"],
                "timeout_seconds": 300
              }
            ]
          }
          JSON
          python3 scripts/agent_completion_gate.py run \
            --base origin/main \
            --plan "$RUNNER_TEMP/xdremux-metadata-gate.json"
          python3 scripts/agent_completion_gate.py verify \
            ".codex/verification-receipts/$(git rev-parse HEAD).json"

  metadata-conformance:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Pin established Swift metadata contract
        run: swift test --filter CoreContractTests/testAppleTmapPayloadUsesImageIOCanonicalRationals

      - name: Compare Swift and Rust metadata semantics
        run: bash scripts/check_metadata_conformance.sh

      - name: Verify cross-language completion gate
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/xdremux-metadata-conformance-gate.json" <<'JSON'
          {
            "schema_version": 1,
            "scope": "Prove xdremux-metadata matches current Swift OPPO routing, tmap, XMP, and Exif patch semantics",
            "checks": [
              {
                "name": "swift-tmap-golden-contract",
                "kind": "regression",
                "command": ["swift", "test", "--filter", "CoreContractTests/testAppleTmapPayloadUsesImageIOCanonicalRationals"],
                "timeout_seconds": 600
              },
              {
                "name": "swift-rust-metadata-conformance",
                "kind": "integration",
                "command": ["bash", "scripts/check_metadata_conformance.sh"],
                "timeout_seconds": 1200
              }
            ]
          }
          JSON
          python3 scripts/agent_completion_gate.py run \
            --base origin/main \
            --plan "$RUNNER_TEMP/xdremux-metadata-conformance-gate.json"
          python3 scripts/agent_completion_gate.py verify \
            ".codex/verification-receipts/$(git rev-parse HEAD).json"
