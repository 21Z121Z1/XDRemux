name: iOS 27 video Smart Style metadata experiment

on:
  push:
    branches:
      - experiment/ios27-video-smartstyle-metadata
    paths:
      - scripts/experiments/VideoSmartStyleInjector.swift
      - scripts/experiments/VideoSmartStyleValidator.swift
      - .github/workflows/ios27-video-smartstyle-metadata.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inject-and-inspect:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download public iPhone video fixture from GitHub
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out/reports
          # The upstream iphone.MP4/MOV entries are local symlinks. iphone-invalid.MP4
          # is the same iPhone fixture family committed as a real 5.9 MB Git blob;
          # its test only deliberately corrupts the date box, which is immaterial here.
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/stefwalter/refly/c885d0758c6f364ada3e36384a3f6c77c09adb2c/public/fixtures/iphone-invalid.MP4' \
            -o out/source-iphone.MP4
          test -s out/source-iphone.MP4
          test "$(stat -f%z out/source-iphone.MP4)" -gt 1000000
          shasum -a 256 out/source-iphone.MP4 | tee out/reports/source.sha256
          file out/source-iphone.MP4 | tee out/reports/source.file.txt

      - name: Install metadata inspection tools
        shell: bash
        run: |
          set -euxo pipefail
          brew install exiftool ffmpeg

      - name: Inspect source iPhone fixture
        shell: bash
        run: |
          set -euxo pipefail
          exiftool -ee -G1 -s out/source-iphone.MP4 | tee out/reports/source.exiftool.txt
          ffprobe -v error -show_format -show_streams -of json out/source-iphone.MP4 > out/reports/source.ffprobe.json
          grep -Eai 'Apple|iPhone|QuickTime|com\.apple|make|model' out/reports/source.exiftool.txt | tee out/reports/source.apple-lines.txt || true

      - name: Build VideoSmartStyleInjector
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out/bin
          xcrun swiftc \
            -parse-as-library \
            -O \
            -framework AVFoundation \
            -framework CoreMedia \
            scripts/experiments/VideoSmartStyleInjector.swift \
            -o out/bin/VideoSmartStyleInjector

      - name: Build VideoSmartStyleValidator
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out/bin
          xcrun swiftc \
            -parse-as-library \
            -O \
            -framework AVFoundation \
            -framework CoreMedia \
            scripts/experiments/VideoSmartStyleValidator.swift \
            -o out/bin/VideoSmartStyleValidator

      - name: Generate candidate MOVs
        shell: bash
        run: |
          set -euxo pipefail
          out/bin/VideoSmartStyleInjector out/source-iphone.MP4 out/A-static-keys.MOV static | tee out/reports/A.log
          out/bin/VideoSmartStyleInjector out/source-iphone.MP4 out/B-static-plus-timed-lower.MOV lower | tee out/reports/B.log
          out/bin/VideoSmartStyleInjector out/source-iphone.MP4 out/C-static-plus-timed-compact.MOV compact | tee out/reports/C.log
          out/bin/VideoSmartStyleInjector out/source-iphone.MP4 out/D-static-plus-timed-upper.MOV upper | tee out/reports/D.log

      - name: Validate candidates with Apple AVFoundation
        shell: bash
        run: |
          set -euxo pipefail
          out/bin/VideoSmartStyleValidator out/A-static-keys.MOV 0 | tee out/reports/A.avfoundation.txt
          out/bin/VideoSmartStyleValidator out/B-static-plus-timed-lower.MOV 1 | tee out/reports/B.avfoundation.txt
          out/bin/VideoSmartStyleValidator out/C-static-plus-timed-compact.MOV 1 | tee out/reports/C.avfoundation.txt
          out/bin/VideoSmartStyleValidator out/D-static-plus-timed-upper.MOV 1 | tee out/reports/D.avfoundation.txt

      - name: Inspect injected metadata
        shell: bash
        run: |
          set -euxo pipefail
          for f in out/[ABCD]-*.MOV; do
            base="$(basename "$f" .MOV)"
            ffprobe -v error -show_format -show_streams -of json "$f" \
              > "out/reports/${base}.ffprobe.json" \
              2> "out/reports/${base}.ffprobe.stderr.txt" || true
            exiftool -ee -G1 -s "$f" \
              > "out/reports/${base}.exiftool.txt" \
              2> "out/reports/${base}.exiftool.stderr.txt" || true
            strings "$f" | grep -Eai 'smartstyle|smartstyle-info' > "out/reports/${base}.smartstyle-strings.txt" || true
            test -s "$f"
          done
          grep -q 'com.apple.quicktime.smartstyle.rendering-version' out/reports/A-static-keys.smartstyle-strings.txt
          grep -q 'com.apple.quicktime.smartstyle.cast' out/reports/A-static-keys.smartstyle-strings.txt
          for x in B-static-plus-timed-lower C-static-plus-timed-compact D-static-plus-timed-upper; do
            grep -q 'com.apple.quicktime.smartstyle-info' "out/reports/${x}.smartstyle-strings.txt"
          done

      - name: Write device-test notes
        shell: bash
        run: |
          cat > out/README-DEVICE-TEST.txt <<'EOF'
          iOS 27 Photos Smart Style video metadata experiment

          Source fixture:
          https://github.com/stefwalter/refly/blob/c885d0758c6f364ada3e36384a3f6c77c09adb2c/public/fixtures/iphone-invalid.MP4

          Import the four candidates into Photos on iOS 27, preferably one at a time, then open Edit.
          Record whether the Photographic Styles control/space appears and whether changing a style renders successfully.

          A-static-keys.MOV: file-level QuickTime Smart Style keys only.
          B-static-plus-timed-lower.MOV: static keys plus per-frame smartstyle-info binary plist, lower-camel names.
          C-static-plus-timed-compact.MOV: same, compact names.
          D-static-plus-timed-upper.MOV: same, upper-camel names.

          These are structural probes, not claims of valid Apple reversible style data.
          Only iOS 27 Photos device testing can establish UI activation.
          EOF

      - name: Upload candidates and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios27-video-smartstyle-metadata-candidates
          path: |
            out/source-iphone.MP4
            out/[ABCD]-*.MOV
            out/README-DEVICE-TEST.txt
            out/reports/
          if-no-files-found: warn
          retention-days: 7
