name: Materialize verified Rust source only

on:
  push:
    branches:
      - feat/rust-cli-unification
    paths:
      - ".github/workflows/materialize-rust-source-only.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
          fetch-depth: 0
      - name: Install libheif HEVC provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libheif-plugin-x265 libheif-plugin-libde265
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Reapply verified transformation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/materialize-rust-unification-v2.yml").read_text()
          section = workflow.index("      - name: Apply verified source transformation")
          start = workflow.index("        run: |\n", section) + len("        run: |\n")
          end = workflow.index("      - name: Verify before commit", start)
          lines = []
          for line in workflow[start:end].splitlines():
              if line.startswith("          "):
                  lines.append(line[10:])
              elif not line.strip():
                  lines.append("")
              else:
                  raise SystemExit(f"unexpected transformation indentation: {line!r}")
          Path("/tmp/apply-verified-rust.sh").write_text("\n".join(lines) + "\n")
          PY
          bash /tmp/apply-verified-rust.sh
      - name: Verify before source commit
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo fmt --all -- --check
          cargo clippy --locked -p xdremux-heif -p xdremux-codec --all-targets -- -D warnings
          cargo test --locked -p xdremux-heif
          cargo test --locked -p xdremux-codec
      - name: Commit source only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/xdremux-heif/src/native.rs crates/xdremux-codec/src/portable/libheif.rs
          git diff --cached --check
          git commit -m "fix(rust-heif): canonicalize existing gain-map graphs"
          git push origin HEAD:feat/rust-cli-unification
