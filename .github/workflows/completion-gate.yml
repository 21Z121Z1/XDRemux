name: XDRemux Completion Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  exact-head:
    name: canonical-product
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install portable HEVC provider
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Write exact-HEAD verification plan
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/xdremux-completion-plan.json" <<'JSON'
          {
            "schema_version": 1,
            "scope": "Canonical Rust XDRemux product stack plus migration-only Apple platform capability adapter",
            "checks": [
              {
                "name": "rust-workspace-lock",
                "kind": "static",
                "command": ["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"],
                "timeout_seconds": 600
              },
              {
                "name": "rust-workspace-format",
                "kind": "static",
                "command": ["/bin/zsh", "-lc", "cargo fmt --all -- --check"],
                "timeout_seconds": 600
              },
              {
                "name": "rust-workspace-clippy",
                "kind": "static",
                "command": ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"],
                "timeout_seconds": 1800
              },
              {
                "name": "rust-workspace-tests",
                "kind": "regression",
                "command": ["cargo", "test", "--workspace", "--locked"],
                "timeout_seconds": 2400
              },
              {
                "name": "canonical-rust-cli-entrypoint",
                "kind": "functional",
                "command": ["/bin/zsh", "-lc", "set -euo pipefail; cargo build --locked -p xdremux-cli; CLI=target/debug/xdremux; $CLI --help >/dev/null; for command in inspect convert batch categorize validate; do $CLI $command --help >/dev/null; done; for command in convert batch; do help=$($CLI $command --help); print -r -- $help | grep -F -- '--oppo-compatible' >/dev/null; if print -r -- $help | grep -E -- '(^|[[:space:]])--family([=[:space:]]|$)|(^|[[:space:]])--oppo-compat([=[:space:]]|$)|--oppo-camera-tail|--input-processing|--tmap-format'; then exit 1; fi; done; bash scripts/check_rust_cli_smoke.sh"],
                "timeout_seconds": 1200
              },
              {
                "name": "apple-capability-adapter-handshake",
                "kind": "functional",
                "command": ["bash", "scripts/check_apple_adapter_handshake.sh"],
                "timeout_seconds": 1800
              },
              {
                "name": "raw-diagnostics-target-build",
                "kind": "static",
                "command": ["swift", "build", "--target", "CoreImageRAWDiagnostics"],
                "timeout_seconds": 900
              },
              {
                "name": "repository-policy-regressions",
                "kind": "regression",
                "command": ["python3", "-m", "unittest", "Tests.test_product_ownership", "Tests.test_public_documentation", "Tests.test_categorization_documentation", "Tests.test_swift_app_architecture"],
                "timeout_seconds": 300
              }
            ]
          }
          JSON

      - name: Run exact-HEAD completion gate
        shell: bash
        run: |
          python3 scripts/agent_completion_gate.py run \
            --base origin/${{ github.event.pull_request.base.ref }} \
            --plan "$RUNNER_TEMP/xdremux-completion-plan.json"
          python3 scripts/agent_completion_gate.py verify \
            ".codex/verification-receipts/$(git rev-parse HEAD).json"

      - name: Upload completion receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xdremux-completion-receipt-${{ github.event.pull_request.head.sha }}
          path: .codex/verification-receipts/*.json
          if-no-files-found: warn
          retention-days: 14
