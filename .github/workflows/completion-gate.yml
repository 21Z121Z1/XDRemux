name: XDRemux Completion Gate

on:
  pull_request:
    paths:
      - "Package.swift"
      - "pyproject.toml"
      - "Sources/**"
      - "xdremux/**"
      - "xdremux_py/**"
      - "apps/macos/XDRemuxApp/Sources/**"
      - "Tests/**"
      - "scripts/**"
      - ".github/workflows/completion-gate.yml"

jobs:
  exact-head:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Write exact-HEAD verification plan
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/xdremux-completion-plan.json" <<'JSON'
          {
            "schema_version": 1,
            "scope": "Repository simplification: public package surface, CLI parsing, retired compatibility entry points, and regression coverage",
            "checks": [
              {
                "name": "swift-package-build",
                "kind": "static",
                "command": ["swift", "build"],
                "timeout_seconds": 1200
              },
              {
                "name": "raw-diagnostics-target-build",
                "kind": "static",
                "command": ["swift", "build", "--target", "CoreImageRAWDiagnostics"],
                "timeout_seconds": 900
              },
              {
                "name": "public-package-surface",
                "kind": "static",
                "command": ["/bin/zsh", "-lc", "python3 - <<'PY'\nimport json, subprocess\npackage = json.loads(subprocess.check_output(['swift', 'package', 'dump-package'], text=True))\nproducts = {item['name'] for item in package['products']}\nexpected = {'XDRemuxCore', 'XDRemuxAppleFeatures', 'xdremux'}\nassert products == expected, (products, expected)\nPY"],
                "timeout_seconds": 300
              },
              {
                "name": "swift-regression-suite",
                "kind": "regression",
                "command": ["swift", "test"],
                "timeout_seconds": 1800
              },
              {
                "name": "repository-policy-regressions",
                "kind": "regression",
                "command": ["python3", "-m", "unittest", "Tests.test_public_documentation", "Tests.test_categorization_documentation", "Tests.test_swift_app_architecture"],
                "timeout_seconds": 300
              },
              {
                "name": "canonical-cli-entrypoint-smoke",
                "kind": "functional",
                "command": ["/bin/zsh", "-lc", "test ! -e xdremux/swift-cli/XDRemux.swift && test ! -e xdremux/python/XDRemux.py && .build/debug/xdremux --help >/dev/null"],
                "timeout_seconds": 300
              }
            ]
          }
          JSON

      - name: Run exact-HEAD completion gate
        shell: bash
        run: |
          python3 scripts/agent_completion_gate.py run \
            --base origin/${{ github.event.pull_request.base.ref }} \
            --plan "$RUNNER_TEMP/xdremux-completion-plan.json"
          python3 scripts/agent_completion_gate.py verify \
            ".codex/verification-receipts/$(git rev-parse HEAD).json"

      - name: Upload completion receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xdremux-completion-receipt-${{ github.event.pull_request.head.sha }}
          path: .codex/verification-receipts/*.json
          if-no-files-found: error
          retention-days: 14
