name: XDRemux Completion Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    name: exact-head
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      XDREMUX_GATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      XDREMUX_GATE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || github.event.before || 'main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.XDREMUX_GATE_SHA }}
          fetch-depth: 0

      - name: Install portable HEVC provider
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Write exact-HEAD verification plan
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/xdremux-completion-plan.json" <<'JSON'
          {
            "schema_version": 1,
            "scope": "Canonical Rust XDRemux product stack plus migration-only Apple platform capability adapter",
            "checks": [
              {
                "name": "rust-workspace-lock",
                "kind": "static",
                "command": ["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"],
                "timeout_seconds": 600
              },
              {
                "name": "rust-workspace-format",
                "kind": "static",
                "command": ["/bin/zsh", "-lc", "cargo fmt --all -- --check"],
                "timeout_seconds": 600
              },
              {
                "name": "rust-workspace-clippy",
                "kind": "static",
                "command": ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--", "-D", "warnings"],
                "timeout_seconds": 1800
              },
              {
                "name": "rust-workspace-tests",
                "kind": "regression",
                "command": ["cargo", "test", "--workspace", "--all-targets", "--locked"],
                "timeout_seconds": 2400
              },
              {
                "name": "canonical-rust-cli-entrypoint",
                "kind": "functional",
                "command": ["/bin/zsh", "-lc", "set -euo pipefail; cargo build --locked -p xdremux-cli; CLI=target/debug/xdremux; $CLI --help >/dev/null; for command in inspect convert batch categorize validate; do $CLI $command --help >/dev/null; done; for command in convert batch; do help=$($CLI $command --help); print -r -- $help | grep -F -- '--oppo-compatible' >/dev/null; if print -r -- $help | grep -E -- '(^|[[:space:]])--family([=[:space:]]|$)|(^|[[:space:]])--oppo-compat([=[:space:]]|$)|--oppo-camera-tail|--input-processing|--tmap-format'; then exit 1; fi; done; bash scripts/validation/check_rust_cli_smoke.sh"],
                "timeout_seconds": 1200
              },
              {
                "name": "apple-capability-adapter-handshake",
                "kind": "functional",
                "command": ["bash", "scripts/apple/check_apple_adapter_handshake.sh"],
                "timeout_seconds": 1800
              },
              {
                "name": "rust-driven-apple-portrait-cli",
                "kind": "functional",
                "command": ["bash", "scripts/apple/check_rust_cli_apple_portrait.sh"],
                "timeout_seconds": 2400
              },
              {
                "name": "rust-driven-oppo-native-portrait-cli",
                "kind": "functional",
                "command": ["python3", "scripts/apple/check_rust_cli_oppo_portrait.py"],
                "timeout_seconds": 1200
              },
              {
                "name": "rust-driven-apple-styles-consumer",
                "kind": "integration",
                "command": ["bash", "scripts/apple/check_rust_style_consumer.sh"],
                "timeout_seconds": 2400
              },
              {
                "name": "rust-component-conformance",
                "kind": "integration",
                "command": ["/bin/bash", "-lc", "set -euo pipefail; bash scripts/validation/check_classification_conformance.sh; bash scripts/validation/check_container_conformance.sh; bash scripts/validation/check_format_conformance.sh; bash scripts/validation/check_format_constructor_conformance.sh; bash scripts/validation/check_hdr_edr_conformance.sh; bash scripts/validation/check_hdr_gainmap_conformance.sh; bash scripts/validation/check_heif_conformance.sh; bash scripts/validation/check_metadata_conformance.sh; bash scripts/validation/check_motion_photo_rust_conformance.sh"],
                "timeout_seconds": 3600
              },
              {
                "name": "engine-plan-vectors",
                "kind": "integration",
                "command": ["bash", "scripts/validation/check_engine_plan_vectors.sh"],
                "timeout_seconds": 1200
              },
              {
                "name": "rust-motion-photo-real-fixtures",
                "kind": "functional",
                "command": ["bash", "scripts/validation/check_rust_motion_photo_real_fixtures.sh"],
                "timeout_seconds": 3600
              },
              {
                "name": "repository-policy-regressions",
                "kind": "regression",
                "command": ["python3", "-m", "unittest", "tests.validation.test_agent_completion_gate", "tests.test_product_ownership", "tests.test_public_documentation", "tests.test_categorization_documentation", "tests.test_app_architecture", "tests.test_performance_design", "tests.test_rust_artifact_lifecycle", "tests.test_rust_apple_semantic_policy", "tests.test_apple_device_acceptance", "tests.test_rust_portrait_translation", "tests.validation.test_workflow_configuration"],
                "timeout_seconds": 300
              }
            ]
          }
          JSON

      - name: Run exact-HEAD completion gate
        shell: bash
        run: |
          python3 scripts/ci/agent_completion_gate.py run \
            --base "$XDREMUX_GATE_BASE" \
            --plan "$RUNNER_TEMP/xdremux-completion-plan.json"
          python3 scripts/ci/agent_completion_gate.py verify \
            ".codex/verification-receipts/$(git rev-parse HEAD).json"

      - name: Upload completion receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xdremux-completion-receipt-${{ env.XDREMUX_GATE_SHA }}
          path: .codex/verification-receipts/*.json
          if-no-files-found: warn
          retention-days: 14
