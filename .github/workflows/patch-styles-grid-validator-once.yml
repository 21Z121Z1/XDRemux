name: Patch Styles Grid Validator Once

on:
  push:
    branches:
      - test/macos26-photographic-styles-smoke
    paths:
      - .github/workflows/patch-styles-grid-validator-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select the Style Delta grid structurally
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Sources/XDRemuxAppleFeatures/PhotographicStyles/ApplePhotographicStylesPipeline.swift")
          lines = path.read_text().splitlines()

          starts = [
              i for i, line in enumerate(lines)
              if line.strip() == 'let deltaGrid = refs.first(where: { ref in'
          ]
          if len(starts) != 1:
              raise SystemExit(f"expected one deltaGrid validator, found {len(starts)}")
          i = starts[0]
          if lines[i + 1].strip() != 'ref.type == "dimg" && ref.to.count == 30':
              raise SystemExit("unexpected deltaGrid dimg predicate")
          if lines[i + 2].strip() != '&& items.first(where: { $0.itemID == ref.from })?.type == "grid"':
              raise SystemExit("unexpected deltaGrid item predicate")

          predicate_indent = lines[i + 2][:len(lines[i + 2]) - len(lines[i + 2].lstrip())]
          nested_indent = predicate_indent + "    "
          lines[i + 3:i + 3] = [
              predicate_indent + '&& refs.contains(where: {',
              nested_indent + '$0.type == "auxl" && $0.from == ref.from',
              nested_indent + '    && Set($0.to) == Set([primaryID, tmapID])',
              predicate_indent + '})',
          ]

          guard_index = next(
              j for j in range(i + 4, min(i + 20, len(lines)))
              if lines[j].strip() == 'guard let deltaGrid,'
          )
          data_index = next(
              j for j in range(guard_index + 1, min(guard_index + 15, len(lines)))
              if lines[j].strip().startswith('data.range(of: Data("tag:apple.com,2023:photo:aux:styledeltamap"')
          )
          guard_indent = lines[guard_index][:len(lines[guard_index]) - len(lines[guard_index].lstrip())]
          lines[guard_index:data_index] = [guard_indent + 'guard deltaGrid != nil,']

          path.write_text("\n".join(lines) + "\n")
          PY
          git diff --check
          git diff -- Sources/XDRemuxAppleFeatures/PhotographicStyles/ApplePhotographicStylesPipeline.swift

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/XDRemuxAppleFeatures/PhotographicStyles/ApplePhotographicStylesPipeline.swift
          git commit -m "fix: identify the Styles delta grid structurally"
          git push origin HEAD:test/macos26-photographic-styles-smoke
