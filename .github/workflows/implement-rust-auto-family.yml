name: Verify Rust automatic source generation

on:
  workflow_dispatch:
  push:
    branches: [feat/rust-cli-unification]
    paths:
      - .github/workflows/implement-rust-auto-family.yml
      - scripts/materialize_rust_auto_family.py
      - crates/xdremux-engine/src/lib.rs
      - crates/xdremux-engine/src/product_policy.rs
      - crates/xdremux-runtime/src/lib.rs
      - crates/xdremux-cli/src/lib.rs

permissions:
  contents: write

concurrency:
  group: rust-cli-unification-writer
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
          fetch-depth: 0
      - name: Install portable HEVC provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libheif-plugin-x265 libheif-plugin-libde265
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize automatic detection
        run: |
          python3 scripts/materialize_rust_auto_family.py
          python3 scripts/materialize_rust_auto_family.py
          cargo fmt -p xdremux-engine
          git diff --check
      - name: Enforce product simplicity
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=target --exclude='*.lock' -E 'FamilyPreference|--family' crates/xdremux-engine crates/xdremux-runtime crates/xdremux-cli; then
            echo 'family override leaked into the canonical Rust product surface' >&2
            exit 1
          fi
          cargo run --locked -q -p xdremux-cli -- --help > /tmp/xdremux-help.txt
          if grep -F -- '--family' /tmp/xdremux-help.txt; then
            echo 'canonical CLI must never expose a family override' >&2
            exit 1
          fi
      - name: Verify automatic detection contracts
        run: |
          cargo clippy --locked -p xdremux-engine -p xdremux-runtime -p xdremux-cli --all-targets -- -D warnings
          cargo test --locked -p xdremux-engine source_family_policy_matches_current_product_boundary -- --nocapture
          cargo test --locked -p xdremux-engine -- --nocapture
          cargo test --locked -p xdremux-runtime --lib -- --nocapture
          cargo test --locked -p xdremux-cli --lib -- --nocapture
      - name: Commit automatic detection ownership
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/xdremux-engine/src/lib.rs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(rust): make source generation fully automatic'
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo 'Unexpected dirty working tree after automatic-detection materialization:' >&2
            git status --short >&2
            exit 1
          fi
          git pull --rebase origin feat/rust-cli-unification
          git push origin HEAD:feat/rust-cli-unification
