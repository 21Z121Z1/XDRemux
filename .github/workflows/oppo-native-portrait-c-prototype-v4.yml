name: OPPO native Portrait C prototype v4

on:
  push:
    branches:
      - codex/oppo-native-portrait-c

permissions:
  contents: write

jobs:
  prototype:
    if: ${{ !contains(github.event.head_commit.message, '[oppo-native-c-verified]') }}
    runs-on: macos-26
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install portable HEVC provider
        shell: bash
        run: |
          brew install libheif
          echo "PKG_CONFIG_PATH=$(brew --prefix libheif)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Apply fail-closed OPPO-native Portrait C patch
        shell: bash
        run: |
          python3 scripts/fix_prototype_oppo_native_portrait_c.py
          python3 scripts/prototype_oppo_native_portrait_c.py
          cargo fmt --all
          git diff --check

      - name: Targeted Rust regressions
        shell: bash
        run: |
          cargo test --locked -p xdremux-engine apple::tests::oppo_native_portrait_contract_accepts_only_producer_backed_resources
          cargo test --locked -p xdremux-runtime oppo_portrait::tests::committed_portrait_fixture_supports_oppo_native_profile_c
          cargo test --locked -p xdremux-cli convert_accepts_oppo_native_portrait_profile
          cargo test --locked -p xdremux-cli convert_rejects_combining_complete_and_oppo_native_portrait
          cargo test --locked -p xdremux-runtime --all-targets --release

      - name: Build Apple adapter and canonical CLI
        shell: bash
        run: |
          swift build -c release --product xdremux-apple-adapter
          cargo build --locked -p xdremux-cli --release

      - name: Execute real OPPO-native Portrait C conversion
        shell: bash
        run: |
          ADAPTER_BIN="$(swift build -c release --show-bin-path)/xdremux-apple-adapter"
          FIXTURE="$GITHUB_WORKSPACE/fixtures/proxdr/oppo/find-x9-ultra/uhdr-portrait-01.heic"
          OUTPUT="$RUNNER_TEMP/oppo-native-c.heic"
          export XDREMUX_APPLE_ADAPTER="$ADAPTER_BIN"
          target/release/xdremux convert --input "$FIXTURE" --output "$OUTPUT" --apple-portrait-oppo
          test -s "$OUTPUT"
          target/release/xdremux validate "$OUTPUT"
          python3 - "$ADAPTER_BIN" "$OUTPUT" <<'PY'
          import json, subprocess, sys
          adapter, output = sys.argv[1:]
          request = {"schema_version": 2, "operation": "imageio-auxiliary-facts", "input_path": output}
          response = subprocess.run([adapter], input=(json.dumps(request)+"\n").encode(), check=True, capture_output=True)
          facts = json.loads(response.stdout)["auxiliary"]
          for key in ["iso_gain_map", "disparity", "portrait_effects_matte", "hair_matte", "focus_metadata"]:
              assert facts.get(key) is True, (key, facts)
          for key in ["skin_matte", "teeth_matte", "glasses_matte"]:
              assert facts.get(key) is False, (key, facts)
          print("oppo-native-c-consumer-pass", json.dumps(facts, sort_keys=True))
          PY

      - name: Execute real OPPO-native Portrait C batch path
        shell: bash
        run: |
          ADAPTER_BIN="$(swift build -c release --show-bin-path)/xdremux-apple-adapter"
          FIXTURE="$GITHUB_WORKSPACE/fixtures/proxdr/oppo/find-x9-ultra/uhdr-portrait-01.heic"
          OUTDIR="$RUNNER_TEMP/oppo-native-c-batch"
          mkdir -p "$OUTDIR"
          export XDREMUX_APPLE_ADAPTER="$ADAPTER_BIN"
          target/release/xdremux batch --input "$FIXTURE" --output-dir "$OUTDIR" --apple-portrait-oppo --jobs 2 --json
          OUTPUT="$OUTDIR/uhdr-portrait-01.xdremux.heic"
          test -s "$OUTPUT"
          python3 - "$ADAPTER_BIN" "$OUTPUT" <<'PY'
          import json, subprocess, sys
          adapter, output = sys.argv[1:]
          request = {"schema_version": 2, "operation": "imageio-auxiliary-facts", "input_path": output}
          response = subprocess.run([adapter], input=(json.dumps(request)+"\n").encode(), check=True, capture_output=True)
          facts = json.loads(response.stdout)["auxiliary"]
          assert all(facts.get(k) is True for k in ["iso_gain_map", "disparity", "portrait_effects_matte", "hair_matte", "focus_metadata"]), facts
          assert all(facts.get(k) is False for k in ["skin_matte", "teeth_matte", "glasses_matte"]), facts
          print("oppo-native-c-batch-consumer-pass", json.dumps(facts, sort_keys=True))
          PY

      - name: Verify complete Portrait remains intact
        shell: bash
        run: bash scripts/check_rust_cli_apple_portrait.sh

      - name: Commit verified business changes only
        shell: bash
        run: |
          git status --short
          git add crates/xdremux-engine/src/apple.rs \
            crates/xdremux-runtime/src/oppo_portrait.rs \
            crates/xdremux-runtime/src/lib.rs \
            crates/xdremux-runtime/src/batch.rs \
            crates/xdremux-cli/src/lib.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(portrait): add OPPO-native C profile [oppo-native-c-verified]"
          git push origin HEAD:codex/oppo-native-portrait-c
