name: Rust Motion Photo bootstrap

on:
  push:
    branches: [feat/rust-xdremux-format]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/xdremux-motion-photo/**"
      - ".github/workflows/rust-motion-photo-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply exact compiler fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/xdremux-motion-photo/src/android.rs")
          text = path.read_text()
          old = '            Event::End(element) => {\n                let name = element.name().as_ref();\n'
          new = '            Event::End(element) => {\n                let name = element.name().as_ref().to_owned();\n'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one Event::End QName borrow")
          path.write_text(text.replace(old, new))
          PY
      - name: Normalize and compile
        run: |
          cargo fmt --all
          cargo check -p xdremux-motion-photo
      - name: Lint
        run: cargo clippy -p xdremux-motion-photo --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test -p xdremux-motion-photo
      - name: Commit normalized source and lockfile
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock crates/xdremux-motion-photo; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/xdremux-motion-photo
          git commit -m "style(rust): normalize Android Motion Photo parser"
          git push origin HEAD:feat/rust-xdremux-format
