name: Temporary HEIF profile bootstrap retry

on:
  push:
    branches:
      - feat/rust-xdremux-format
    paths:
      - ".github/workflows/rust-heif-profile-bootstrap-retry-temp.yml"

permissions:
  contents: write

jobs:
  refactor-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-xdremux-format
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Reapply guarded HEIF profile refactor
        shell: bash
        run: |
          awk '
            /python3 - <<'\''PY'\''/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/rust-heif-profile-bootstrap-temp.yml > "$RUNNER_TEMP/heif-profile-refactor.py"
          test -s "$RUNNER_TEMP/heif-profile-refactor.py"
          python3 "$RUNNER_TEMP/heif-profile-refactor.py"
      - name: Update external fail-closed regressions to explicit profile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/xdremux-heif/tests/fail_closed.rs")
          text = path.read_text()
          old = "use xdremux_heif::{replace_private_jpeg_gain_map_with_hevc_tiles, DirectHevcGainMap, GainMapTile};\n"
          new = "use xdremux_format::ChromaSampling;\nuse xdremux_heif::{\n    replace_private_jpeg_gain_map_with_hevc_tiles, DirectHevcGainMap, GainMapChannels,\n    GainMapEncodeProfile, GainMapTile,\n};\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected fail_closed import shape")
          text = text.replace(old, new)
          old = "        channel_count: 3,"
          replacement = "        profile: GainMapEncodeProfile {\n            channels: GainMapChannels::Rgb,\n            chroma: ChromaSampling::Yuv444,\n            luma_bit_depth: 8,\n            chroma_bit_depth: 8,\n        },"
          if text.count(old) != 2:
              raise SystemExit(f"expected two legacy channel_count sites, found {text.count(old)}")
          path.write_text(text.replace(old, replacement))
          PY
      - name: Apply canonical rustfmt
        run: cargo fmt --all
      - name: Verify HEIF profile model
        run: |
          cargo clippy --locked -p xdremux-heif --all-targets -- -D warnings
          cargo test --locked -p xdremux-heif
      - name: Commit verified HEIF profile model
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/xdremux-heif
          git commit -m "refactor(rust): model explicit HEIF Gain Map profiles"
          git push origin HEAD:feat/rust-xdremux-format
