name: Temporary Apple adapter check

on:
  push:
    branches:
      - feat/rust-cli-unification
    paths:
      - .github/workflows/_temp-apple-adapter-check.yml

jobs:
  adapter:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
      - name: Build thin Apple adapter
        shell: bash
        run: swift build --product xdremux-apple-adapter
      - name: Exercise adapter handshake
        shell: bash
        run: bash scripts/check_apple_adapter_handshake.sh
