name: Rustfmt one-shot

on:
  push:
    branches:
      - feat/rust-cli-unification

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rust-cli-unification
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Commit mechanical formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git diff --cached --check
          git commit -m "style: apply rustfmt"
          git push origin HEAD:feat/rust-cli-unification
